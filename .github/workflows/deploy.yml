name: Publicar en Cloudflare Pages

# Publica el sitio en el proyecto ehs-control de Cloudflare Pages en cada push a main.
# No requiere conectar el repo desde el panel de Cloudflare: usa la API con un token.
# Si los secretos todavía no existen, el paso de publicación se omite y el job termina en verde.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio (index.html y encabezados)
        run: |
          mkdir -p dist
          cp index.html _headers dist/

      - name: Publicar
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ehs-control --branch=main

      - name: Verificar
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 20
          curl -fsS https://ehs-control.pages.dev -o /tmp/live.html
          grep -q "EHS-F-097" /tmp/live.html && echo "Publicado: la versión nueva ya está en línea"
