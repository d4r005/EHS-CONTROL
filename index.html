<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EHS Control · Sistema de Gestión EHS</title>
<style>
:root{
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --line:#e2e8f0;
  --bg:#f5f6f8; --card:#ffffff; --accent:#0f766e; --accent-2:#14b8a6;
  --warn:#b45309; --warn-bg:#fef3c7; --danger:#b91c1c; --danger-bg:#fee2e2;
  --ok:#15803d; --ok-bg:#dcfce7; --info:#1d4ed8; --info-bg:#dbeafe;
  --nav:#0e1726; --nav-2:#1a2739;
  --r:10px; --sh:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
  /* Paleta mejorada para formatos */
  --form-ok:#15803d; --form-ok-bg:#dcfce7;
  --form-nc:#b45309; --form-nc-bg:#fef3c7;
  --form-na:#64748b; --form-na-bg:#f1f5f9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:236px;flex:0 0 236px;background:var(--nav);color:#cbd5e1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{display:flex;align-items:center;gap:9px}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent-2),var(--accent));
  display:grid;place-items:center;color:#062a26;font-weight:800;font-size:13px;letter-spacing:-.5px
}
.brand h1{font-size:14.5px;margin:0;color:#fff;font-weight:650;letter-spacing:-.2px}
.brand small{display:block;color:#7b8ba3;font-size:11px;margin-top:2px}
.nav{padding:10px 8px;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#5d6d84;padding:12px 10px 6px;font-weight:700}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:#c3cfdd;
  padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.2px;margin-bottom:1px
}
.nav button:hover{background:var(--nav-2);color:#fff}
.nav button.on{background:rgba(20,184,166,.14);color:#fff;box-shadow:inset 2px 0 0 var(--accent-2)}
.nav .ico{width:16px;text-align:center;opacity:.85;font-size:13px}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.1);color:#dbe6f0;font-size:10.5px;padding:1px 6px;border-radius:20px;font-weight:600}
.nav .badge.alert{background:rgba(185,28,28,.3);color:#fecaca}
.side .foot{padding:10px 16px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#66788f}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20
}
.top h2{font-size:16px;margin:0;font-weight:650;letter-spacing:-.2px}
.top .sub{color:var(--muted);font-size:12.5px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:22px 24px 60px;max-width:1320px;width:100%}

/* ---------- atoms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}.side{display:none}.content{padding:16px}}

h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700}
.kpi{padding:15px 16px}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.8px;margin:5px 0 1px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.warn .val{color:var(--warn)} .kpi.danger .val{color:var(--danger)} .kpi.ok .val{color:var(--ok)}

.btn{
  display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  color:var(--ink-2);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550;font-size:13px;
  transition:.12s
}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0d6b63}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:var(--danger-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:#f1f5f9;color:var(--muted)}
.subhead{background:#fbfcfd}
.nc-in{border-color:#fecaca;background:#fff7f7}

table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:#fbfcfd;white-space:nowrap
}
td{padding:9px 10px;border-bottom:1px solid #eef2f6;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
td.num{font-variant-numeric:tabular-nums;text-align:right}

input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
  outline:none;transition:.12s
}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(20,184,166,.14)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}

.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:26px;opacity:.35;margin-bottom:6px}
.hr{height:1px;background:var(--line);margin:16px 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tag{font-size:11px;background:#f1f5f9;color:var(--ink-2);padding:1px 6px;border-radius:5px;font-weight:600;white-space:nowrap}

.bar{height:7px;background:#eef2f6;border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:20px}

.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(15,23,42,.3)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:15px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fbfcfd;border-radius:0 0 14px 14px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:9px;font-size:13px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* ---------- documento imprimible ---------- */
#printRoot{display:none}
.pdoc{font-family:Arial,Helvetica,"Segoe UI",sans-serif;font-size:9pt;color:#111;background:#fff;line-height:1.35}
.pdoc *{box-sizing:border-box}
.pdoc .hdr{display:flex;align-items:center;gap:14px;padding-bottom:7px;border-bottom:2.5px solid var(--co,#111)}
.pdoc .hdr img{height:42px;width:auto;flex:0 0 auto}
.pdoc .hdr .co{flex:1;text-align:center;min-width:0}
.pdoc .hdr .co .n{font-size:12pt;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.15}
.pdoc .hdr .co .s{font-size:8.5pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#333;margin-top:3px}
.pdoc .hdr .co .c{font-size:8pt;color:#444;margin-top:2px}
.pdoc .hdr .rev{flex:0 0 auto;border:1.5px solid #111;padding:4px 9px;text-align:center;font-size:7pt;text-transform:uppercase;letter-spacing:.05em}
.pdoc .hdr .rev b{display:block;font-size:10pt;letter-spacing:.03em;margin-bottom:1px}
.pdoc .ctrl{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #111;border-top:0}
.pdoc .ctrl div{padding:3px 7px;border-right:1px solid #111;font-size:8pt}
.pdoc .ctrl div:last-child{border-right:0}
.pdoc .ctrl b{display:block;font-size:6.5pt;text-transform:uppercase;letter-spacing:.08em;color:#555;font-weight:700}
.pdoc .title{background:var(--co,#ECB324);color:var(--co-txt,#111);border:1px solid #111;border-top:0;padding:6px 10px;text-align:center}
.pdoc .title h1{font-size:11pt;margin:0;text-transform:uppercase;letter-spacing:.02em;font-weight:800}
.pdoc .title .n{font-size:7.5pt;font-weight:700;letter-spacing:.05em;margin-top:2px}
.pdoc table.meta{width:100%;border-collapse:collapse;font-size:8.5pt}
.pdoc table.meta td{border:1px solid #111;padding:4px 7px;height:26px;vertical-align:top}
.pdoc table.meta td b{display:block;font-size:6.5pt;text-transform:uppercase;letter-spacing:.08em;color:#555;font-weight:700}
.pdoc h2{font-size:8.5pt;margin:12px 0 0;padding:3px 8px;background:#F2F2F2;border:1px solid #111;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.pdoc table.chk{width:100%;border-collapse:collapse;font-size:8pt}
.pdoc table.chk th{border:1px solid #111;padding:3px 4px;background:var(--co-soft,#FDF0CE);font-size:7pt;text-transform:uppercase;letter-spacing:.03em;font-weight:700;text-align:center}
.pdoc table.chk td{border:1px solid #111;padding:3px 5px;vertical-align:top}
.pdoc table.chk td.c{text-align:center;font-weight:700}
.pdoc table.chk tbody tr:nth-child(even) td{background:#FAFAFA}
.pdoc table.tb{width:100%;border-collapse:collapse;font-size:8pt;margin-top:10px}
.pdoc table.tb th{border:1px solid #111;padding:4px;background:var(--co-soft,#FDF0CE);font-size:7.5pt;text-transform:uppercase;letter-spacing:.03em;font-weight:700;text-align:center}
.pdoc table.tb td{border:1px solid #111;padding:3px 5px;height:20px;vertical-align:top}
.pdoc .txt{font-size:8.5pt;white-space:pre-wrap;border:1px solid #111;padding:6px;min-height:40px}
.pdoc .blank{border:1px solid #111}
.pdoc .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
.pdoc .sig .sg{text-align:center;font-size:7.5pt}
.pdoc .sig .sg .l{display:block;border-top:1px solid #111}
.pdoc .sig .sg .nm{height:32px}
.pdoc .foot{margin-top:14px;padding-top:5px;border-top:1px solid #111;font-size:6.8pt;color:#444;display:flex;justify-content:space-between;gap:10px}
.pdoc .note{font-size:7.5pt;color:#333;margin-top:6px}
.pdoc .avoid{break-inside:avoid}
.sheet-wrap{background:#e9edf2;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:58vh;overflow:auto}
.sheet-zoom{zoom:.62;background:#fff;padding:10mm 9mm;box-shadow:0 4px 16px rgba(15,23,42,.18)}
html[data-theme="dark"] .sheet-wrap{background:#0d1521}
@media print{
  @page{size:letter portrait;margin:12mm 11mm}
  body{background:#fff}
  .app,.toast,.modal-wrap,.login{display:none !important}
  #printRoot{display:block}
  tr{break-inside:avoid}
}

/* ---------- login ---------- */
.login{position:fixed;inset:0;background:linear-gradient(160deg,#0e1726,#12263a 55%,#0f3b36);display:grid;place-items:center;padding:24px;z-index:100}
.login[hidden]{display:none}
.lcard{width:100%;max-width:382px;background:#fff;border-radius:14px;padding:26px 24px;box-shadow:0 20px 50px rgba(2,8,20,.45)}
.lbrand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.lbrand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#062a26;font-weight:800;font-size:14px}
.lbrand h1{font-size:15px;margin:0;letter-spacing:-.2px}
.lbrand small{display:block;color:var(--muted);font-size:11px}
.lcard h2{font-size:18px;margin:0 0 4px;letter-spacing:-.3px}
.lhint{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.lcard label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:12px}
.lcard input{width:100%;margin-top:5px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.lcard input:focus{outline:2px solid rgba(20,184,166,.35);border-color:var(--accent-2)}
.lerr{color:var(--danger);font-size:12.5px;min-height:17px;margin-bottom:8px}
.lfoot{margin-top:16px;text-align:center;font-size:11px;color:var(--muted)}
.lcard .btn{width:100%;justify-content:center;padding:10px}
.userbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex:0 0 auto}
.sync{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.ok{background:var(--ok-bg);border-color:#bbf7d0;color:var(--ok)}
.sync.busy{background:var(--info-bg);border-color:#bfdbfe;color:var(--info)}
.sync.err{background:var(--danger-bg);border-color:#fecaca;color:var(--danger)}
.ubtn{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;color:var(--ink-2);cursor:pointer}
.ubtn:hover{background:var(--bg)}
@media(max-width:820px){.userbox .uemail{display:none}}

/* ---------- modo oscuro ---------- */
html[data-theme="dark"]{
  --ink:#e8eef6; --ink-2:#c8d5e3; --muted:#9aa9bb; --line:#33445a;
  --bg:#0b1220; --card:#16202e; --nav:#0a111c; --nav-2:#16202e;
  --warn:#fbbf24; --warn-bg:#3a2a08; --danger:#fca5a5; --danger-bg:#3b1414;
  --ok:#6ee7b7; --ok-bg:#0f3d2e; --info:#93c5fd; --info-bg:#12283f;
  color-scheme:dark;
}
html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] .top{background:var(--card);border-bottom-color:var(--line)}
html[data-theme="dark"] .card,html[data-theme="dark"] .lcard{background:var(--card);border-color:var(--line)}
html[data-theme="dark"] .subhead{background:#1b2836}
html[data-theme="dark"] .top h2,html[data-theme="dark"] .kpi .val{color:var(--ink)}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{
  background:#0f1a27;color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:#7b8ba3}
html[data-theme="dark"] .nc-in{border-color:#7f1d1d;background:#2a1212}

/* botones */
html[data-theme="dark"] .btn{background:#243449;border-color:#3d5068;color:#e8eef6}
html[data-theme="dark"] .btn:hover{background:#2e425c;border-color:#4a5f7a}
html[data-theme="dark"] .btn.primary{background:#14b8a6;border-color:#14b8a6;color:#062a26}
html[data-theme="dark"] .btn.primary:hover{background:#2dd4bf;border-color:#2dd4bf}
html[data-theme="dark"] .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
html[data-theme="dark"] .btn.danger{background:#2a1212;border-color:#7f1d1d;color:#fca5a5}
html[data-theme="dark"] .btn.danger:hover{background:#3b1414}

/* etiquetas y chips */
html[data-theme="dark"] .tag{background:#243449;color:#dbe6f0}
html[data-theme="dark"] .pill.mute{background:#243449;color:#c8d5e3}
html[data-theme="dark"] .pill.ok{background:#0f3d2e;color:#6ee7b7}
html[data-theme="dark"] .pill.warn{background:#3a2a08;color:#fbbf24}
html[data-theme="dark"] .pill.danger{background:#3b1414;color:#fca5a5}
html[data-theme="dark"] .pill.info{background:#12283f;color:#93c5fd}
html[data-theme="dark"] .bar{background:#243449}
html[data-theme="dark"] .mono{color:#7dd3c0}

/* tablas */
html[data-theme="dark"] table th{background:#1b2836;color:var(--ink)}
html[data-theme="dark"] tbody tr:hover{background:#1b2836}
html[data-theme="dark"] tr:nth-child(even) td{background:#131e2b}

/* modal, avisos y login */
html[data-theme="dark"] .modal{background:#16202e;color:var(--ink)}
html[data-theme="dark"] .modal .mf{background:#131e2b}
html[data-theme="dark"] .toast{background:#e8eef6;color:#0b1220;font-weight:600}
html[data-theme="dark"] .login{background:linear-gradient(160deg,#080e18,#0d1b2a 55%,#0a2b27)}
html[data-theme="dark"] .lcard input{background:#0f1a27;color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .lfoot,html[data-theme="dark"] .lhint{color:var(--muted)}
html[data-theme="dark"] .lerr{color:#fca5a5}

/* ---------- marca y selector de empresa ---------- */
.brand{padding:14px 14px 12px}
.brandimg{display:block;width:100%;max-width:200px;height:auto;margin:0 auto 10px}
.emp{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:8px;padding:5px 6px}
.emplogo{height:20px;width:auto;max-width:54px;object-fit:contain;background:#fff;border-radius:4px;padding:1px 2px;flex:0 0 auto}
.emp select{flex:1;min-width:0;background:transparent;border:0;color:#dbe6f0;font-size:11.5px;font-weight:600;padding:2px;cursor:pointer}
.emp select option{color:#0f172a}
.empadd{background:rgba(20,184,166,.2);border:0;color:#7dd3c0;font-weight:800;border-radius:6px;width:20px;height:20px;line-height:1;cursor:pointer;flex:0 0 auto}
.empadd:hover{background:rgba(20,184,166,.38)}
.logobox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:120px;min-height:56px;display:grid;place-items:center}
.logobox img{max-height:44px;max-width:150px;object-fit:contain}
html[data-theme="dark"] .logobox{background:#f8fafc}
</style>
</head>
<body>
<div class="login" id="loginScreen">
  <form class="lcard" id="loginForm" novalidate>
    <div class="lbrand">
      <img id="loginLogo" alt="EHS Control" style="height:54px;width:auto">
    </div>
    <h2>Iniciar sesión</h2>
    <p class="lhint">Acceso para coordinadores EHS.</p>
    <label>Correo electrónico
      <input id="loginEmail" type="email" required autocomplete="username" placeholder="nombre@empresa.com">
    </label>
    <label>Contraseña
      <input id="loginPass" type="password" required autocomplete="current-password" placeholder="••••••••">
    </label>
    <div class="lerr" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" type="submit">Entrar</button>
    <div class="lfoot">North America Flooring · SHELSER</div>
  </form>
</div>
<div class="app" id="appRoot" style="display:none">
  <aside class="side">
    <div class="brand">
      <img id="brandImg" alt="EHS Control" class="brandimg">
      <div class="emp">
        <img id="empLogo" alt="" class="emplogo">
        <select id="empSel" onchange="cambiarCentro(this.value)" title="Empresa / centro de trabajo"></select>
        <button class="empadd" onclick="nuevaEmpresa()" title="Agregar empresa">+</button>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="footOrg">—</div>
      <div style="margin-top:3px;opacity:.7">Marco: STPS · ISO 14001/45001</div>
    </div>
  </aside>

function logoSrc(){ const l=(DB.org&&DB.org.logo)||''; return l||LOGO_DEF; }
function colorEmp(){ const c=(DB.org&&DB.org.color)||''; return /^#[0-9a-fA-F]{6}$/.test(c)?c:COLOR_DEF; }
function rgbDe(hex){ const h=hex.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function tinte(hex,a){ const [r,g,b]=rgbDe(hex); const m=v=>Math.round(255-(255-v)*a); return `rgb(${m(r)},${m(g)},${m(b)})`; }
function textoColor(hex){ const [r,g,b]=rgbDe(hex); return (0.2126*r+0.7152*g+0.0722*b)>150?'#111':'#fff'; }

function loadSession(){ try{ return JSON.parse(localStorage.getItem(SKEY)||'null'); }catch(e){ return null; } }
function saveSession(v){ try{ v?localStorage.setItem(SKEY,JSON.stringify(v)):localStorage.removeItem(SKEY); }catch(e){} }
function authMsg(d){
  const m=(d&&(d.error_description||d.msg||d.message||d.error))||'';
  if(/invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/email not confirmed/i.test(m)) return 'El correo no está confirmado.';
  if(/rate limit|too many/i.test(m)) return 'Demasiados intentos. Espera un momento.';
  return m||'No se pudo iniciar sesión.';
}
async function authLogin(email,password){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(authMsg(d));
  SESSION={access_token:d.access_token,refresh_token:d.refresh_token,
    expires_at:Date.now()+((d.expires_in||3600)-60)*1000,
    email:(d.user&&d.user.email)||email,uid:d.user&&d.user.id};
  saveSession(SESSION); return SESSION;
}
async function authRefresh(){
  if(!SESSION||!SESSION.refresh_token) throw new Error('Sin sesión');
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:SESSION.refresh_token})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(authMsg(d));
  SESSION=Object.assign({},SESSION,{access_token:d.access_token,refresh_token:d.refresh_token,
    expires_at:Date.now()+((d.expires_in||3600)-60)*1000,
    uid:(d.user&&d.user.id)||SESSION.uid,email:(d.user&&d.user.email)||SESSION.email});
  saveSession(SESSION); return SESSION;
}
function authLogout(){ SESSION=null; saveSession(null); location.reload(); }
async function sb(path,opts){
  opts=opts||{};
  if(!SESSION) throw new Error('Sin sesión');
  if(SESSION.expires_at&&Date.now()>SESSION.expires_at){ try{ await authRefresh(); }catch(e){} }
  const call=()=>fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opts,{
    headers:Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.access_token,'Content-Type':'application/json'},opts.headers||{})}));
  let r=await call();
  if(r.status===401){ await authRefresh(); r=await call(); }
  const txt=await r.text();
  if(!r.ok) throw new Error('supabase '+r.status+': '+txt.slice(0,180));
  return txt?JSON.parse(txt):null;
}
async function sbRpc(fn,body){
  if(!SESSION) throw new Error('Sin sesión');
  if(SESSION.expires_at&&Date.now()>SESSION.expires_at){ try{ await authRefresh(); }catch(e){} }
  const call=()=>fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.access_token,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  let r=await call();
  if(r.status===401){ await authRefresh(); r=await call(); }
  const txt=await r.text();
  if(!r.ok){
    let msg=txt, code=null;
    try{ const j=JSON.parse(txt); msg=j.message||j.hint||txt; code=j.code||null; }catch(e){}
    const err=new Error(msg); err.code=code; throw err;
  }
  return txt?JSON.parse(txt):null;
}

  if(!id||id===CENTRO_ID) return;
  const c=CENTROS.find(x=>x.id===id)||{};
  const org=Object.assign({},DB.org,{nombre:c.razon_social||c.nombre||DB.org.nombre,centro:c.nombre||'',

  try{
    const remote=await pullCloud();
    if(remote&&remote.data&&Object.keys(remote.data).length){
      DB=Object.assign({},DEFAULTS,remote.data,{org:Object.assign({},org,remote.data.org||{})});

      DB=JSON.parse(JSON.stringify(DEFAULTS)); DB.org=org;

    }

function subirLogo(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=320; let w=img.width,h=img.height;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      DB.org.logo=cv.toDataURL('image/png');
      save(); guardarEmpresa(); renderEmp();
      document.getElementById('view').innerHTML=vDatos();
      toast('Logo actualizado');
    };
    img.onerror=()=>toast('No se pudo leer la imagen');
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

  const nombre=(DB.org&&DB.org.centro)||'Centro de trabajo';

  CENTRO_ID=ins[0].id; return CENTRO_ID;

async function pullCloud(){
  await ensureCentro();
  const rows=await sb('ehs_estado?select=data,updated_at,version&centro_id=eq.'+CENTRO_ID);
  if(rows&&rows.length){ CENTRO_VERSION=rows[0].version; return rows[0]; }
  CENTRO_VERSION=null;
  return null;
}
async function pushCloud(){
  await ensureCentro();
  if(CENTRO_VERSION===null){
    const ins=await sb('ehs_estado?on_conflict=centro_id',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify([{centro_id:CENTRO_ID,data:DB,updated_by:(SESSION&&SESSION.uid)||null}])});
    CENTRO_VERSION=(ins&&ins[0]&&ins[0].version)||1;
    return;
  }
  const nueva=await sbRpc('ehs_guardar_estado',{p_centro:CENTRO_ID,p_data:DB,p_version:CENTRO_VERSION});
  if(typeof nueva==='number') CENTRO_VERSION=nueva;

    try{ setSync('busy'); await pushCloud(); setSync('ok'); }

  const _li=document.getElementById('loginLogo'); if(_li) _li.src=LOGO_APP;
  const _bi=document.getElementById('brandImg'); if(_bi) _bi.src=LOGO_APP;
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');

    err.textContent='';

    try{
      await authLogin(email,pass);

function go(v){ VIEW=v; try{history.replaceState(null,'','#'+v)}catch(e){} renderNav(); const [t,s]=TITLES[v]||['','']; document.getElementById('pageTitle').textContent=t; document.getElementById('pageSub').textContent=s; document.getElementById('topActions').innerHTML=''; document.getElementById('view').innerHTML=({panel:vPanel,formatos:vFormatos,registros:vRegistros,hallazgos:vHallazgos,incidentes:vIncidentes,normas:vNormas,comision:vComision,quimicos:vQuimicos,capacitacion:vCapacitacion,datos:vDatos}[v]||(()=>''))(); window.scrollTo(0,0); }

/* ============================ PANEL ============================ */
function vPanel(){
  const apl=NORMAS.filter(n=>normAplica(n.k));
  const conEv=apl.filter(n=>docsDe(n.k).length).length;
  const cob=apl.length?Math.round(conEv/apl.length*100):0;
  const ab=DB.hallazgos.filter(h=>h.estado!=='Cerrado');
  const venc=ab.filter(h=>h.fechaComp&&h.fechaComp<hoy());
  const anio=DB.org.anio||new Date().getFullYear();
  const incAnio=DB.incidentes.filter(i=>(i.fecha||'').startsWith(String(anio)));
  const conIncap=incAnio.filter(i=>Number(i.dias)>0).length;
  const dc3=DB.capacitacion.filter(c=>c.dc3==='Sí').length;
  const docsAnio=DB.docs.filter(d=>(d.fecha||'').startsWith(String(anio)));
  const ult=DB.docs.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')).slice(0,6);
  const criticas=apl.map(n=>({n,e:estadoNorma(n.k)})).filter(x=>x.e.c==='danger'||x.e.c==='mute').slice(0,6);

  return `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card kpi ${cob>=70?'ok':cob>=40?'warn':'danger'}">
      <div class="lbl">Cobertura de evidencia</div><div class="val">${cob}%</div>
      <div class="bar" style="margin-top:6px"><i style="width:${cob}%;background:${cob>=70?'var(--ok)':cob>=40?'var(--warn)':'var(--danger)'}"></i></div>
      <div class="hint" style="margin-top:6px">${conEv} de ${apl.length} normas con registro</div>
    </div>
    <div class="card kpi ${venc.length?'danger':ab.length?'warn':'ok'}">
      <div class="lbl">Hallazgos abiertos</div><div class="val">${ab.length}</div>
      <div class="hint">${venc.length} vencidos · ${ab.filter(h=>h.prioridad==='Alta').length} de prioridad alta</div>
    </div>
    <div class="card kpi ${incAnio.length?'warn':'ok'}">
      <div class="lbl">Incidentes ${anio}</div><div class="val">${incAnio.length}</div>
      <div class="hint">${conIncap} con días de incapacidad</div>
    </div>
    <div class="card kpi">
      <div class="lbl">Registros ${anio}</div><div class="val">${docsAnio.length}</div>
      <div class="hint">${dc3} DC-3 registradas</div>
    </div>
  </div>

  <div class="grid g2">
    <div class="card pad">
      <h3 class="sec">Normas que requieren atención</h3>
      ${criticas.length?criticas.map(x=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f6">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px">${esc(x.n.k)}</div>
            <div class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n.t)}</div>
          </div>
          <span class="pill ${x.e.c}">${x.e.t}</span>
        </div>`).join(''):'<div class="empty small">Todo con evidencia registrada.</div>'}
      <div style="margin-top:12px"><button class="btn sm" onclick="go('normas')">Ver marco normativo →</button></div>
    </div>

    <div class="card pad">
      <h3 class="sec">Últimos registros</h3>
      ${ult.length?ult.map(d=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f6;cursor:pointer" onclick="abrirDoc('${d.id}')">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px">${esc(d.n)}</div>
            <div class="small muted">${esc(d.c)} · ${fdate(d.fecha)} · ${esc(d.f&&d.f.area?d.f.area:'—')}</div>
          </div>
          <span class="pill mute">Abrir</span>
        </div>`).join(''):'<div class="empty small">Aún no hay registros. Crea uno desde <b>Formatos</b>.</div>'}
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn sm primary" onclick="go('formatos')">Nuevo formato</button>
        <button class="btn sm" onclick="go('registros')">Ver todos</button>
      </div>
    </div>
  </div>

  <div class="card pad" style="margin-top:16px">
    <h3 class="sec">Accesos rápidos</h3>
    <div class="grid g4">
      ${[['EHS-F-014','Acta de recorrido de la comisión'],['EHS-F-004','Guardas y dispositivos en maquinaria'],['EHS-F-011','Entrega de EPP por puesto'],['EHS-F-032','Investigación de incidente']].map(([c,t])=>`
        <button class="btn" style="justify-content:flex-start;text-align:left;height:100%" onclick="nuevoDoc('${c}')">
          <span class="mono" style="color:var(--accent);font-weight:700">${c}</span><br><span class="small">${t}</span></button>`).join('')}
    </div>
  </div>`;
}

/* ============================ NORMAS ============================ */
function vNormas(){
  const grupos=['Seguridad','Salud','Organización','Específicas','Sistemas'];
  return grupos.map(g=>{
    const ns=NORMAS.filter(n=>n.g===g);
    if(!ns.length) return '';
    const apl=ns.filter(n=>normAplica(n.k)).length;
    return `<div class="card" style="margin-bottom:16px;overflow:hidden">
      <div class="subhead" style="padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px">
        <h3 class="sec" style="margin:0">${g}</h3>
        <span class="tag">${apl} de ${ns.length} aplicables</span>
      </div>
      <table><thead><tr><th style="width:190px">Norma</th><th>Título</th><th style="width:90px">Aplica</th><th style="width:80px">Formatos</th><th style="width:110px">Estado</th><th style="width:60px"></th></tr></thead><tbody>
      ${ns.map(n=>{const e=estadoNorma(n.k);const a=normAplica(n.k);const fd=FORMATOS.filter(f=>f.nk===n.k);
        return `<tr style="opacity:${a?1:.5}">
          <td class="mono" style="font-weight:600">${esc(n.k)}</td>
          <td>${esc(n.t)}${a?'':''}</td>
          <td><input type="checkbox" ${a?'checked':''} onchange="toggleNorma('${n.k}',this.checked)" style="width:16px;height:16px;cursor:pointer"></td>
          <td class="small muted">${fd.length?fd.length+' disponibles':'—'}</td>
          <td>${a?`<span class="pill ${e.c}">${e.t}</span>`:'<span class="pill mute">No aplica</span>'}</td>
          <td><button class="btn sm ghost" onclick="verNorma('${n.k}')">Ver</button></td>
        </tr>`}).join('')}
      </tbody></table></div>`;
  }).join('')+`<div class="card pad"><div class="small muted">Vigencia verificada contra el marco normativo de la STPS: 35 NOM de aplicación en los centros de trabajo (las de producto no se incluyen), más ISO 14001, ISO 45001 y los trámites del IMSS. Notas de actualización: <b>NOM-017-STPS-2024</b> sustituye a la de 2008; <b>NOM-006-STPS-2023</b> sustituye a la de 2000; la <b>NOM-005-STPS-2025</b> está publicada como proyecto y sustituirá a la NOM-005-STPS-1998. Confirma la publicación definitiva en el DOF antes de actualizar tus formatos.</div></div>`;
}
function toggleNorma(k,v){ DB.normas[k]=Object.assign({},DB.normas[k],{aplica:v}); save(); go('normas'); }
function verNorma(k){
  const n=NORMAS.find(x=>x.k===k); if(!n) return;
  const fd=FORMATOS.filter(f=>f.nk===k);
  const docs=docsDe(k), hs=hallAbiertos(k);
  modal(`<b class="mono">${esc(n.k)}</b> — ${esc(n.t)}`,`
    <p class="small muted" style="margin-top:0">${esc(n.g)} · ${normAplica(k)?'Aplicable':'No aplicable'} al centro de trabajo</p>
    <h3 class="sec">Requisitos clave</h3>
    <ul style="margin:0 0 14px;padding-left:18px">${(n.r||[]).map(r=>`<li style="margin-bottom:4px">${esc(r)}</li>`).join('')||'<li class="muted">Sin requisitos capturados.</li>'}</ul>
    ${(n.e&&n.e.length)?`<h3 class="sec">Evidencias que debe conservar</h3><ul style="margin:0 0 14px;padding-left:18px">${n.e.map(e=>`<li style="margin-bottom:4px">${esc(e)}</li>`).join('')}</ul>`:''}
    <h3 class="sec">Formatos vinculados</h3>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
      ${fd.length?fd.map(f=>`<button class="btn sm" onclick="cerrarModal();nuevoDoc('${f.c}')"><span class="mono">${f.c}</span> · ${esc(f.n)}</button>`).join(''):'<span class="small muted">Sin formatos en la biblioteca.</span>'}
    </div>
    <div class="row">
      <div class="card pad" style="box-shadow:none"><div class="lbl small muted">Registros</div><div style="font-size:20px;font-weight:700">${docs.length}</div></div>
      <div class="card pad" style="box-shadow:none"><div class="lbl small muted">Hallazgos abiertos</div><div style="font-size:20px;font-weight:700">${hs.length}</div></div>
    </div>`,`<button class="btn" onclick="cerrarModal()">Cerrar</button>`);
}
</script>
<script>
/* ============================ FORMATOS ============================ */
function setFmtTipo(t){ window.__fmtTipo=t; document.getElementById('view').innerHTML=vFormatos(); }
function vFormatos(){
  const q=(window.__q||'').trim().toLowerCase();
  const tipo=window.__fmtTipo||'';
  const list=FORMATOS.filter(f=>{
    if(tipo&&f.tipo!==tipo) return false;
    if(!q) return true;
    const n=(f.n+' '+f.c+' '+f.nk).toLowerCase();
    if(n.includes(q)) return true;
    return q.split(/\s+/).filter(w=>w.length>2).every(w=>n.includes(w));
  });
  const grupos=[...new Set(list.map(f=>f.nk))];
  const chip=(val,label,on)=>`<span class="pill ${on?'ok':'mute'}" style="cursor:pointer" onclick="setFmtTipo('${val}')">${label}</span>`;
  const tipoChips=[chip('','Todos',!tipo),chip('check','Listas',tipo==='check'),chip('tabla','Tablas',tipo==='tabla'),chip('acta','Actas',tipo==='acta')].join(' ');
  return `<div class="card pad" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="text" placeholder="Buscar formato por nombre, código o norma…" value="${esc(window.__q||'')}" oninput="window.__q=this.value;document.getElementById('view').innerHTML=vFormatos()" style="max-width:420px">
      <span class="small muted">${list.length} formatos</span>
      <div style="white-space:nowrap">${tipoChips}</div>
      <div style="margin-left:auto"><button class="btn sm" onclick="go('registros')">Ver registros →</button></div>
    </div>`+
  grupos.map(g=>{
    const fs=list.filter(f=>f.nk===g);
    return `<div style="margin-bottom:18px">
      <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:8px">
        <h3 class="sec" style="margin:0">${esc(g)}</h3><span class="tag">${fs.length}</span>
      </div>
      <div class="grid g3">
        ${fs.map(f=>`<div class="card pad" style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="mono" style="color:var(--accent);font-weight:700;font-size:12px">${f.c}</span>
            <span class="tag">${f.frec}</span>
          </div>
          <div style="font-weight:600;font-size:13.5px;line-height:1.35">${esc(f.n)}</div>
          <div class="small muted" style="flex:1">${esc(f.p)}</div>
          <div style="display:flex;gap:6px;margin-top:4px">
            <button class="btn sm primary" onclick="nuevoDoc('${f.c}')">Llenar</button>
            <button class="btn sm" onclick="previewFormato('${f.c}')">Ver</button>
          </div>
        </div>`).join('')}
      </div></div>`;
  }).join('');
}
function previewFormato(c){
  const f=FORMATOS.find(x=>x.c===c); if(!f) return;
  const demo={id:'demo',c:f.c,n:f.n,nk:f.nk,tipo:f.tipo,fecha:hoy(),f:{fecha:hoy()},it:{},ob:{},bl:{}};
  if(f.tipo==='tabla') demo.tb=Array.from({length:Math.min(f.nFilas||6,8)},()=>f.cols.map(()=>''));
  if(f.tipo==='acta') f.bloques.forEach((b,i)=>demo.bl[i]='');
  modal(`${f.c} — ${esc(f.n)}`,
    `<div class="sheet-wrap"><div class="sheet-zoom">${sheetHTML(demo,f)}</div></div>
     <p class="small muted" style="margin:10px 0 0">${esc(f.p||'')}<br>${esc(f.nk)} · ${esc(f.frec)} · Firmas: ${(f.firmas||FIRMAS_BASE).join(' · ')}</p>`,
    `<button class="btn" onclick="cerrarModal()">Cerrar</button><button class="btn primary" onclick="cerrarModal();nuevoDoc('${f.c}')">Llenar ahora</button>`);
}

/* ============================ EDITOR DE DOCUMENTO ============================ */
let OPEN=null;
function nuevoDoc(c){
  const f=FORMATOS.find(x=>x.c===c); if(!f) return;
  const d={id:uid(),c:f.c,n:f.n,nk:f.nk,tipo:f.tipo,fecha:hoy(),estado:'Abierto',creado:new Date().toISOString(),f:{fecha:hoy()},it:{},ob:{},tb:[],bl:{}};
  if(f.tipo==='tabla'){ d.tb=Array.from({length:f.nFilas||6},()=>f.cols.map(()=>'')); }
  if(f.tipo==='acta'){ f.bloques.forEach((b,i)=>d.bl[i]=''); }
  DB.docs.push(d); save(); abrirDoc(d.id);
}
function abrirDoc(id){ OPEN=id; const d=DB.docs.find(x=>x.id===id); if(!d) return go('registros');
  VIEW='doc'; renderNav(); document.getElementById('pageTitle').textContent=d.c;
  document.getElementById('pageSub').textContent=d.n+' · '+d.nk;
  document.getElementById('topActions').innerHTML=`<button class="btn sm" onclick="go('registros')">← Registros</button>`;
  document.getElementById('view').innerHTML=vDoc(); window.scrollTo(0,0); }

function vDoc(){
  const d=DB.docs.find(x=>x.id===OPEN); if(!d) return '<div class="empty">Documento no encontrado.</div>';
  const f=FORMATOS.find(x=>x.c===d.c)||{campos:CAMPOS_BASE,sec:[],firmas:FIRMAS_BASE};
  const campos=f.campos||CAMPOS_BASE;
  const nc=Object.values(d.it||{}).filter(v=>v==='NC').length;
  const resp=Object.values(d.it||{}).filter(v=>v==='C').length;
  const total=Object.keys(d.it||{}).length;

  let cuerpo='';
  if(d.tipo==='check'){
    cuerpo=(f.sec||[]).map((s,si)=>`
      <div class="card" style="margin-bottom:12px;overflow:hidden">
        <div class="subhead" style="padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center">
          <b style="font-size:13px">${esc(s.t)}</b>${s.ref?`<span class="tag">${esc(s.ref)}</span>`:''}
          <span class="small muted" style="margin-left:auto">${s.it.length} puntos</span>
        </div>
        ${s.it.map((t,ii)=>{ const k=`s${si}i${ii}`; const val=(d.it||{})[k]||'';
          return `<div style="display:grid;grid-template-columns:1fr 132px;gap:10px;padding:9px 14px;border-bottom:1px solid #eef2f6;align-items:center">
            <div>
              <div style="font-size:13px">${esc(t)}</div>
              ${val==='NC'?`<input type="text" placeholder="Describe la condición encontrada (genera hallazgo)" value="${esc((d.ob||{})[k]||'')}" oninput="setOb('${d.id}','${k}',this.value)" class="nc-in" style="margin-top:6px;font-size:12.5px">`:''}
            </div>
            <div style="display:flex;gap:4px;justify-content:flex-end">
              ${['C','NC','NA'].map(o=>`<button class="btn sm" onclick="setIt('${d.id}','${k}','${o}')" style="min-width:40px;justify-content:center;${val===o?`background:${o==='C'?'var(--ok-bg)':o==='NC'?'var(--danger-bg)':'#eef2f6'};border-color:${o==='C'?'#86efac':o==='NC'?'#fecaca':'#cbd5e1'};font-weight:700`:''}">${o}</button>`).join('')}
            </div>
          </div>`}).join('')}
      </div>`).join('');
  } else if(d.tipo==='tabla'){
    cuerpo=`<div class="card" style="overflow:auto">
      <table><thead><tr>${f.cols.map(c=>`<th style="min-width:110px">${esc(c[1])}</th>`).join('')}<th style="width:36px"></th></tr></thead>
      <tbody>${d.tb.map((row,ri)=>`<tr>${f.cols.map((c,ci)=>`<td style="padding:4px"><input type="text" value="${esc(row[ci]||'')}" oninput="setTb('${d.id}',${ri},${ci},this.value)" style="border:0;background:transparent;padding:4px"></td>`).join('')}
        <td style="padding:4px"><button class="btn sm ghost" onclick="delFila('${d.id}',${ri})" title="Eliminar fila">✕</button></td></tr>`).join('')}</tbody></table>
      <div style="padding:10px 14px;border-top:1px solid var(--line)"><button class="btn sm" onclick="addFila('${d.id}')">+ Agregar fila</button></div>
    </div>`;
  } else {
    cuerpo=`<div class="card pad">${(f.bloques||[]).map((b,i)=>`
      <label class="fld"><span>${esc(b.t)}</span>
        <textarea rows="${b.rows||4}" oninput="setBl('${d.id}',${i},this.value)">${esc((d.bl||{})[i]||'')}</textarea>
      </label>`).join('')}</div>`;
  }

  return `
  <div class="card pad" style="margin-bottom:14px">
    <div class="row">
      ${campos.map(c=>{
        const [k,lbl,type]=c;
        const val=(d.f||{})[k]||'';
        if(type==='date') return `<label class="fld" style="max-width:170px"><span>${esc(lbl)}</span><input type="date" value="${esc(val)}" oninput="setF('${d.id}','${k}',this.value)"></label>`;
        if(type&&type.startsWith('sel:')) return `<label class="fld" style="max-width:200px"><span>${esc(lbl)}</span><select onchange="setF('${d.id}','${k}',this.value)"><option value="">—</option>${type.slice(4).split('|').map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
        return `<label class="fld" style="min-width:170px"><span>${esc(lbl)}</span><input type="text" value="${esc(val)}" oninput="setF('${d.id}','${k}',this.value)"></label>`;
      }).join('')}
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
    <span class="small muted">${d.tipo==='check'?`${total?resp+nc+Object.values(d.it).filter(v=>v==='NA').length:0} de ${(f.sec||[]).reduce((a,s)=>a+s.it.length,0)} evaluados · <b style="color:var(--danger)">${nc} NC</b>`:'Registro'}</span>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      <select onchange="setEstado('${d.id}',this.value)" style="width:auto"><option ${d.estado==='Abierto'?'selected':''}>Abierto</option><option ${d.estado==='Cerrado'?'selected':''}>Cerrado</option></select>
      ${nc?`<button class="btn sm" onclick="genHallazgos('${d.id}')">Generar ${nc} hallazgo(s)</button>`:''}
      <button class="btn sm primary" onclick="imprimir('${d.id}')">Imprimir / PDF</button>
      <button class="btn sm danger" onclick="borrarDoc('${d.id}')">Eliminar</button>
    </div>
  </div>
  ${cuerpo}
  <div class="card pad" style="margin-top:12px">
    <h3 class="sec">Firmas</h3>
    <div class="grid g3">${(f.firmas||FIRMAS_BASE).map(s=>`<div style="border-top:1px solid var(--line);padding-top:6px;text-align:center;font-size:12px" class="muted">${esc(s)}</div>`).join('')}</div>
  </div>`;
}
function doc_(id){ return DB.docs.find(x=>x.id===id); }
function setF(id,k,v){ const d=doc_(id); d.f[k]=v; if(k==='fecha') d.fecha=v; save(); }
function setIt(id,k,v){ const d=doc_(id); d.it[k]=(d.it[k]===v?'':v); save(); document.getElementById('view').innerHTML=vDoc(); }
function setOb(id,k,v){ const d=doc_(id); d.ob[k]=v; save(); }
function setTb(id,r,c,v){ const d=doc_(id); d.tb[r][c]=v; save(); }
function addFila(id){ const d=doc_(id); const f=FORMATOS.find(x=>x.c===d.c); d.tb.push(f.cols.map(()=>'')); save(); document.getElementById('view').innerHTML=vDoc(); }
function delFila(id,r){ const d=doc_(id); d.tb.splice(r,1); save(); document.getElementById('view').innerHTML=vDoc(); }
function setBl(id,i,v){ const d=doc_(id); d.bl[i]=v; save(); }
function setEstado(id,v){ const d=doc_(id); d.estado=v; save(); }
function borrarDoc(id){ if(!confirm('¿Eliminar este registro? No se puede deshacer.')) return; DB.docs=DB.docs.filter(d=>d.id!==id); save(); go('registros'); }

function genHallazgos(id){
  const d=doc_(id); const f=FORMATOS.find(x=>x.c===d.c);
  let n=0;
  (f.sec||[]).forEach((s,si)=>s.it.forEach((t,ii)=>{
    const k=`s${si}i${ii}`; if(d.it[k]!=='NC') return;
    if(DB.hallazgos.some(h=>h.docId===id&&h.item===k)) return;
    DB.hallazgos.push({id:uid(),folio:'H-'+String(DB.hallazgos.length+1).padStart(3,'0'),desc:t,detalle:(d.ob||{})[k]||'',norma:d.nk,origen:`${d.c} · ${d.n}`,area:(d.f||{}).area||'',resp:'',fecha:hoy(),fechaComp:'',prioridad:'Media',estado:'Abierto',docId:id,item:k});
    n++;
  }));
  save(); toast(n?`${n} hallazgo(s) generado(s)`:'No hay nuevos hallazgos por generar'); renderNav();
}

/* ============================ IMPRESIÓN ============================ */
function sheetHTML(d,f){
  const campos=(f.campos&&f.campos.length?f.campos:CAMPOS_BASE);
  const celdas=campos.map(c=>{const raw=(d.f||{})[c[0]]||'';const val=raw?(c[2]==='date'?fdate(raw):raw):'';
    return `<td><b>${esc(c[1])}</b>${esc(val)}</td>`});
  while(celdas.length%3) celdas.push('<td></td>');
  let meta='';for(let i=0;i<celdas.length;i+=3) meta+=`<tr>${celdas.slice(i,i+3).join('')}</tr>`;

  let cuerpo='';
  if(d.tipo==='check'){
    cuerpo=(f.sec||[]).map((sec,si)=>`
      <div class="avoid"><h2>${esc(sec.t)}</h2>
      <table class="chk"><thead><tr>
        <th style="width:24px">#</th><th>Requisito</th>
        <th style="width:34px">C</th><th style="width:34px">NC</th><th style="width:38px">N/A</th>
        <th style="width:24%">Observaciones</th></tr></thead><tbody>
      ${sec.it.map((t,ii)=>{const k=`s${si}i${ii}`;const v=(d.it||{})[k]||'';const ob=(d.ob||{})[k]||'';
        return `<tr><td class="c">${ii+1}</td><td>${esc(t)}</td>
          <td class="c">${v==='C'?'X':''}</td><td class="c">${v==='NC'?'X':''}</td><td class="c">${v==='NA'?'X':''}</td>
          <td>${esc(ob)}</td></tr>`}).join('')}
      </tbody></table></div>`).join('')
      +`<div class="note">C = Cumple · NC = No cumple · N/A = No aplica</div>`;
  } else if(d.tipo==='tabla'){
    const cols=f.cols||[];
    cuerpo=`<table class="tb"><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead>
      <tbody>${(d.tb||[]).map(r=>`<tr>${cols.map((c,ci)=>`<td>${esc(r[ci]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  } else {
    cuerpo=(f.bloques||[]).map((b,i)=>{const txt=(d.bl||{})[i]||'';
      return `<div class="avoid"><h2>${esc(b.t)}</h2>${txt?`<div class="txt">${esc(txt)}</div>`
        :`<div class="blank" style="min-height:${(b.rows||4)*20}px"></div>`}</div>`}).join('');
  }

  const firmas=(f.firmas||FIRMAS_BASE).map(x=>`<div class="sg"><span class="l"></span><div class="nm"></div><div>${esc(x)}</div></div>`).join('');

  return `<div class="pdoc" style="--co:${colorEmp()};--co-txt:${textoColor(colorEmp())};--co-soft:${tinte(colorEmp(),.12)}"><div class="sheet">
    <div class="hdr">
      <img src="${logoSrc()}" alt="">
      <div class="co">
        <div class="n">${esc(DB.org.nombre||'')}</div>
        <div class="s">Seguridad y Salud en el Trabajo</div>
        <div class="c">${esc(DB.org.centro||'')}</div>
      </div>
      <div class="rev"><b>${esc(d.c)}</b>Rev. 00</div>
    </div>
    <div class="ctrl">
      <div><b>Código</b>${esc(d.c)}</div>
      <div><b>Revisión</b>00</div>
      <div><b>Fecha</b>${esc(fdate(d.fecha))}</div>
      <div><b>Página</b>1 de 1</div>
    </div>
    <div class="title"><h1>${esc(d.n)}</h1><div class="n">${esc(d.nk)}</div></div>
    <table class="meta">${meta}</table>
    ${cuerpo}
    <div class="sig">${firmas}</div>
    <div class="foot">
      <span>Documento controlado · ${esc(d.c)} · Rev. 00</span>
      <span>${esc(DB.org.resp||'')} · ${esc(DB.org.puesto||'')}</span>
    </div>
  </div></div>`;
}
function imprimir(id){
  const d=doc_(id); if(!d) return;
  const f=FORMATOS.find(x=>x.c===d.c)||{};
  document.getElementById('printRoot').innerHTML=sheetHTML(d,f);
  window.print();
}
</script>
<script>
/* ============================ MODAL ============================ */
function modal(title,body,footer){
  document.getElementById('modalHost').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)cerrarModal()">
    <div class="modal"><div class="mh"><h3>${title}</h3><div style="margin-left:auto"><button class="btn sm ghost" onclick="cerrarModal()">✕</button></div></div>
    <div class="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:''}</div></div>`;
}
function cerrarModal(){ document.getElementById('modalHost').innerHTML=''; }

/* ============================ REGISTROS ============================ */
function vRegistros(){
  const q=(window.__rq||'').toLowerCase();
  let list=DB.docs.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  if(q) list=list.filter(d=>(d.n+d.c+d.nk+((d.f||{}).area||'')).toLowerCase().includes(q));
  const abiertos=list.filter(d=>d.estado==='Abierto').length;
  return `<div class="card pad" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="text" placeholder="Buscar registro…" value="${esc(window.__rq||'')}" oninput="window.__rq=this.value;document.getElementById('view').innerHTML=vRegistros()" style="max-width:360px">
      <span class="tag">${list.length} registros · ${abiertos} abiertos</span>
      <div style="margin-left:auto"><button class="btn sm primary" onclick="go('formatos')">+ Nuevo</button></div>
    </div>
    <div class="card" style="overflow:hidden">
    ${list.length?`<table><thead><tr><th>Código</th><th>Formato</th><th>Norma</th><th>Fecha</th><th>Área</th><th>NC</th><th>Estado</th><th></th></tr></thead><tbody>
      ${list.map(d=>{const nc=Object.values(d.it||{}).filter(v=>v==='NC').length;
        return `<tr>
          <td class="mono" style="font-weight:600">${esc(d.c)}</td>
          <td>${esc(d.n)}</td>
          <td class="small muted">${esc(d.nk)}</td>
          <td class="small">${fdate(d.fecha)}</td>
          <td class="small">${esc((d.f||{}).area||'—')}</td>
          <td class="num">${nc?`<span class="pill danger">${nc}</span>`:'—'}</td>
          <td><span class="pill ${d.estado==='Cerrado'?'ok':'info'}">${esc(d.estado)}</span></td>
          <td style="white-space:nowrap;text-align:right">
            <button class="btn sm" onclick="abrirDoc('${d.id}')">Abrir</button>
            <button class="btn sm ghost" onclick="imprimir('${d.id}')" title="Imprimir">⎙</button>
          </td></tr>`}).join('')}
    </tbody></table>`:`<div class="empty"><div class="big">▤</div>Aún no hay registros.<br><button class="btn sm primary" style="margin-top:10px" onclick="go('formatos')">Ir a formatos</button></div>`}
    </div>`;
}

/* ============================ HALLAZGOS ============================ */
function vHallazgos(){
  const list=DB.hallazgos.slice().sort((a,b)=>(a.estado==='Cerrado')-(b.estado==='Cerrado')||(b.fecha||'').localeCompare(a.fecha||''));
  const ab=list.filter(h=>h.estado!=='Cerrado');
  return `<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><div class="lbl">Total</div><div class="val">${DB.hallazgos.length}</div></div>
    <div class="card kpi warn"><div class="lbl">Abiertos</div><div class="val">${ab.length}</div></div>
    <div class="card kpi danger"><div class="lbl">Vencidos</div><div class="val">${ab.filter(h=>h.fechaComp&&h.fechaComp<hoy()).length}</div></div>
    <div class="card kpi ok"><div class="lbl">Cerrados</div><div class="val">${DB.hallazgos.filter(h=>h.estado==='Cerrado').length}</div></div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm primary" onclick="editHallazgo()">+ Nuevo hallazgo</button></div>
  <div class="card" style="overflow:hidden">
  ${list.length?`<table><thead><tr><th>Folio</th><th>Hallazgo</th><th>Norma</th><th>Área</th><th>Responsable</th><th>Compromiso</th><th>Prioridad</th><th>Estado</th><th></th></tr></thead><tbody>
    ${list.map(h=>{const venc=h.estado!=='Cerrado'&&h.fechaComp&&h.fechaComp<hoy();
      return `<tr>
        <td class="mono small">${esc(h.folio||'')}</td>
        <td><div style="font-weight:550">${esc(h.desc)}</div>${h.detalle?`<div class="small muted">${esc(h.detalle)}</div>`:''}${h.origen?`<div class="small muted" style="font-size:11px">Origen: ${esc(h.origen)}</div>`:''}</td>
        <td class="small muted">${esc(h.norma||'—')}</td>
        <td class="small">${esc(h.area||'—')}</td>
        <td class="small">${esc(h.resp||'—')}</td>
        <td class="small ${venc?'':''}">${h.fechaComp?`<span class="pill ${venc?'danger':'mute'}">${fdate(h.fechaComp)}</span>`:'—'}</td>
        <td><span class="pill ${h.prioridad==='Alta'?'danger':h.prioridad==='Media'?'warn':'mute'}">${esc(h.prioridad||'Media')}</span></td>
        <td><select onchange="setHallEstado('${h.id}',this.value)" style="width:auto;font-size:12px;padding:3px 6px">
          ${['Abierto','En proceso','Cerrado'].map(s=>`<option ${h.estado===s?'selected':''}>${s}</option>`).join('')}</select></td>
        <td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" onclick="editHallazgo('${h.id}')">Editar</button><button class="btn sm ghost" onclick="delHall('${h.id}')">✕</button></td>
      </tr>`}).join('')}
  </tbody></table>`:`<div class="empty"><div class="big">⚑</div>Sin hallazgos registrados.<br><span class="small">Se generan automáticamente al marcar NC en una lista de verificación.</span></div>`}
  </div>`;
}
function setHallEstado(id,v){ const h=DB.hallazgos.find(x=>x.id===id); h.estado=v; if(v==='Cerrado') h.fechaCierre=hoy(); save(); renderNav(); }
function delHall(id){ if(!confirm('¿Eliminar hallazgo?'))return; DB.hallazgos=DB.hallazgos.filter(h=>h.id!==id); save(); go('hallazgos'); }
function editHallazgo(id){
  const h=id?DB.hallazgos.find(x=>x.id===id):{prioridad:'Media',estado:'Abierto',fecha:hoy()};
  modal(id?'Editar hallazgo':'Nuevo hallazgo',`
    <label class="fld"><span>Descripción del hallazgo</span><input type="text" id="h_desc" value="${esc(h.desc||'')}"></label>
    <label class="fld"><span>Detalle / condición encontrada</span><textarea id="h_det" rows="2">${esc(h.detalle||'')}</textarea></label>
    <div class="row">
      <label class="fld"><span>Norma</span><select id="h_norma">${NORMAS.map(n=>`<option ${h.norma===n.k?'selected':''}>${esc(n.k)}</option>`).join('')}</select></label>
      <label class="fld"><span>Área</span><input type="text" id="h_area" value="${esc(h.area||'')}"></label>
    </div>
    <div class="row">
      <label class="fld"><span>Responsable</span><input type="text" id="h_resp" value="${esc(h.resp||'')}"></label>
      <label class="fld" style="max-width:170px"><span>Fecha compromiso</span><input type="date" id="h_comp" value="${esc(h.fechaComp||'')}"></label>
      <label class="fld" style="max-width:150px"><span>Prioridad</span><select id="h_pri">${['Alta','Media','Baja'].map(p=>`<option ${h.prioridad===p?'selected':''}>${p}</option>`).join('')}</select></label>
    </div>`,
    `<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn primary" onclick="guardarHall('${id||''}')">Guardar</button>`);
}
function guardarHall(id){
  const g=k=>document.getElementById(k).value;
  const obj={desc:g('h_desc'),detalle:g('h_det'),norma:g('h_norma'),area:g('h_area'),resp:g('h_resp'),fechaComp:g('h_comp'),prioridad:g('h_pri')};
  if(!obj.desc){ toast('Escribe la descripción'); return; }
  if(id){ Object.assign(DB.hallazgos.find(x=>x.id===id),obj); }
  else { DB.hallazgos.push(Object.assign({id:uid(),folio:'H-'+String(DB.hallazgos.length+1).padStart(3,'0'),fecha:hoy(),estado:'Abierto'},obj)); }
  save(); cerrarModal(); go('hallazgos');
}

/* ============================ INCIDENTES ============================ */
function vIncidentes(){
  const list=DB.incidentes.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const anio=DB.org.anio||new Date().getFullYear();
  const delAnio=list.filter(i=>(i.fecha||'').startsWith(String(anio)));
  const dias=delAnio.reduce((a,i)=>a+(Number(i.dias)||0),0);
  const ult=list.length?list.map(i=>i.fecha).sort().pop():null;
  const sinAcc=ult?Math.max(0,Math.round((new Date()-new Date(ult+'T12:00:00'))/864e5)):'—';
  return `<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><div class="lbl">Eventos ${anio}</div><div class="val">${delAnio.length}</div></div>
    <div class="card kpi ${dias?'danger':'ok'}"><div class="lbl">Días de incapacidad</div><div class="val">${dias}</div></div>
    <div class="card kpi ok"><div class="lbl">Días sin accidente</div><div class="val">${sinAcc}</div></div>
    <div class="card kpi"><div class="lbl">ST-7 presentados</div><div class="val">${list.filter(i=>i.st7==='Sí').length}</div></div>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px">
    <button class="btn sm" onclick="nuevoDoc('EHS-F-032')">Formato de investigación</button>
    <button class="btn sm primary" onclick="editInc()">+ Registrar incidente</button>
  </div>
  <div class="card" style="overflow:hidden">
  ${list.length?`<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Área</th><th>Descripción</th><th>Lesión</th><th>Días</th><th>ST-7</th><th>Estado</th><th></th></tr></thead><tbody>
    ${list.map(i=>`<tr>
      <td class="small">${fdate(i.fecha)}</td>
      <td><span class="pill ${i.tipo==='Accidente con lesión'?'danger':i.tipo==='Cuasi accidente'?'warn':'mute'}">${esc(i.tipo||'—')}</span></td>
      <td class="small">${esc(i.area||'—')}</td>
      <td class="small">${esc(i.desc||'')}</td>
      <td class="small">${esc(i.lesion||'—')}</td>
      <td class="num">${i.dias||0}</td>
      <td class="small">${esc(i.st7||'—')}</td>
      <td><span class="pill ${i.estado==='Cerrada'?'ok':'info'}">${esc(i.estado||'Abierta')}</span></td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" onclick="editInc('${i.id}')">Editar</button><button class="btn sm ghost" onclick="delInc('${i.id}')">✕</button></td>
    </tr>`).join('')}
  </tbody></table>`:`<div class="empty"><div class="big">⚠</div>Sin incidentes registrados.</div>`}
  </div>`;
}
function editInc(id){
  const i=id?DB.incidentes.find(x=>x.id===id):{fecha:hoy(),tipo:'Cuasi accidente',estado:'Abierta',st7:'No'};
  modal(id?'Editar incidente':'Registrar incidente',`
    <div class="row">
      <label class="fld" style="max-width:170px"><span>Fecha</span><input type="date" id="i_fecha" value="${esc(i.fecha||'')}"></label>
      <label class="fld"><span>Tipo</span><select id="i_tipo">${['Accidente con lesión','Accidente sin lesión','Cuasi accidente','Daño material','Enfermedad de trabajo','Ambiental'].map(t=>`<option ${i.tipo===t?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="fld"><span>Área</span><input type="text" id="i_area" value="${esc(i.area||'')}"></label>
    </div>
    <label class="fld"><span>Descripción del evento</span><textarea id="i_desc" rows="3">${esc(i.desc||'')}</textarea></label>
    <div class="row">
      <label class="fld"><span>Lesión / daño</span><input type="text" id="i_lesion" value="${esc(i.lesion||'')}"></label>
      <label class="fld" style="max-width:140px"><span>Días de incapacidad</span><input type="number" id="i_dias" value="${esc(i.dias||0)}"></label>
      <label class="fld" style="max-width:150px"><span>¿Aviso ST-7?</span><select id="i_st7">${['No','Sí','Por determinar'].map(t=>`<option ${i.st7===t?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="fld" style="max-width:150px"><span>Estado</span><select id="i_est">${['Abierta','En investigación','Cerrada'].map(t=>`<option ${i.estado===t?'selected':''}>${t}</option>`).join('')}</select></label>
    </div>
    <label class="fld"><span>Causa raíz y acciones</span><textarea id="i_causa" rows="2">${esc(i.causa||'')}</textarea></label>`,
    `<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn primary" onclick="guardarInc('${id||''}')">Guardar</button>`);
}
function guardarInc(id){
  const g=k=>document.getElementById(k).value;
  const obj={fecha:g('i_fecha'),tipo:g('i_tipo'),area:g('i_area'),desc:g('i_desc'),lesion:g('i_lesion'),dias:Number(g('i_dias'))||0,st7:g('i_st7'),estado:g('i_est'),causa:g('i_causa')};
  if(id) Object.assign(DB.incidentes.find(x=>x.id===id),obj);
  else DB.incidentes.push(Object.assign({id:uid()},obj));
  save(); cerrarModal(); go('incidentes');
}
function delInc(id){ if(!confirm('¿Eliminar registro?'))return; DB.incidentes=DB.incidentes.filter(i=>i.id!==id); save(); go('incidentes'); }
</script>
<script>
/* ============================ COMISIÓN ============================ */
function vComision(){
  const inte=DB.comision||[];
  const docs=DB.docs.filter(d=>d.nk==='NOM-019-STPS-2011');
  const actas=docs.filter(d=>d.c==='EHS-F-014');
  const pat=inte.filter(i=>i.rep==='Patrón').length, trab=inte.filter(i=>i.rep==='Personas trabajadoras').length;
  return `<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><div class="lbl">Integrantes</div><div class="val">${inte.length}</div><div class="hint">${pat} patrón · ${trab} trabajadores</div></div>
    <div class="card kpi"><div class="lbl">Actas de recorrido</div><div class="val">${actas.length}</div></div>
    <div class="card kpi"><div class="lbl">Registros NOM-019</div><div class="val">${docs.length}</div></div>
    <div class="card kpi ${inte.length&&pat&&trab?'ok':'warn'}"><div class="lbl">Integración</div><div class="val" style="font-size:18px;padding-top:6px">${inte.length&&pat&&trab?'Completa':'Incompleta'}</div><div class="hint">Requiere ambas representaciones</div></div>
  </div>
  <div class="grid g2">
    <div class="card" style="overflow:hidden">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center"><h3 class="sec" style="margin:0">Integrantes</h3>
        <button class="btn sm primary" style="margin-left:auto" onclick="editInte()">+ Integrante</button></div>
      ${inte.length?`<table><thead><tr><th>Nombre</th><th>Puesto</th><th>Representación</th><th>Periodo</th><th></th></tr></thead><tbody>
        ${inte.map(i=>`<tr><td>${esc(i.nombre)}</td><td class="small">${esc(i.puesto||'')}</td>
          <td><span class="pill ${i.rep==='Patrón'?'info':'mute'}">${esc(i.rep||'')}</span></td>
          <td class="small">${esc(i.periodo||'')}</td>
          <td style="text-align:right"><button class="btn sm ghost" onclick="delInte('${i.id}')">✕</button></td></tr>`).join('')}
      </tbody></table>`:`<div class="empty small">Sin integrantes registrados.</div>`}
    </div>
    <div class="card pad">
      <h3 class="sec">Documentos de la comisión</h3>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${[['EHS-F-013','Acta de constitución'],['EHS-F-014','Acta de recorrido mensual'],['EHS-F-015','Programa anual de recorridos']].map(([c,t])=>`
          <button class="btn" style="justify-content:space-between" onclick="nuevoDoc('${c}')"><span><span class="mono" style="color:var(--accent);font-weight:700">${c}</span> · ${t}</span><span>→</span></button>`).join('')}
      </div>
      <div class="hr"></div>
      <h3 class="sec">Obligaciones clave (NOM-019)</h3>
      <ul class="small" style="margin:0;padding-left:18px;color:var(--ink-2)">
        <li>Acta de constitución con ambas representaciones y registro ante la STPS.</li>
        <li>Recorridos de verificación cuando menos cada mes, con acta.</li>
        <li>Programa anual de recorridos y de capacitación de la comisión.</li>
        <li>Seguimiento documentado de las condiciones reportadas.</li>
        <li>Conservar actas y evidencias del periodo de vigencia.</li>
      </ul>
    </div>
  </div>`;
}
function editInte(){
  modal('Integrante de la comisión',`
    <div class="row"><label class="fld"><span>Nombre</span><input type="text" id="c_nom"></label>
    <label class="fld"><span>Puesto</span><input type="text" id="c_pue"></label></div>
    <div class="row"><label class="fld"><span>Representación</span><select id="c_rep"><option>Patrón</option><option>Personas trabajadoras</option></select></label>
    <label class="fld"><span>Periodo</span><input type="text" id="c_per" placeholder="2026-2027"></label></div>`,
    `<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn primary" onclick="guardarInte()">Guardar</button>`);
}
function guardarInte(){
  const g=k=>document.getElementById(k).value;
  if(!g('c_nom')) return toast('Escribe el nombre');
  DB.comision=DB.comision||[]; DB.comision.push({id:uid(),nombre:g('c_nom'),puesto:g('c_pue'),rep:g('c_rep'),periodo:g('c_per')});
  save(); cerrarModal(); go('comision');
}

/* ============================ QUÍMICOS ============================ */

  const sinEtiq=list.filter(q=>q.etiqueta!=='Sí').length;

    <div class="card kpi ${sinSds?'danger':'ok'}"><div class="lbl">Sin SDS</div><div class="val">${sinSds}</div><div class="hint">Requiere SDS en español</div></div>
    <div class="card kpi ${sinEtiq?'warn':'ok'}"><div class="lbl">Sin etiqueta GHS</div><div class="val">${sinEtiq}</div></div>
    <div class="card kpi"><div class="lbl">Áreas con químicos</div><div class="val">${[...new Set(list.map(q=>q.area).filter(Boolean))].length}</div></div>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px">
    <button class="btn sm" onclick="nuevoDoc('EHS-F-012')">Verificar etiquetado</button>
    <button class="btn sm primary" onclick="editQ()">+ Sustancia</button>
  </div>
  <div class="card" style="overflow:hidden">
  ${list.length?`<table><thead><tr><th>Sustancia</th><th>Proveedor</th><th>Área</th><th>Cantidad</th><th>GHS</th><th>SDS</th><th>Etiqueta</th><th>EPP</th><th></th></tr></thead><tbody>
    ${list.map(q=>`<tr>
      <td style="font-weight:550">${esc(q.nom)}</td><td class="small">${esc(q.prov||'—')}</td><td class="small">${esc(q.area||'—')}</td>
      <td class="small">${esc(q.cant||'')} ${esc(q.uni||'')}</td><td class="small">${esc(q.ghs||'—')}</td>
      <td>${q.sds==='Sí'?'<span class="pill ok">Sí</span>':'<span class="pill danger">No</span>'}</td>
      <td>${q.etiqueta==='Sí'?'<span class="pill ok">Sí</span>':'<span class="pill warn">No</span>'}</td>
      <td class="small">${esc(q.epp||'—')}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" onclick="editQ('${q.id}')">Editar</button><button class="btn sm ghost" onclick="delQ('${q.id}')">✕</button></td>

}

  const q=id?DB.quimicos.find(x=>x.id===id):{sds:'No',etiqueta:'No'};
  modal(id?'Editar sustancia':'Nueva sustancia',`
    <div class="row"><label class="fld"><span>Sustancia / producto</span><input type="text" id="q_nom" value="${esc(q.nom||'')}"></label>
    <label class="fld"><span>Proveedor</span><input type="text" id="q_prov" value="${esc(q.prov||'')}"></label></div>
    <div class="row"><label class="fld"><span>Área</span><input type="text" id="q_area" value="${esc(q.area||'')}"></label>
    <label class="fld" style="max-width:120px"><span>Cantidad</span><input type="text" id="q_cant" value="${esc(q.cant||'')}"></label>
    <label class="fld" style="max-width:100px"><span>Unidad</span><select id="q_uni">${['L','kg','mL','g','pza'].map(u=>`<option ${q.uni===u?'selected':''}>${u}</option>`).join('')}</select></label></div>
    <div class="row"><label class="fld"><span>Pictograma GHS</span><input type="text" id="q_ghs" value="${esc(q.ghs||'')}" placeholder="Corrosión, llama, exclamación…"></label>
    <label class="fld"><span>EPP requerido</span><input type="text" id="q_epp" value="${esc(q.epp||'')}"></label></div>
    <div class="row"><label class="fld"><span>¿SDS en español?</span><select id="q_sds">${['Sí','No'].map(u=>`<option ${q.sds===u?'selected':''}>${u}</option>`).join('')}</select></label>
    <label class="fld"><span>¿Etiqueta GHS vigente?</span><select id="q_eti">${['Sí','No'].map(u=>`<option ${q.etiqueta===u?'selected':''}>${u}</option>`).join('')}</select></label></div>`,
    `<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn primary" onclick="guardarQ('${id||''}')">Guardar</button>`);
}
function guardarQ(id){
  const g=k=>document.getElementById(k).value;
  if(!g('q_nom')) return toast('Escribe el nombre de la sustancia');
  const obj={nom:g('q_nom'),prov:g('q_prov'),area:g('q_area'),cant:g('q_cant'),uni:g('q_uni'),ghs:g('q_ghs'),epp:g('q_epp'),sds:g('q_sds'),etiqueta:g('q_eti')};
  if(id) Object.assign(DB.quimicos.find(x=>x.id===id),obj); else DB.quimicos.push(Object.assign({id:uid()},obj));

}
function delQ(id){ DB.quimicos=DB.quimicos.filter(q=>q.id!==id); save(); go('quimicos'); }

/* ============================ CAPACITACIÓN ============================ */
function vCapacitacion(){
  const list=DB.capacitacion||[];
  const conDc3=list.filter(c=>c.dc3==='Sí').length;
  const hrs=list.reduce((a,c)=>a+(Number(c.hrs)||0),0);
  return `<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><div class="lbl">Registros</div><div class="val">${list.length}</div></div>
    <div class="card kpi ok"><div class="lbl">DC-3 emitidas</div><div class="val">${conDc3}</div><div class="hint">${list.length?Math.round(conDc3/list.length*100):0}% del total</div></div>
    <div class="card kpi"><div class="lbl">Horas acumuladas</div><div class="val">${hrs}</div></div>
    <div class="card kpi"><div class="lbl">Temas distintos</div><div class="val">${[...new Set(list.map(c=>c.curso))].length}</div></div>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px">
    <button class="btn sm" onclick="nuevoDoc('EHS-F-036')">Matriz de necesidades</button>
    <button class="btn sm primary" onclick="editCap()">+ Registrar capacitación</button>
  </div>
  <div class="card" style="overflow:hidden">
  ${list.length?`<table><thead><tr><th>Curso</th><th>Norma</th><th>Fecha</th><th>Horas</th><th>Persona</th><th>Instructor</th><th>DC-3</th><th>Calif.</th><th></th></tr></thead><tbody>
    ${list.map(c=>`<tr>
      <td style="font-weight:550">${esc(c.curso)}</td><td class="small muted">${esc(c.norma||'—')}</td><td class="small">${fdate(c.fecha)}</td>
      <td class="num">${esc(c.hrs||'')}</td><td class="small">${esc(c.persona||'—')}</td><td class="small">${esc(c.instructor||'—')}</td>
      <td>${c.dc3==='Sí'?'<span class="pill ok">Sí</span>':'<span class="pill warn">No</span>'}</td>
      <td class="num">${esc(c.calif||'—')}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" onclick="editCap('${c.id}')">Editar</button><button class="btn sm ghost" onclick="delCap('${c.id}')">✕</button></td>
    </tr>`).join('')}
  </tbody></table>`:`<div class="empty"><div class="big">✎</div>Sin capacitaciones registradas.</div>`}
  </div>`;
}
function editCap(id){
  const c=id?DB.capacitacion.find(x=>x.id===id):{dc3:'No',fecha:hoy()};
  modal(id?'Editar capacitación':'Registrar capacitación',`
    <div class="row"><label class="fld"><span>Curso / tema</span><input type="text" id="k_curso" value="${esc(c.curso||'')}"></label>
    <label class="fld"><span>Norma o requisito</span><select id="k_norma"><option value="">—</option>${NORMAS.map(n=>`<option ${c.norma===n.k?'selected':''}>${esc(n.k)}</option>`).join('')}</select></label></div>
    <div class="row"><label class="fld" style="max-width:170px"><span>Fecha</span><input type="date" id="k_fecha" value="${esc(c.fecha||'')}"></label>
    <label class="fld" style="max-width:110px"><span>Horas</span><input type="number" id="k_hrs" value="${esc(c.hrs||'')}"></label>
    <label class="fld"><span>Persona capacitada</span><input type="text" id="k_persona" value="${esc(c.persona||'')}"></label></div>
    <div class="row"><label class="fld"><span>Instructor / agente capacitador</span><input type="text" id="k_inst" value="${esc(c.instructor||'')}"></label>
    <label class="fld" style="max-width:130px"><span>¿DC-3?</span><select id="k_dc3">${['Sí','No'].map(u=>`<option ${c.dc3===u?'selected':''}>${u}</option>`).join('')}</select></label>
    <label class="fld" style="max-width:110px"><span>Calificación</span><input type="text" id="k_cal" value="${esc(c.calif||'')}"></label></div>`,
    `<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn primary" onclick="guardarCap('${id||''}')">Guardar</button>`);

function guardarCap(id){
  const g=k=>document.getElementById(k).value;

  const obj={curso:g('k_curso'),norma:g('k_norma'),fecha:g('k_fecha'),hrs:g('k_hrs'),persona:g('k_persona'),instructor:g('k_inst'),dc3:g('k_dc3'),calif:g('k_cal')};
  if(id) Object.assign(DB.capacitacion.find(x=>x.id===id),obj); else DB.capacitacion.push(Object.assign({id:uid()},obj));
  save(); cerrarModal(); go('capacitacion');
}
function delCap(id){ DB.capacitacion=DB.capacitacion.filter(c=>c.id!==id); save(); go('capacitacion'); }

/* ============================ DATOS ============================ */
function vDatos(){
  const o=DB.org;
  const bytes=new Blob([JSON.stringify(DB)]).size;
  return `<div class="grid g2">
    <div class="card pad">
      <h3 class="sec">Organización</h3>
      <label class="fld"><span>Razón social</span><input type="text" value="${esc(o.nombre||'')}" oninput="setOrg('nombre',this.value)"></label>
      <div class="row"><label class="fld"><span>Centro de trabajo</span><input type="text" value="${esc(o.centro||'')}" oninput="setOrg('centro',this.value)"></label>
      <label class="fld" style="max-width:120px"><span>Año</span><input type="number" value="${esc(o.anio||'')}" oninput="setOrg('anio',this.value)"></label></div>
      <label class="fld"><span>Responsable EHS</span><input type="text" value="${esc(o.resp||'')}" oninput="setOrg('resp',this.value)"></label>
      <label class="fld"><span>Puesto</span><input type="text" value="${esc(o.puesto||'')}" oninput="setOrg('puesto',this.value)"></label>
      <div class="small muted">Estos datos aparecen en el encabezado y pie de todos los formatos impresos.</div>
      <div class="hr"></div>
      <h3 class="sec">Marca de la empresa</h3>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <div class="logobox"><img src="${logoSrc()}" alt="Logo de la empresa"></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button class="btn sm" onclick="document.getElementById('logoFile').click()">Cambiar logo</button>
          <input type="file" id="logoFile" accept="image/*" style="display:none" onchange="subirLogo(this)">
          <button class="btn sm" onclick="quitarLogo()">Quitar logo</button>
        </div>
        <label class="fld" style="max-width:170px"><span>Color de la empresa</span>
          <input type="color" value="${colorEmp()}" oninput="setOrg('color',this.value)" style="height:38px;padding:2px;cursor:pointer">
        </label>
      </div>
      <div class="small muted">El logo y el color se usan en el encabezado, la barra de título y las tablas de los formatos impresos.</div>
    </div>
    <div class="card pad">
      <h3 class="sec">Respaldo</h3>
      <p class="small muted">Los datos se guardan en Supabase y se sincronizan entre equipos al iniciar sesión. El respaldo JSON sirve para conservar una copia fuera del sistema.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn primary" onclick="exportar()">Descargar respaldo (.json)</button>
        <button class="btn" onclick="exportarCSV()">Descargar CSV</button>
        <button class="btn" onclick="document.getElementById('imp').click()">Cargar respaldo</button>
        <input type="file" id="imp" accept=".json" style="display:none" onchange="importar(this)">
      </div>
      <div class="small muted" style="margin-bottom:14px">Tamaño actual: ${(bytes/1024).toFixed(1)} KB · ${DB.docs.length} registros · ${DB.hallazgos.length} hallazgos · ${DB.incidentes.length} incidentes</div>
      <div class="hr"></div>
      <h3 class="sec">Contenido del sistema</h3>
      <div class="small" style="color:var(--ink-2);line-height:1.8">
        ${NORMAS.length} normas en el marco normativo · ${FORMATOS.length} formatos en la biblioteca<br>
        ${NORMAS.filter(n=>normAplica(n.k)).length} normas marcadas como aplicables
      </div>
      <div class="hr"></div>
      <button class="btn danger" onclick="resetAll()">Borrar todos los datos</button>
    </div>
  </div>
  <div class="card pad" style="margin-top:14px">
    <h3 class="sec">Cómo usar el sistema</h3>
    <ol class="small" style="color:var(--ink-2);line-height:1.7;margin:0;padding-left:18px">
      <li>En <b>Marco normativo</b>, marca las normas que aplican a tu centro de trabajo.</li>
      <li>En <b>Formatos</b>, abre el formato que necesitas y llénalo en campo o en oficina.</li>
      <li>Al marcar <b>NC</b> en una lista de verificación, describe la condición y genera hallazgos con un clic.</li>
      <li>Da seguimiento a los hallazgos con responsable y fecha compromiso hasta cerrarlos.</li>
      <li>Imprime o guarda en PDF desde cualquier registro: el formato sale en hoja carta con firmas.</li>

}
function setOrg(k,v){ DB.org[k]=v; save(); guardarEmpresa(); const fo=document.getElementById('footOrg'); if(fo) fo.textContent=DB.org.centro||'—'; }
function exportar(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`ehs-control-respaldo-${hoy()}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast('Respaldo descargado');
}
function exportarCSV(){
  const rows = [];
  // Header row
  rows.push(['Fecha', 'Tipo', 'Norma', 'Área', 'Responsable', 'Descripción', 'Estatus']);
  // Docs
  DB.docs.forEach(d => {
    rows.push([
      d.fecha || '',
      'Documento',
      d.nk || '',
      d.area || '',
      d.resp || '',
      d.desc || '',
      d.estado || ''
    ]);
  });
  // Hallazgos
  DB.hallazgos.forEach(h => {
    rows.push([
      h.fecha || '',
      'Hallazgo',
      h.norma || '',
      h.area || '',
      h.resp || '',
      h.descripcion || '',
      h.estado || ''
    ]);
  });
  // Incidentes
  DB.incidentes.forEach(i => {
    rows.push([
      i.fecha || '',
      'Incidente',
      i.tipo || '',
      i.area || '',
      i.resp || '',
      i.desc || '',
      i.estado || ''
    ]);
  });
  const csvString = rows.map(r => r.map(v => `"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csvString], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ehs-control-datos-${hoy()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV descargado');
}
function importar(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.org||!d.docs) throw 0;
      DB=Object.assign({},DEFAULTS,d); save(); toast('Respaldo cargado'); go('panel'); }
    catch(e){ toast('Archivo no válido'); } };
  r.readAsText(f);
}
function resetAll(){ if(!confirm('Se borrarán todos los registros de la organización. ¿Continuar?'))return;
  DB=JSON.parse(JSON.stringify(DEFAULTS)); saveLocal(); save(); go('panel'); toast('Datos borrados'); }

/* ============================ INIT ============================ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrarModal(); });
window.EHS={get db(){return DB},set db(v){DB=v},save,get version(){return CENTRO_VERSION},get centro(){return CENTRO_ID},get user(){return SESSION&&SESSION.email}};

/* ============================ TEMA ============================ */
function aplicarTema(dark){
  if(dark) document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  const ic=document.getElementById('themeIcon'); if(ic) ic.textContent=dark?'☀️':'🌓';
}
function toggleTheme(){
  const dark=document.documentElement.getAttribute('data-theme')!=='dark';
  aplicarTema(dark);
  try{ localStorage.setItem('ehs.theme',dark?'dark':'light'); }catch(e){}
}
try{ if(localStorage.getItem('ehs.theme')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}

boot();

</script>
