poran un sistema de detección computarizado que analiza el ritmo cardíaco y distingue ritmos en los cuales se debería dar una descarga eléctrica de aquellos en los que no se debería dar una descarga. El sistema evalúa las características de las ondas del ECG, incluyendo pendiente, frecuencia y velocidad."},{"p":"El análisis del ritmo con un DEA solo se debe iniciar en un paciente inconsciente sin pulso palpable."},{"p":"Pueden ser automáticos o semiautomáticos, ambos tienen un control de encendido (on/off) y un control de análisis del ritmo."},{"p":"Cuando un dispositivo automático detecta un ritmo propenso para recibir una descarga, se carga y libera una descarga de manera automática. Un dispositivo semiautomático consulta al usuario para liberar la descarga y podría o no podría cargarse automáticamente."},{"p":"El rescatador libera la descarga después de asegurarse que todo el personal está despejado del paciente."},{"p":"Tanto el rescatador como las personas alrededor de paciente, deben estar aislados del mismo, ya que puede haber corrientes de fuga a través de ellos. Esto disminuye la corriente de desfibrilación que llega al paciente, y por lo tanto la efectividad de las descargas."},{"p":"El dispositivo semiautomático tiene un botón de descarga o choque. Dependiendo del fabricante, el tiempo transcurrido desde el análisis del ritmo a la liberación del choque es aproximadamente de 10 a 30 segundos."},{"p":"Los DEA tienen la ventaja respecto de los desfibriladores monofásicos (de hospital), que son pequeños y livianos. Los choques bifásicos han mostrado producir menores anormalidades y una mejor recuperación de la presión sanguínea que los choques monofásicos. La función eléctrica y mecánica del corazón aparecemenos perturbada por choques bifásicos que por monofásicos."},{"p":"En la piel se puede tener quemaduras, sobre todo si se repitieron las desfibrilaciones, ya que cada repetición también lleva consigo un aumento de energía. Esto se soluciona viendo que la cantidad de gel entre la piel y el electrodo sea la adecuada."},{"p":"Existen diferentes marcas de DEA sin embargo el funcionamiento es similar, un botón de encendido e instrucciones claras y sencillas."},{"h":"GENERALIDADES SOBRE LAS LESIONES"},{"h":"HEMORRAGIAS"},{"p":"Una hemorragia es la pérdida de sangre debido a una agresión a los vasos sanguíneos."},{"h":"Clasificación básica de los vasos sanguíneos:"},{"p":"Arteria. Transporta la sangre oxigenada que es impulsada por el corazón a todo el organismo."},{"p":"Venas. Transportan la sangre no oxigenada recolectada del organismo hacia el corazón."},{"p":"Capilares. Son los vasos sanguíneos más pequeños a través de los cuales se produce el intercambio de líquidos y gases en las células del cuerpo. Donde termina una arteria comienza una vena, a esto se le denomina red capilar."},{"h":"Clasificación de las hemorragias"},{"p":"Las hemorragias para su identificación y estudio se clasifican en tres clases:"},{"p":"Arterial: Identificada por su color rojo brillante y la sangre sale conforme al latido cardíaco."},{"p":"Venosa: Identificada por su color rojo oscuro y su salida es continua."},{"p":"Capilar: Identificada por escasa salida de sangre (puntilleo) comúnmente se presenta en las excoriaciones."},{"h":"Métodos de contención de hemorragias"},{"p":"Presión directa: Realizarla con un lienzo limpio, colocándolo sobre la herida o vendaje compresivo presionando firmemente con la palma de la mano. Si la sangre se filtra a través de la compresa no quitarla, aplique una segunda compresa y continúe presionando."},{"p":"Presión indirecta: Realizar una presión en el punto arterial (punto de presión), más cercano al sitio de la hemorragia."},{"p":"Torniquete: Es el último recurso que se aplicará para contener una hemorragia, utiliza un trozo de tela de por lo menos 10 cm. De ancho, dándole una vuelta completa alrededor de la extremidad afectada."},{"p":"Se coloca de 5 a 10 cm. por arriba de la herida, anudándola y colocándole un trozo de madera sobre el nudo hecho, girándolo hasta conseguir una presión uniforme."},{"p":"Debido a los posibles efectos adversos de los torniquetes y a la dificultad de aplicarlos correctamente, su utilización para el control de hemorragias en extremidades, sólo está indicada si no es posible aplicar presión directa o no resulta eficaz, y siempre que el proveedor de Primeros Auxilios tenga el entrenamiento adecuado para hacerlos correctamente."},{"p":"Con el manguito del baumanómetro: Colocar el manguito alrededor de la zona donde se pretende hacer el torniquete, y elevar la presión unas décimas por encima de la presión arterial del paciente (al superar la presión de las arterias se interrumpe el paso de sangre)."},{"h":"ESTADO DE SHOCK"},{"p":"Un estado de shock es el estado de deficiencia circulatoria generalizada en todos los tejidos, ocasionado por diversos factores, como traumatismo, enfermedades cardiacas, reacciones alérgicas o infecciones severas."},{"h":"Clasificación"},{"p":"A continuación se mencionan los tipos de shock más frecuentes para su estudio."},{"h":"SHOCK HIPOVOLÉMICO"},{"p":"El shock hipovolémico obedece a la pérdida de líquidos corporales, una disminución en el volumen sanguíneo (750 ml o más) significa que no hay sangre suficiente para llenar el sistema, por lo que la circulación falla y provoca el shock."},{"p":"Los líquidoscorporales pueden reducirse por diferentes razones."},{"p":"a. Hemorragia externa: Heridas abiertas que provocan pérdida de la sangre."},{"p":"b. Hemorragia interna. Los órganos desgarrados o lacerados, las úlceras y fracturas cerradas."},{"p":"c. Deshidratación: Pérdida de líquidos por vómitos y/o diarrea."},{"p":"El shock hipovolémico es la causa más frecuente de shock en pacientes traumatizados con hemorragia."},{"h":"Signos y síntomas"},{"p":"Aunque el shock constituye una condición grave para la persona que lo sufre. Usted puede ser una gran ayuda para el paciente, siempre y cuando, sea capaz de reconocer rápidamente el problema y tratarlo de manera eficiente."},{"p":"Se debe de tener en cuenta el antecedente de un traumatismo o herida que constituya una pérdida de sangre importante, para poder considerar el shock como un problema en el paciente."},{"p":"Los signos y síntomas del shock se presentan cuando el lesionado presenta:"},{"p":"1. Frecuencia cardiaca elevada."},{"p":"2. Respiración rápida y superficial."},{"p":"3. Piel pálida, húmeda y fría."},{"p":"4. Sensación de muerte."},{"p":"5. Sed intensa."},{"p":"6. Alteración de la conciencia."},{"p":"7. Pulso rápido y poco perceptible."},{"p":"8. Sudoración fría y pegajosa."},{"p":"9. Estremecimiento y temblores."},{"p":"10. Tensión arterial baja."},{"p":"11. Pupilas dilatadas (midriáticas) en ojos apagados y sin brillo."},{"h":"Tratamiento de urgencia"},{"p":"El tratamiento apropiado exige la atención del paciente y no únicamente a una o dos de las alteraciones que presenta. Los pasos a seguir para la atención de un paciente en estado de shock son los siguientes."},{"p":"a. Mantener la vía aérea libre."},{"p":"b. Verificar la respiración."},{"p":"c. Controlar hemorragias externas y verificación de pulso."},{"p":"d. Colocar en posición de shock, esto se puede aplicar siempre y cuando no existan extremidades pélvicas fracturadas, heridas penetrantes en abdomen, fracturas en el cráneo y mujeres embarazadas."},{"p":"e. Mantener la temperatura corporal."},{"p":"f. Aflojar la ropa alrededor del cuello y aquella que restrinja la movilidad del tórax."},{"p":"g. Mantenerlo consciente, haciéndole plática."},{"p":"h. Nunca hablarle de la gravedad de sus lesiones, ni dejar que las vea."},{"p":"i. Investigar qué ocasionó el estado de shock y tratar de eliminar la causa."},{"h":"NOTA: SI SE TIENE A LA MANO UN TANQUE DE OXÍGENO, ADMINISTRAR"},{"h":"A 8 LITROS POR MINUTO CON MASCARILLA RESERVORIO."},{"h":"El tratamiento a personas en estado de shock tiene prioridad sobre cualquier medida de urgencia a excepción de:"},{"li":"Corrección de trastornos respiratorios."},{"li":"Restablecimiento de la respiración."},{"li":"Control de la hemorragia profusa."},{"h":"Consecuencias"},{"li":"Paro respiratorio."},{"li":"Paro cardiorrespiratorio."},{"li":"Estado de coma."},{"li":"Muerte."},{"p":"Si alguna persona sufre estado de shock y no se atiende, puede sobrevenir la muerte. En consecuencia, los Primeros Auxilios adecuados contra el estado de shock son preventivos, hay que atenderlo antes y no cuando está ya en evolución."},{"h":"HERIDAS"},{"p":"Es toda pérdida de continuidad en la piel, secundaria a un traumatismo. Como consecuencia de la agresión de este tejido existe riesgo de infección y posibilidad de lesiones en órganos o tejidos adyacentes: músculos, nervios y/o vasos sanguíneos."},{"p":"Las heridas pueden ser graves en función de una o varias de estas características:"},{"li":"Profundidad."},{"li":"Extensión."},{"li":"Localización."},{"li":"Suciedad evidente, cuerpos extraños o signos de infección."},{"h":"Clasificación de las heridas, según el agente causal"},{"p":"Heridas cortantes: Producidas por objetos afilados como latas, vidrios, cuchillos, que pueden seccionar músculos, tendones y nervios. Los bordes de la herida son limpios y lineales, la hemorragia puede ser escasa, moderada o abundante, dependiendo de la ubicación, número y calibre de los vasos sanguíneos seccionados."},{"p":"Heridas punzantes: Son producidas por objetos delgados y agudos como clavos, agujas, anzuelos o mordeduras de serpientes. La lesión es dolorosa. La hemorragia escasa y el orificio de entrada es poco notorio; es considerada la más peligrosa porque puede ser profunda, haber perforado vísceras y provocar hemorragias internas. El peligro de infección es mayor debido a que no hay acción de limpieza producida por la salida de sangre al exterior."},{"p":"Heridas punzocortantes: Son producidas por objetos agudos y afilados, como tijeras, puñales, cuchillos, o un hueso fracturado. Es una combinación de los dos tipos de heridas anteriormente nombradas."},{"p":"Heridas lacerantes: Producidas por objetos de bordes dentados (serruchos o latas). Hay desgarramiento de tejidos y los bordes de las heridas son irregulares."},{"p":"Excoriación o abrasión: Herida producida por fricción o rozamiento de la piel con superficies duras. Hay pérdida de la capa más superficial de la piel, dolor, ardor, que cede pronto, hemorragia escasa. Se infecta con frecuencia."},{"p":"Heridas avulsivas: Son aquellas donde se separa y se rasga el tejido del cuerpo de la víctima. Una herida cortante o lacerante puede convertirse en avulsiva. El sangrado es abundante, ejemplo: mordedura de perro."},{"p":"Herida contusa: Producida por objetos romos sin filo, generalmente no existe pérdida de continuidad en piel, pueden ser producidas por piedras, palos, golpes de puño o con objetos duros. Hay dolor y hematoma, estas heridas se presentan por la resistencia que ofrece el hueso ante el golpe, ocasionando la lesión de los tejidos blandos."},{"h":"Tratamiento de Primeros auxilios"},{"p":"Basarse en el tratamiento englobado en los pasos siguientes, para aplicarlos en cualquier caso:"},{"p":"1. Contener la hemorragia. (Presión directa, presión indirecta, elevación extremidad)"},{"p":"2. Lavar la herida de la parte central de la herida hacia la parte exterior con agua y jabón."},{"p":"3. Cubrir con apósito o gasa limpia y vendar para sujetar, al mismo tiempo para comprimir la herida y evitar la hemorragia."},{"p":"4. Trasladar de inmediato a una atención médica."},{"h":"Posibles complicaciones/riesgos:"},{"li":"Hemorragia intensa (shock)."},{"li":"Infección."},{"li":"Gangrena (ocasionado por la necrosis de los tejidos profundos)."},{"li":"Amputación de una extremidad."},{"h":"QUEMADURAS"},{"p":"Una quemadura es una lesión en la piel debido al contacto o exposición de un agente peligroso, como son el calor, el frío, la electricidad, las radiaciones del sol o ciertos productos químicos."},{"p":"Existen diferentes agentes que llegan a causar quemadura como son, los agentes físicos, agentes químicos y agentes radioactivos."},{"p":"AGENTES FÍSICOS. Son agentes que producen quemaduras por contacto directo con una fuente de calor o por calor radiante."},{"p":"AGENTES QUÍMICOS. Son aquellos que producen quemadura por el contacto de la piel con determinadas sustancias química."},{"p":"RADIACTIVOS. Son debidas a la acción de las radiaciones ionizantes sobre los tejidos. Originan lesiones parecidas a las quemaduras producidas por agentes físicos."},{"p":"La SEVERIDAD de una quemadura se determina de acuerdo a:"},{"li":"Edad."},{"li":"Profundidad."},{"li":"Extensión."},{"li":"Región corporal."},{"li":"Lesiones adyacentes."},{"h":"Clasificación de las quemaduras según su profundidad:"},{"h":"QUEMADURAS DE PRIMER GRADO"},{"p":"Estas quemaduras afectan únicamente las capas externas de la piel."},{"p":"Se caracterizan por presentar:"},{"p":"a. Enrojecimiento de la piel."},{"p":"b. Tumefacción."},{"p":"c. Hipersensibilidad."},{"p":"d. Dolor y ardor."},{"h":"QUEMADURAS DE SEGUNDO GRADO"},{"p":"Estas quemaduras afectan la región dérmica superficial."},{"p":"Se caracterizan por presentar:"},{"p":"a. Enrojecimiento de la piel, con partes blanquecinas."},{"p":"b. Dolor, ardor intenso y localizado."},{"p":"c. Aparición de ámpulas."},{"p":"d. Hipersensibilidad."},{"p":"e. Tumefacción."},{"h":"QUEMADURAS DE TERCER GRADO"},{"p":"Estas quemaduras afectan a todos los estratos de la piel."},{"p":"Se caracterizan por presentar:"},{"p":"a. Piel pálida, serosa."},{"p":"b. Necrosis y carbonización de tejidos."},{"p":"c. Pueden aparecer ámpulas alrededor de esta quemadura."},{"h":"QUEMADURAS DE CUARTO GRADO"},{"p":"Estas quemaduras afectan a todos los estratos de la piel y tejidos subcutáneos como grasa, músculos, el hueso o los órganos internos."},{"h":"Primeros auxilios para quemaduras"},{"p":"Lo más importante en el tratamiento de las quemaduras es detener el proceso de la combustión, esto no significa enfriar la quemadura."},{"p":"1. Tranquilizar al lesionado."},{"p":"2. Colocar la parte lesionada bajo el chorro suave de agua a temperatura ambiente."},{"p":"3. Colocar al lesionado en posición cómoda, sin que la quemadura tenga contacto con algún objeto."},{"p":"4. Retirar cuidadosamente anillos, relojes, cinturones o prendas ajustadas que compriman la zona quemada antes que ésta se empiece a inflamar."},{"p":"5. Retirar cualquier prenda que esté caliente enfriándola con agua siempre y cuando no esté adherida a la piel."},{"p":"6. Cubra el área lesionada con un apósito estéril o con un lienzo limpio y húmedo, libre de pelusas y fijar con un vendaje."},{"p":"Cuando se trata de los dedos, evitar que se pegue piel con piel."},{"p":"7. No aplicar cremas y/o ungüentos."},{"p":"8. Inmovilizar las extremidades quemadas, evitando que se pegue piel con piel."},{"p":"9. Trasladar a la víctima al servicio médico."},{"h":"Prohibiciones en el tratamiento inicial de quemaduras"},{"li":"NO retirar nada que haya quedado adherido a una quemadura."},{"li":"NO romper las ámpulas."},{"li":"NO retirar la piel desprendida."},{"li":"NO tocar el área lesionada."},{"li":"NO juntar piel con piel."},{"li":"NO demorar el transporte del paciente para atención médica."},{"h":"Se consideran quemaduras graves:"},{"li":"Las que dificultan la respiración."},{"li":"Las que cubren más de una parte del cuerpo."},{"li":"Las quemaduras en la cabeza, cuello, manos, pies o genitales."},{"li":"Las quemaduras en un niño o un anciano."},{"li":"Las quemaduras de tercer grado, independientemente de su extensión y localización."},{"li":"Las quemaduras causadas por sustancias químicas, explosiones o electricidad."},{"p":"Las quemaduras graves pueden ser mortales; por lo tanto necesitan atención médica lo antes posible."},{"p":"NOTA: Siempre estar pendiente del CAB y en caso de que el paciente requiera, iniciar de inmediato RCP."},{"h":"FRACTURAS, ESGUINCES Y LUXACIONES"},{"h":"FRACTURA"},{"p":"La fractura es la pérdida de continuidad del hueso, a consecuencia de golpes, fuerzas o tracciones cuyas intensidades superen la elasticidad del hueso."},{"h":"Clasificación"},{"p":"En general las fracturas se clasifican como:"},{"p":"a. Cerradas o simple: Son aquellas en las que el hueso está roto, pero no se aprecia herida en el sitio de la fractura."},{"p":"b. Abiertas o compuesta: Aquéllas en las que se aprecia hueso fracturado y existe una herida en el sitio de la fractura."},{"h":"Signos y síntomas"},{"li":"Hipersensibilidad (Dolor intenso y localizado). Es producido por el roce del hueso roto con los músculos, ya que éstos contienen los elementos nerviosos para su funcionamiento."},{"li":"Deformación. El desplazamiento de los extremos del hueso fracturado, provocan ondulaciones o protuberancias en las partes afectadas."},{"li":"Impotencia funcional. Se refiere a la incapacidad para realizar movimientos con los miembros lesionados, debido principalmente al dolor que se produce al intentarlo."},{"li":"Hemorragias. Es la consecuencia de la herida que se produce al romperse el hueso, pueden formarse hematomas en las fracturas cerradas."},{"li":"Inflamación. Reacción de los tejidos orgánicos ante una lesión infecciosa o traumática, caracterizada por un enrojecimiento de la zona, aumento de su volumen, dolor, sensación de calor y trastornos funcionales."},{"h":"Tratamiento"},{"p":"Control de Hemorragia: Tanto en las fracturas cerradas como en las abiertas lo primero es controlar la hemorragia y si es necesario tratar el shock. La presión directa y los vendajes compresivos controlan casi todas las hemorragias. La inmovilización generalmente controla la hemorragia interna y alivia el dolor."},{"p":"Inmovilización de fracturas. Su objetivo principal es evitar el movimiento, disminuir el dolor y evitar complicaciones."},{"p":"Para ello se debe cumplir con lo siguiente:"},{"p":"a. No mover la parte fracturada si no hay razón para hacerlo."},{"p":"b. Si se requiere una exploración exhaustiva, realizarla antes de inmovilizar. c. Si se trata de una fractura en un hueso largo de una extremidad, inmovilizar toda la extremidad."},{"p":"d. Soportar manualmente el sitio lesionado, mientras se inmovilizan las articulaciones y el hueso situado por encima del lugar (proximales) y por debajo del mismo (distales)."},{"p":"e. En general, las fracturas se inmovilizan en la posición en que se encontraron. La excepción de paciente con extremidades sin pulsos o cuando la extraña posición del miembro impide el traslado. (Se intentará corregir con suavidad, la posición)."},{"p":"f. Utilizar el material adecuado, férulas almohadilladas que mejoren la comodidad del paciente."},{"p":"g. Retirar joyas y relojes que puedan impedir la circulación."},{"p":"h. Una vez colocada la férula, volver a valorar periódicamente sensibilidad y pulsos."},{"p":"i. No apretar demasiado la inmovilización para no entorpecer la circulación de la sangre."},{"h":"Elementos para inmovilizar"},{"p":"Como medida extrema se puede utilizar cartones, periódicos enrollados, tablas, cobijas, etc. Estos elementos se denominan férulas y su largo está condicionado a la edad de la persona lesionada y a la zona en que se aplicará. Para detener las férulas en su sitio se utilizan cordones corbatas, pañuelos, etcétera."},{"h":"Complicaciones que pueden presentarse en casos de fracturas"},{"p":"La mala aplicación de los Primeros Auxilios en las fracturas deja males irreparables que pueden repercutir en el futuro del paciente."},{"p":"A continuación se enumeran algunos de los problemas que se pueden presentar:"},{"p":"a. Hacer expuesta una fractura."},{"p":"b. Lesionar nervios, arterias y vasos sanguíneos."},{"p":"c. Defectos en la movilidad de la articulación."},{"p":"d. Infección."},{"p":"e. Trombosis grasa."},{"p":"f. Lesionar la médula espinal."},{"p":"g. Estado de shock."},{"h":"Fracturas especiales"},{"p":"Cráneo."},{"p":"Las más peligrosas en esta región son las que ocurren en la base del cráneo, en algunos casos se puede identificar por:"},{"li":"Sangrado que aparece por los oídos, nariz y boca."},{"li":"Hematoma de los párpados o atrás de las orejas."},{"li":"Náuseas."},{"li":"Vómito en proyectil."},{"li":"Puede estar consciente o inconsciente."},{"li":"Pupilas desiguales (anisocóricas) o ambas dilatadas (midriáticas)."},{"h":"Tratamiento de urgencia"},{"li":"Manejar el CAB."},{"li":"Inmovilizar las cervicales con collarín."},{"li":"Empaquetamiento."},{"li":"Manejo del estado de Shock."},{"li":"Transportar de inmediato."},{"h":"Tórax"},{"p":"Son fracturas causadas por golpes fuertes sobre las costillas, algunas veces, sobre todo en los niños, no se rompe en su totalidad el hueso, quedando unido en alguna de sus partes. A este tipo de fractura se le denomina “fractura en tallo verde”."},{"p":"El principal peligro de las fracturas en el tórax es la perforación que pueden causar en pleura y pulmones."},{"h":"Signos y síntomas"},{"li":"Hematoma en el área afectada."},{"li":"Dificultad para respirar."},{"li":"Puede presentar tos con salida de sangre de color rojo brillante."},{"h":"Tratamiento de urgencia"},{"li":"Manejar el CAB."},{"li":"Apoyo ventilatorio."},{"li":"No colocar férula a las costillas."},{"li":"Colocar a la víctima en posición semisentado (sólo si no tiene lesión en columna vertebral)."},{"li":"Transportar de inmediato a la atención médica."},{"h":"Pelvis"},{"p":"Se requiere de un gran traumatismo sobre esta región para producir la fractura, ya que los huesos que forman la pelvis tienen bastante resistencia por lo que requiere de un tratamiento especial."},{"h":"Signos y síntomas"},{"li":"Con frecuencia el lesionado presenta signos claros de un estado de Shock."},{"li":"Dolor pelviano intenso, que se intensifica con la presión en la cadera."},{"li":"Equimosis inguinal, perineal y escrotal o labios mayores en la mujer."},{"li":"Desnivel entre ambos huesos ilíacos, rotación externa de uno o los dos miembros inferiores."},{"h":"Tratamiento de urgencia"},{"li":"Asegure el CAB."},{"li":"Inmovilice en una camilla rígida, la movilización del paciente deberá realizarse con la menor movilización para colocarle en una tabla rígida."},{"li":"Vigile el estado de Shock."},{"li":"Traslade a la atención médica."},{"h":"LUXACIÓN"},{"p":"Es una separación de dos huesos en el lugar donde se encuentran en la articulación. Un hueso dislocado o luxado es un hueso que ya no está en suposición normal. Una dislocación también puede causar daño a ligamentos y nervios."},{"h":"Signos y síntomas"},{"li":"Dolor."},{"li":"Edema."},{"li":"Enrojecimiento."},{"li":"Equimosis."},{"li":"Pérdida de función."},{"h":"Tratamiento"},{"p":"Inmovilización de la misma manera que se trata una fractura, ya que en Primeros"},{"p":"Auxilios no es posible distinguir entre estas dos lesiones o si existen ambas."},{"h":"ESGUINCE"},{"p":"Torcedura o distensión violenta de una articulación que puede ir acompañada de la ruptura de un ligamento o de las fibras musculares."},{"h":"Signos y síntomas"},{"li":"Dolor importante."},{"li":"Inflamación."},{"li":"Hematoma."},{"li":"Entumecimiento."},{"h":"Tratamiento"},{"p":"Se maneja igual que una fractura o luxación, mediante inmovilización de la articulación hasta recibir atención especializada que descarta mediante radiografías la existencia de otras lesiones."},{"h":"TRAUMATISMOS DE TÓRAX"},{"p":"El tórax puede absorber traumatismo de gran magnitud por su estructura. Sin embargo cuando existe una lesión grave, puede comprometer seriamente la función respiratoria o cardiaca, dependiendo del tipo de lesión y los órganos que estén comprometidos."},{"h":"NEUMOTÓRAX"},{"p":"Se define como neumotórax a la presencia de aire en el espacio pleural, provocando el colapso del pulmón afectado, esto después de un traumatismo en el tórax ya sea cerrado o abierto, siendo los de mayor relevancia el neumotórax a tensión y el neumotórax abierto."},{"h":"Neumotórax a Tensión"},{"p":"Se produce por el escape de aire del pulmón hacia el espacio pleural, ocasionando el desplazamiento del mediastino al lado contralateral."},{"p":"El mediastino y la tráquea se desplazan hacia el lado opuesto, comprometiendo la posibilidad de respuesta ventilatoria por parte del pulmón sano, y afectando el retorno venoso. Unilateral de movimiento respiratorio, timpanismo del pulmón ipsilateral, ingurgitación yugular y cianosis tardía."},{"h":"Signos y síntomas"},{"li":"Dificultad respiratoria que va aumentando."},{"li":"Taquicardia."},{"li":"Hipotensión arterial."},{"h":"Neumotórax Abierto"},{"p":"Se produce al existir una herida penetrante en tórax lo cual permitirá la entrada de aire al espacio pleural, ocasionando el colapso del pulmón del lado afectado."},{"h":"Signos y síntomas:"},{"li":"Antecedente de herida penetrante en tórax."},{"li":"Dificultad respiratoria."},{"li":"Taquicardia."},{"h":"Tratamiento de primeros auxilios para el neumotórax abierto es:"},{"li":"Medidas protección vía aérea."},{"li":"Oxígeno 8 lts por minuto."},{"li":"Colocar un parche en la herida penetrante que tenga función de válvula de una vía."},{"li":"Traslado inmediato a servicio médico más cercano."},{"h":"Fractura de clavícula"},{"p":"La importancia de esta fractura es el potencial daño al paquete neurovascular subclavio y su angulación hacia el interior puede provocar neumotórax."},{"p":"El tratamiento de primeros auxilios consiste en inmovilizar con un cabestrillo y trasladar al paciente."},{"h":"Fractura del esternón"},{"p":"El Esternón o el hueso del pecho se refiere al hueso en forma de daga larga aplanada situado a lo largo de la línea media en el centro del pecho. Se conecta al hueso de las costillas por medio de tejido elástico duro (cartílago) que forma la parte frontal de la caja torácica."},{"p":"Es una fractura poco frecuente, se relaciona más en adultos mayores, se puede acompañar de lesiones de aorta y grandes vasos o taponamiento cardiaco. Los signos y síntomas son, dolor localizado intenso, deformidad de la parte media anterior del tórax. El tratamiento de primeros auxilios es valoración respiratoria y de la función cardiaca, trasladar de inmediato a centro hospitalario."},{"h":"LESIONES DE ABDOMEN"},{"h":"Heridas penetrantes en abdomen"},{"p":"Son aquellas en las que penetra un objeto a la cavidad abdominal, generalmente de naturaleza cortante o punzo-cortante."},{"p":"Son muy peligrosas, por el riesgo de lesiones en los órganos internos y por la hemorragia interna."},{"p":"Todo paciente con herida penetrante en abdomen requiere ser valorado en un hospital y operado en un quirófano, su manejo de primeros auxilios es preventivo al estado de shock."},{"h":"Clasificación"},{"li":"Sin exposición de vísceras."},{"li":"Con exposición de vísceras."},{"p":"Cuando son sin exposición de vísceras y existe sospecha de lesión en víscera abdominal los signos y síntomas son:"},{"li":"Herida penetrante evidente."},{"li":"Dolor abdominal."},{"li":"Puede existir hemorragia profusa por la herida."},{"li":"Dolor a la palpación."},{"li":"Pueden existir signos de shock."},{"p":"Un indicador de hemorragia intra-abdominal, es el shock hipovolémico."},{"p":"Cuando son con exposición de vísceras:"},{"li":"Las vísceras salen de la cavidad abdominal."},{"li":"Pueden existir datos de shock."},{"h":"Tratamiento de urgencia"},{"p":"Heridas penetrantes en abdomen sin exposición de vísceras:"},{"li":"Cubrir la herida con gasas estériles y vendaje abdominal."},{"li":"Transportar rápidamente a la víctima en posición decúbito dorsal."},{"li":"Vigilar sus signos vitales."},{"li":"Administrar soporte vital básico si es necesario."},{"h":"Heridas penetrantes en abdomen con exposición de vísceras:"},{"p":"Al igual que la anterior presenta los mismos riesgos, aunada la exposición de vísceras por lo que el auxiliador tendrá que realizar las siguientes maniobras:"},{"li":"Colocar un apósito limpio amplio y húmedo sobre la herida y las vísceras expuestas."},{"li":"Irrigar con suero o agua limpia las vísceras expuestas, para evitar la resequedad."},{"li":"Aplicar un vendaje que sostenga las vísceras, sin presión."},{"li":"Trasladar lo más rápido posible a la víctima semisentado con las piernas flexionadas."},{"li":"Aplicar medidas anti-shock."},{"li":"Soporte vital básico si es necesario."},{"h":"NUNCA:"},{"li":"Reintroducir las vísceras a la cavidad abdominal."},{"li":"Administrar bebidas o alimento."},{"h":"OBJETO EMPALADO"},{"p":"1. NO RETIRAR EL OBJETO."},{"p":"2. Inmovilizar el cuerpo extraño utilizando gasas o una “dona” de venda."},{"p":"3. Detener la hemorragia (sin presionar sobre el objeto)."},{"p":"4. Prepararse para proporcionar soporte vital básico en caso de requerir."},{"h":"AMPUTACIONES"},{"p":"La amputación es el corte y separación de una extremidad del cuerpo o parte de la misma mediante un traumatismo."},{"h":"Clasificación"},{"h":"I. Amputación parcial"},{"p":"Es aquella cuando la extremidad afectada se encuentra sujeto parcialmente al resto del cuerpo, existe dolor intenso, muchas veces cuando se lesiona el nervio existe ausencia de sensibilidad, por lo tanto de dolor, hemorragia intensa, mareo e inquietud."},{"h":"II. Amputación total"},{"p":"Es aquella cuando el miembro afectado se encuentra separado totalmente del cuerpo, ausencia de dolor, hemorragia intensa, mareo y estado de shock."},{"h":"Primeros auxilios"},{"p":"1. Soporte vital básico."},{"p":"2. En lo posible, trate de calmar y darle seguridad a la persona. Las amputaciones son dolorosas y extremadamente atemorizantes."},{"p":"3. Control de la hemorragia."},{"p":"4. Conserve cualquier parte del cuerpo cercenada y asegúrese de que permanezca con la persona. Retire cualquier material sucio que pueda contaminar la herida si es posible y enjuague la parte del cuerpo muy suavemente si el extremo del corte está sucio."},{"p":"5. Envuelva la parte cercenada en un trozo de tela limpio y húmedo, colóquelo en una bolsa plástica sellada y sumerja la bolsa en agua helada."},{"p":"6. No coloque la parte afectada directamente en agua sin usar una bolsa plástica."},{"p":"7. No coloque directamente la parte cercenada en hielo. No use hielo seco, ya que esto produce congelación y lesión de la parte afectada."},{"p":"8. Si no hay disponibilidad de agua fría, mantenga la parte alejada del calor tanto como sea posible; consérvela para entregársela al equipo médico o llévela al hospital. El hecho de enfriar la parte cercenada ayuda a mantenerla viable durante unas 18 horas; de lo contrario, sólo se conservará durante unas 4 o 6 horas."},{"p":"9. Tome medidas para prevenir un shock."},{"p":"10. Una vez controlada la hemorragia, examine a la persona para ver si tiene otros signos de lesión que requieran tratamiento urgente. Trate las fracturas, las heridas adicionales u otras lesiones de una manera adecuada."},{"p":"11. Permanezca con la persona hasta que la ayuda médica llegue."},{"h":"TRAUMATISMO CRÁNEO ENCEFÁLICO (TCE)"},{"p":"El traumatismo craneoencefálico (TCE) es la alteración en la función neurológica u otra evidencia de patología cerebral a causa de una fuerza traumática externa que ocasione un daño físico en el encéfalo."},{"p":"También puede definirse como la lesión directa de las estructuras craneales, encefálicas o meníngeas que se presentan como consecuencia de un agente mecánico externo y puede originar un deterioro funcional del contenido craneal."},{"p":"El TCE representa un grave problema de salud y es la causa más común de muerte y discapacidad en la gente joven, sin contar las grandes repercusiones económicas relacionadas."},{"h":"Evaluación"},{"p":"La evaluación inicia mediante la aplicación de la nemotecnia:"},{"li":"A (Estado de Alerta)"},{"li":"V (Respuesta Verbal)"},{"li":"D (Respuesta al Dolor)"},{"li":"I (Inconsciencia)"},{"h":"Examen físico"},{"p":"Es la exploración de la cabeza en busca de signos de traumatismo; éstos incluyen hematomas o laceraciones en cara y cuero cabelludo, fracturas craneales abiertas, hundimientos, heridas, etc."},{"p":"Otros signos específicos de trauma craneal grave son:"},{"li":"Signo de Batlle: Hematoma detrás de la oreja."},{"li":"Otorragia, sangrado por el oído."},{"li":"Signo de ojos del mapache: hematoma alrededor de los ojos."},{"li":"Líquido o sangre por la nariz."},{"p":"Al encontrar cualquiera de estos cuatro signos en un paciente que ha sufrido un intercambio de fuerza en el cráneo, se considera fractura de cráneo."},{"h":"Tratamiento"},{"p":"1. Soporte vital básico."},{"p":"2. Trasladar de inmediato en posición semisentada."},{"p":"3. Valoración de signos vitales constante durante el traslado."},{"h":"TRAUMATISMOS DE COLUMNA VERTEBRAL"},{"p":"Es toda lesión de la columna vertebral asociada a una lesión neurológica que puede comprometer a la medula espinal o sus raíces nerviosas."},{"p":"Existen dos zonas muy vulnerables a los traumatismos: la columna cervical baja y la región toraco-lumbar."},{"p":"Las lesiones de médula espinal pueden ser causadas por rupturas mecánicas, compresión, contusión, rotación o avulsión de los elementos neurales."},{"li":"Hiperextensión. Movimiento posterior excesivo de la cabeza o cuello."},{"li":"Hiperflexión. Movimiento anterior excesivo de la cabeza sobre el tórax."},{"li":"Compresión. El peso de la cabeza es trasladado al cuello o el peso del tórax es trasladado hacia la región pélvica."},{"h":"Examen físico"},{"p":"Las lesiones de columna vertebral pueden presentar los siguientes signos y síntomas: Dolor intenso en la región afectada es el síntoma principal, pero este puede estar ausente o no es notado por el paciente, porque puede estar enmascarado por otra lesión más dolorosa."},{"p":"Puede presentar entumecimiento o adormecimiento de extremidades, debilidad, pérdida del control de esfínteres."},{"h":"Manejo del paciente"},{"li":"Soporte vital básico."},{"li":"Inmovilización en tabla rígida."},{"li":"Traslado a centro médico cercano."},{"h":"EMERGENCIAS AMBIENTALES"},{"h":"ACCIDENTE ELÉCTRICO"},{"p":"Lesión producida por los efectos de la corriente eléctrica en el organismo."},{"p":"La corriente eléctrica sigue preferentemente la trayectoria de la menor resistencia. De acuerdo con ello, desempeñan un rol decisivo las diferentes resistencias que ofrecen los tejidos del cuerpo humano. Los tejidos nerviosos presentan la resistencia menor. En secuencia ascendente, le siguen las arterias, músculos, piel, tendones, tejido adiposo y los huesos."},{"p":"En consecuencia, para el caso de la corriente continua y las corrientes de baja frecuencia, la probabilidad de daño del tejido nervioso es la mayor, seguida de arterias, músculos, etc."},{"p":"Los síntomas son:"},{"li":"Quemaduras en los lugares de entrada y salida de la corriente."},{"li":"Parálisis de la musculatura de las extremidades y del corazón por el flujo de corriente."},{"li":"Formación de gas en la sangre por electrólisis."},{"li":"Fracturas de huesos debido a repentinas y bruscas contracciones musculares."},{"li":"Lesiones por accidentes secundarios (por ejemplo por una caída ocasionada por el golpe de corriente)."},{"li":"Paro cardiorrespiratorio."},{"h":"Síntomas y signos"},{"p":"a. Quemaduras, con sitio de entrada generalmente menor y un sitio de salida generalmente mayor."},{"p":"b. Arritmias cardiacas, paro cardiaco o taquicardia ventricular que puede progresar a fibrilación."},{"p":"c. Paro respiratorio, por daño eléctrico al centro respiratorio en el cerebro o por contracciones tetánicas de los músculos respiratorios."},{"p":"Para salvar al lesionado, primeramente, asegurar que la instalación esté libre de tensión eléctrica. Las instalaciones y aparatos deben separase de la red eléctrica mediante su interruptor de emergencia o el fusible de seguridad. El simple apagado del aparato o del conductor no asegura que esté libre de tensión."},{"p":"Los cables que conduzcan corriente y que estén libres, deben retirarse de la cercanía del lesionado ayudándose de un objeto no conductor."},{"p":"En el caso de alta tensión debe mantenerse una gran distancia de seguridad, ya que de no hacerlo existe el peligro de la formación de un arco eléctrico."},{"p":"Advertir a los presentes para que no toquen las piezas electrificadas (delimitar área)."},{"p":"En caso de pacientes inconscientes, una vez cortado el flujo de corriente, administrar soporte vital básico con ayuda de un DEA."},{"p":"En el caso de los pacientes conscientes, hay que enfriar las quemaduras y cubrirlas con una venda limpia, que no desprenda pelusas y en lo posible esterilizada. También en el caso de que el paciente se sienta completamente bien, debería mantenerse en observación. Transportar al lesionado al servicio de emergencia de un hospital."},{"p":"El resto de las medidas se orientan según la gravedad de las quemaduras."},{"p":"Debido a la acción térmica de la corriente eléctrica se produce una pérdida de líquido en el cuerpo, por lo que se recomienda rehidratar el paciente una vez que se descarten lesiones cardiacas."},{"h":"LESIONES POR CALOR"},{"p":"Las lesiones por calor se clasifican de menor a mayor gravedad de la siguiente manera: Alteraciones de la piel, síncope por calor, calambres por calor, agotamiento por calor y golpe de calor."},{"p":"Para cuestiones didácticas revisaremos los tipos que ponen en riesgo la vida y se consideran una urgencia médica."},{"h":"Golpe de calor"},{"p":"Es una falla de la función cerebral manifestada por alteración del estado mental, hipertermia, signos vitales anormales, piel seca y caliente."},{"h":"Datos clínicos"},{"p":"Antecedente de exposición a zonas de alta temperatura o de haber realizado un ejercicio extenuante en un ambiente caliente."},{"p":"Mareo, debilidad, náuseas, vómito, confusión, delirio y alteraciones de la vista. También pueden ocurrir convulsiones o pérdida de la conciencia."},{"p":"Aumento en la frecuencia respiratoria, temperatura elevada (>40 °C)."},{"h":"Manejo de primeros auxilios"},{"li":"Retirar al paciente de la fuente de calor."},{"li":"Retirar ropa al paciente."},{"li":"Se rociará el paciente con agua fría (15 °C aproximadamente)."},{"li":"Colocar el paciente en decúbito lateral."},{"li":"Apoyarse con fomentos de agua fría en frente, axilas, cuello, ingles."},{"li":"Valorar constantemente los signos vitales y estar atentos para aplicar soporte vital básico."},{"li":"Transporte inmediato a servicio de urgencias."},{"h":"Agotamiento por calor"},{"p":"Cuadro clínico caracterizado por agotamiento, deshidratación, confusión, aumento de frecuencia cardiaca, temperatura mayor a 38 °C y piel húmeda."},{"h":"Signos y síntomas"},{"li":"Sed intensa"},{"li":"Debilidad"},{"li":"Fatiga"},{"li":"Dolor de cabeza"},{"li":"Confusión"},{"li":"Calambres"},{"h":"Tratamiento"},{"li":"Retirar el paciente del área de calor."},{"li":"Colocar en un lugar frío y sombreado."},{"li":"Hidratarlo vía oral con soluciones ricas en sodio. (electrolit)"},{"li":"Trasladarlo a servicio de atención médica para valoración."},{"h":"LESIONES POR FRÍO"},{"p":"Las lesiones por frío se clasifican en sistémicas y localizadas, para cuestiones de urgencia se revisará únicamente la generalizada conocida como hipotermia sistémica."},{"h":"Hipotermia sistémica"},{"p":"La hipotermia sistémica es la reducción de la temperatura central del organismo por debajo de los"},{"p":"35 °C. La hipotermia puede llegarse a presentar con temperaturas ambientales de 18.3 °C o en el agua a"},{"p":"22.2 °C."},{"p":"El cuerpo humano al quedar expuesto a ambientes fríos, tiene la reacción de constricción de vasos sanguíneos superficiales y aumento de la producción de calor mediante movimientos involuntarios (temblor)."},{"p":"En la hipotermia, disminuyen las funciones de defensa, se reduce el consumo de oxígeno 7% por cada grado centígrado que disminuye la temperatura y se corre gran riesgo de presentar trastornos del corazón como la fibrilación ventricular."},{"h":"Datos clínicos"},{"p":"El interrogatorio es importante para evaluar las condiciones en las que se encontró el paciente, duración de la exposición y otro tipo de lesiones que pudieran acompañar, valorar el probable uso de drogas o alcohol."},{"li":"Temperatura corporal de 35 °C o menos."},{"li":"Piel fría, seca, pálida e hinchada."},{"li":"Lenguaje incoherente."},{"li":"Puede existir agresividad."},{"li":"Pulso débil o no palpable."},{"h":"Tratamiento inicial"},{"p":"Retirar de inmediato al paciente del sitio de exposición, trasladar a un lugar cálido para su atención."},{"p":"1. Retirar ropa, teniendo en cuenta que el lugar debe de estar cálido para evitar un enfriamiento mayor."},{"p":"2. Colocar compresas calientes en cuello, axila, ingle."},{"p":"3. Si el paciente puede digerir, dar a beber líquidos calientes que no contengan cafeína ni alcohol."},{"p":"4. Valorar el soporte vital básico en caso de que sea necesario."},{"p":"5. En caso de administrar RCP se debe continuar con la terapia de calentamiento del paciente."},{"p":"6. Administrar oxígeno durante el tratamiento a 8 lts por minuto."},{"p":"7. Trasladar a una evaluación médica completa."},{"h":"INTOXICACIONES POR MATERIALES PELIGROSOS"},{"h":"GENERALIDADES"},{"p":"Una intoxicación o envenenamiento es la agresión que sufre el organismo debido al entrar en contacto con una sustancia química peligrosa."},{"p":"Es importante contar con la guía de respuesta a emergencia con sustancias químicas y las MSDS en cada una de las brigadas de rescate, el conocimiento y correcto uso de las mismas ayudará mucho en caso de contingencias e intoxicaciones que involucren materiales peligrosos (sustancias químicas peligrosas)."},{"p":"Existen tres vías de entrada por la cual los químicos pueden causar toxicidad en el organismo: Vía oral (ingestión), vía respiratoria (inhalación) y vía cutánea (absorción por la piel)."},{"p":"La sintomatología generalizada puede consistir en uno o varios de los siguientes síntomas: mareos, dolor de cabeza, náuseas, vómito, somnolencia, debilidad generalizada, síncope, pérdida de la consciencia, paro respiratorio, paro cardiorrespiratorio, etc."},{"p":"Es importante el interrogatorio del paciente o investigar de manera rápida acerca de la exposición reciente a sustancias químicas peligrosas, ya que si no existiera exposición probablemente la sintomatología mencionada puede deberse a otro padecimiento que no se relacione a sustancias químicas."},{"p":"Una sustancia química peligrosa es aquella que por sus propiedades físicas y químicas presenta la posibilidad de afectar la salud (toxicidad) de las personas expuestas, de inflamarse o reaccionar de manera especial o de causar daños materiales a las instalaciones, al ser manejada, transportada, almacenada o procesada."},{"p":"La toxicidad es la capacidad de una sustancia para causar daño a la salud o a un organismo vivo."},{"li":"Tóxico. Las sustancias y preparados que, por inhalación, ingestión o penetración cutánea en pequeñas cantidades puedan provocar efectos agudos o crónicos e incluso la muerte."},{"li":"Nocivo. Las sustancias y preparados que, por inhalación, ingestión o penetración cutánea puedan provocar efectos agudos o crónicos e incluso la muerte."},{"li":"Corrosivo. Las sustancias y preparados que, en contacto con tejidos vivos puedan ejercer una acción destructiva de los mismos."},{"li":"Irritante. Las sustancias y preparados no corrosivos que, en contacto breve, prolongado o repetido con la piel o las mucosas puedan provocar una reacción inflamatoria."},{"li":"Sensibilizante. Las sustancias y preparados que, por inhalación o penetración cutánea, puedan ocasionar una reacción de hipersensibilidad, de forma que una exposición posterior a esa sustancia o preparado dé lugar a efectos negativos característicos."},{"li":"Carcinogénico. Las sustancias y preparados que, por inhalación, ingestión o penetración cutánea puedan producir cáncer o aumentar su frecuencia."},{"li":"Mutagénico. Las sustancias y preparados que, por inhalación, ingestión o penetración cutánea, puedan producir alteraciones genéticas hereditarias o aumentar su frecuencia."},{"li":"Tóxico para la reproducción. Las sustancias y preparados que, por inhalación, ingestión o penetración cutánea, puedan producir efectos negativos no hereditarios en la descendencia, aumentar la frecuencia de éstos, afectar de forma negativa a la función o a la capacidad reproductora."},{"li":"Peligroso para el ambiente. Las sustancias y preparados que presenten o puedan presentar un peligro inmediato o futuro para uno o más componentes del medio ambiente."},{"p":"Para cuestiones de manual valoraremos los primeros auxilios generales para las sustancias tóxicas y corrosivas."},{"h":"Manejo de primeros auxilios:"},{"p":"1. Retirar el paciente de la fuente de exposición (Haz-mat)."},{"p":"2. Descontaminación."},{"p":"3. Soporte vital básico en caso necesario, administrar respiraciones con dispositivo bolsa-válvula-mascarilla en caso que la víctima haya ingerido o inhalado la sustancia."},{"p":"4. Administrar oxígeno en caso de que la víctima respire con dificultad."},{"p":"5. Recabar información del químico involucrado en la intoxicación (MSDS, guía de manejo de sustancias químicas)."},{"p":"6. Valorar probable vía de intoxicación (oral, respiratoria o cutánea)."},{"p":"7. Enjuagar con abundante agua las áreas de la piel que hayan estado en contacto con la sustancia química."},{"p":"8. Trasladar al servicio médico de inmediato."},{"h":"INTOXICACIÓN POR CIANURO DE SODIO"},{"p":"El cianuro de sodio es una sal (forma sólida) derivada del ácido cianhídrico (forma gaseosa)."},{"p":"La palabra cianuro proviene del radical ‘cian’ del griego kyanos=azul oscuro, gas capaz de provocar cianosis, es decir una coloración azul de la piel, como consecuencia de la disminución de la oxigenación en la sangre."},{"p":"Las sales de cianuro y el cianuro de hidrógeno se usan en galvanoplastia, metalurgia, producción de sustancias químicas orgánicas, revelado de fotografías, manufactura de plásticos, fumigación de barcos y en algunos procesos de minería (lixiviación de oro o plata)."},{"h":"Vías de ingreso al cuerpo:"},{"li":"Inhalación del ácido cianhídrico."},{"li":"Absorción por la piel del cianuro de sodio."},{"h":"Mecanismo de acción en el cuerpo"},{"p":"La intoxicación por cianuro de sodio, es el conjunto de signos y síntomas que se presentan en el organismo posterior a una exposición al cianuro de sodio o ácido cianhídrico, sin el equipo de protección personal adecuado."},{"p":"El cianuro en el cuerpo inhibe una enzima (la citocromo-oxidasa) lo cual hace que las células no puedan respirar (anoxia citotóxica) disminuyendo de manera considerable las concentraciones de oxígeno en el cuerpo (hipoxia), si esta condición continua por mucho tiempo, puede llevar a perdida de la conciencia, paro respiratorio, paro cardiorrespiratorio o incluso la muerte."},{"h":"Signos y Síntomas"},{"h":"Exposición leve:"},{"li":"Enrojecimiento de ojos."},{"li":"Dolor de Cabeza."},{"li":"Náusea."},{"li":"Mareo."},{"li":"Debilidad."},{"p":"II. Exposición severa:"},{"li":"Dificultad para respirar."},{"li":"Convulsiones."},{"li":"Coloración azul de labios, uñas."},{"li":"Pérdida de Consciencia."},{"li":"Paro Cardiorrespiratorio."},{"h":"Tratamiento primeros auxilios"},{"p":"Cualquier exposición al cianuro de sodio o ácido cianhídrico que presente sintomatología, es necesario realizar el protocolo siguiente:"},{"li":"Retirar a la víctima del sitio de exposición."},{"li":"Retirar ropa contaminada."},{"li":"Retirar de la víctima cualquier resto de cianuro de sodio con los protocolos pertinentes."},{"li":"Administrar oxígeno con mascarilla a 10 lts por minuto."},{"li":"En caso de presentar paro cardiorrespiratorio, las respiraciones deben administrarse con un dispositivo bolsa-válvula-mascarilla para evitar exposición."},{"p":"NUNCA ADMINISTRAR RESPIRACIONES BOCA-BOCA EN PACIENTE QUE SUFRE INTOXICACIÓN POR ÁCIDO CIANHÍDRICO."},{"li":"Administrar ampolletas de Nitrito de amilo (Cianokit). 30 segundos dentro de la mascarilla y 30 segundos fuera de la mascarilla por un lapso de tres minutos."},{"li":"Cambiar de ampolleta después de los tres minutos."},{"li":"Trasladar de inmediato a centro médico que cuente con cianokit completo."},{"h":"INTOXICACIÓN POR MONÓXIDO DE CARBONO"},{"p":"El monóxido de carbono es un gas inodoro, incoloro, inflamable, asfixiante y altamente tóxico. Es un producto de la combustión incompleta de material que contiene carbono (gasolina, diésel, petróleo, keroseno, gas entre otros), resultado de explosiones o incendios y de algunos procesos industriales y biológicos."},{"p":"La intoxicación por monóxido de carbono es el conjunto de signos y síntomas, que se derivan de la entrada del monóxido de carbono en el organismo, llegando a causar desde un dolor de cabeza leve hasta un fallo cardiorrespiratorio o inclusive la muerte."},{"h":"Signos y Síntomas"},{"p":"Todo paciente que refiera dolor de cabeza, náusea o ganas de vomitar y se haya encontrado expuesto a monóxido de carbono, se debe sospechar de una intoxicación por monóxido de carbono (CO)."},{"p":"La sintomatología aparecerá si la concentración de monóxido de carbono supera la 100 p.p.m."},{"p":"La sintomatología puede incluir uno o varios de los siguientes signos y síntomas:"},{"li":"Mareo"},{"li":"Dolor de cabeza"},{"li":"Debilidad"},{"li":"Fatiga"},{"li":"Síncope"},{"li":"Paro respiratorio"},{"li":"Paro cardiorrespiratorio"},{"h":"Manejo de primeros auxilios"},{"p":"1. Retirar al paciente del área de intoxicación a un sitio de aire fresco."},{"p":"2. Soporte vital básico."},{"p":"3. Oxígeno con mascarilla reservorio a 8 lts/minuto."},{"p":"4. Traslado de inmediato a un centro médico para su valoración."},{"h":"VENDAJES"},{"p":"Es un procedimiento o técnica que consiste en envolver una parte del cuerpo que esta lesionada o requiere de una atención en específico. Actualmente su uso más frecuente es para cubrir las lesiones cutáneas e inmovilizar las lesiones osteoarticulares."},{"p":"Es utilizado en el tratamiento de heridas, hemorragias, contusiones, esguinces, luxaciones y fracturas."},{"p":"Las indicaciones de los vendajes son diversas y, entre ellas, podemos señalar las siguientes:"},{"li":"Fijar apósitos o medicamentos tópicos."},{"li":"Limitar el movimiento de una articulación afectada."},{"li":"Fijar férulas, impidiendo que se desplacen."},{"li":"Comprimir adecuadamente una parte del cuerpo."},{"li":"Facilitar sostén a alguna parte del cuerpo."},{"li":"Fijar en su sitio los aparatos de tracción o de inmovilización."},{"li":"Favorecer el retorno de la circulación venosa."},{"li":"Moldear zonas del cuerpo (muñones de amputación)."},{"h":"Reglas para vendajes"},{"p":"1. Que la extremidad se encuentre libre de ropa o joyas."},{"p":"2. Procurar que la extremidad se encuentre relajada, de esta manera el vendaje será más efectivo."},{"p":"3. La región a vendar se debe encontrar lo más limpia posible."},{"p":"4. El vendaje se debe de aplicar de la periferia al centro. (ejemplo: De la muñeca al brazo)"},{"p":"5. Vendar de manera uniforme y firme, cubriendo 2/3 del ancho de la vuelta anterior. La tensión y la presión deberán mantenerse iguales durante todo el proceso."},{"p":"6. Dejar el extremo distal de la zona vendada libre para comprobar la vascularización, movilidad y sensibilidad."},{"h":"Tipos de vendajes más frecuentes:"},{"li":"Capelina: Utilizado en cráneo."},{"li":"Vendaje cruzado: Se utiliza en pecho o espalda."},{"li":"Vendaje circular en espiral o inversos: Para extremidades."},{"li":"Vendaje de pelvis o vientre."},{"li":"Vendaje con dona protectora."},{"h":"Puntos importantes:"},{"li":"Nunca colocar un vendaje húmedo."},{"li":"No realizar cruces excesivos o indebidos sobre las articulaciones mal cubiertas y/o superficies inflamadas."},{"li":"Hay que conservar el rollo de la venda hacia arriba, sin desenrollarlo demasiado."},{"li":"El vendaje siempre deberá ser bajo indicación precisa y no deberá de utilizarse de manera rutinaria o innecesaria."},{"h":"LEVANTAMIENTO Y MOVILIZACIÓN DE LESIONADOS"},{"p":"DEFINICIÓN: Son los movimientos o maniobras que se realizan para trasladar a un lesionado del sitio del accidente a un lugar seguro y/o servicio de urgencias."},{"p":"Por lo tanto, en el transcurso de un servicio de urgencia/rescate tendrá que mover al paciente varias veces para proporcionarle los primeros auxilios en la escena y durante su traslado a la sala de urgencias con frecuencia tendrá que llevarlo a una posición o sitio diferente. Una vez que lo haya examinado y brindado los primeros auxilios, usted y su equipo tendrán que llevarlo a la férula espinal (tabla larga) y posterior a la camilla canoa, para su posterior traslado."},{"p":"IMPORTANCIA: Es básica y no debemos subestimarla, porque de ella depende la vida del lesionado y que una lesión leve se convierta en una lesión grave."},{"p":"PROPÓSITO: Mejorar en todo momento las condiciones de como encontramos al paciente."},{"h":"REGLAS DE SEGURIDAD PARA EL BRIGADISTA"},{"p":"1. Estar bien fajado."},{"p":"2. Hacer fuerza con brazos y piernas y mantener la columna recta."},{"p":"3. Creer poder con el peso del lesionado."},{"p":"4. Actuar con serenidad, agilidad, precaución y confianza en todo momento (no efectuar acciones temerarias)."},{"p":"5. No correr con el lesionado sin razón."},{"h":"RECOMENDACIONES GENERALES PARA EL BIRGADISTA"},{"p":"1. Deberá infundir confianza y bienestar al lesionado."},{"p":"2. No brincar por encima del lesionado. (Solo en caso necesario)"},{"p":"3. No mover o levantar al lesionado sin antes haberle aplicado los primeros auxilios."},{"p":"4. Los diferentes movimientos podrán sufrir adaptaciones, obligadas por las circunstancias a criterio del brigadista."},{"p":"5. Los agarres deben de ser con las palmas viendo hacia arriba."},{"h":"SISTEMA DE MOVILIZACIÓN"},{"p":"Los distintos sistemas de movilización del paciente lesionado o enfermo serán de acuerdo a la lesión o padecimiento que presente la víctima tomando en cuenta su situación."},{"p":"La necesidad de inmovilizar la columna vertebral puede estar determinada por la cinemática del trauma, por la presencia de lesiones provocadas por mecanismos de alta energía, o por signos y síntomas específicos de lesión de la columna vertebral."},{"p":"Las lesiones de columna se deben sospechar en las siguientes situaciones:"},{"p":"1. Impacto violento sobre cabeza, cuello, tronco, pelvis o extremidades."},{"p":"2. Aceleración, desaceleración o flexión lateral súbitas."},{"p":"3. Caídas de altura."},{"p":"4. Volcaduras sin cinturón de seguridad o víctima eyectada."},{"p":"5. Víctimas de explosión."},{"p":"6. Clavados en agua poco profunda."},{"p":"7. Evidencia de trauma de alto impacto:"},{"li":"Pacientes muertos en el mismo vehículo o lugar."},{"li":"Impactos de alta velocidad (mayores a 32 km/hora)."},{"li":"Deformidad del automóvil mayor de 50 cms."},{"li":"Desplazamiento posterior del eje frontal del vehículo."},{"p":"8. Colisión de peatón o bicicleta contra automóvil."},{"p":"9. Colisión de conductor o pasajero en motocicletas."},{"h":"Tipos de camillas"},{"li":"Carro camilla: Pesa de 18 a 31 kg. Es muy cómoda para el lesionado y su mayor utilidad es en hospitales y ambulancias."},{"li":"Camilla militar: Pesa de 7 a 15 kg. Su mayor uso es en eventos con múltiples víctimas. Con limitaciones a lesionados leves y lesiones ya feruladas."},{"li":"Camilla marina: Pesa de 2 a 4 kg. Su ventaja sobre las demás es su poco peso y se utiliza en las grandes ciudades, donde el espacio es muy reducido, (departamentos, vecindades, escaleras angostas, pasillos, etc.). con limitaciones a lesionados leves y lesiones ya feruladas."},{"li":"Camilla canoa: Pesa de 12 a 15 kg. Es utilizada en rescate de alta montaña y de sitios de difícil acceso es más segura para el lesionado a grandes alturas. Soporta hasta 250 kg."},{"li":"Camilla rígida o férula espinal larga: Pesa de 8 a 12 kg. Nos da soporte para cuando se sospecha de lesiones en cadera, pelvis, columna vertebral y extremidades inferiores."},{"li":"Férula espinal corta: Pesa de 1 a 2 kg. para aplicar R. C. P."},{"h":"SISTEMAS DE TRANSPORTE DE LESIONADOS"},{"p":"Sistemas para transportar lesionados por un solo brigadista:"},{"li":"Carga sobre los hombros: Para levantar y transportar a una persona consciente o inconsciente, en cualquier lugar, NO debe tener fracturas, puede encontrarse quemada, intoxicada desmayada."},{"li":"Rautek: Es el más rápido de todos, pues nos sirve para sacar a una persona consciente e inconsciente, que se encuentre en un incendio, explosión, derrumbe o para bajarlo de un carro."},{"p":"Sistemas para arrastrar a un lesionado:"},{"li":"Arrastre de cinturón o piola: Sirve para sacar a un lesionado consciente o inconsciente de partes bajas y estrechas, o que se encuentre bajo un vehículo, una balacera, etc."},{"li":"Arrastre de bombero: Nos sirve para sacar a una persona consciente o inconsciente de un incendio NO debe tener fracturas."},{"p":"Sistemas para transportar a un lesionado por dos brigadistas:"},{"li":"Silla de dos manos con respaldo: Nos sirve para transportar a un lesionado semiconsciente, la mano restante sirve para retirar obstáculos, para ayudar si fuera necesario a cargar el pie del lesionado (solo si este tiene probable fractura o luxación)."},{"li":"Silla de tres manos: Nos sirve para trasladar a una persona de mayor peso, completamente consciente, la mano restante sirve para retirar obstáculos o para sostener el pie del lesionado si fuera necesario."},{"li":"Silla de tres manos con medio respaldo: Sirve para trasladar a un lesionado semiconsciente."},{"li":"Silla de cuatro manos: Sirve para trasladar a un lesionado completamente consciente y de mayor peso (no debe tener fracturas)."},{"li":"Movimiento de atrás hacia adelante: Nos sirve para sacar a un lesionado consciente o inconsciente de partes angostas o para bajarlo de un vehículo (no debe tener fracturas)."},{"p":"Sistemas para transportar lesionados por tres brigadistas:"},{"li":"Movimiento de atrás hacia adelante por tres elementos: Para levantar y trasladar a dos lesionados a la vez (no deben tener fracturas)."},{"li":"Levantamiento por tres elementos: Es el más usual y nos sirve para subir a un lesionado a la camilla, al lugar donde se va a recibir atención médica, a la cama o para pasar por un pasillo angosto, puede tener fracturas en cualquier parte del cuerpo debidamente feruladas, excepto en cráneo, pelvis o en columna vertebral."},{"li":"Levantamiento de puente: Este levantamiento nos sirve para colocar en la camilla al lesionado este levantamiento se hace por cinco elementos y uno más para que coloque la camilla. También se utiliza para sacar a una persona de una zanja."},{"h":"INMOVILIZACIÓN DE PACIENTE CON LESIONES DELICADAS"},{"p":"NOTA: En los movimientos colectivos, la camilla va al lesionado y no el lesionado a la camilla."},{"p":"PASOS PARA LA INMOVILIZACIÓN SOBRE LA TABLA LARGA"},{"p":"(EMPAQUETAMIENTO)"},{"p":"ROTACIÓN DEL PACIENTE: Se realiza por 4 brigadistas y su principio es girar al paciente mientras se mantiene la estabilización manual con un movimiento mínimo de la columna vertebral, este movimiento tiene dos indicaciones 1) colocar al paciente sobre una tabla larga y 2) checar cualquier traumatismo de la columna y explorar la espalda."},{"p":"Método para la rotación y empaquetamiento:"},{"p":"1. Si no está contraindicado, mueva la cabeza a la posición neutral alineada manteniendo la inmovilización manual y colocar collarín cervical."},{"p":"2. Rodar ligeramente al paciente sobre su costado y colocarle la tabla larga manteniendo un ángulo contra la espalda y se hace rodar al mismo sobre ella descendiéndola al suelo."},{"p":"3. Una vez en el suelo inmovilice el tronco superior con el sistema spider a la tabla para que no se mueva hacia arriba, hacia abajo o lateralmente. (Hombros y axilas)"},{"p":"4. Inmovilice la parte inferior (extremidades inferiores) de manera tal que no pueda moverse hacia arriba, hacia abajo o lateralmente. (Crestas iliacas, rodillas y pies)"},{"p":"5. Colocar los inmovilizadores de cráneo. Y ajustar las correas de la barbilla y la frente del paciente."}]},{"c":"EHS-D-004","n":"Procedimiento para el manejo, transporte y almacenamiento de sustancias químicas peligrosas","nk":"NOM-005-STPS-1998","k":"Procedimiento","p":"Reglas de manejo, transporte y almacenamiento seguro de sustancias químicas peligrosas.","o":"F-SH-005-00","b":[{"h":"1.0 Propósito"},{"p":"1.1 El presente programa pretende establecer las condiciones, así como los controles específicos de manejo, transporte y almacenamiento de las sustancias químicas usadas en las operaciones de North America Floring/Shelser"},{"h":"2.0 Alcance"},{"p":"2.1 Todos los Empleados de North America Floring/Shelser, Proveedores, clientes y Contratistas que por algún motivo deban ingresar a la planta e instalaciones o realicen alguna obra por un periodo determinado."},{"p":"Este programa deberá ser obligatoriamente respetado y practicado por las personas antes mencionadas mientras se encuentren en las instalaciones de North America Floring/Shelser"},{"p":"."},{"li":"Definiciones"},{"p":"3.1 Sustancia química: Es aquella sustancia que por su composición puede presentar riesgos de toxicidad, inflamabilidad, corrosividad, reactividad, radiactividad, etc."},{"p":"3.2 Maniobra: Conjunto de pasos para realizar un trabajo específico."},{"p":"3.3 Trasvase: Operación y / o terminación que se utiliza en las operaciones de pasar un líquido de un recipiente a otro."},{"li":"Cable de tierra: Dispositivo mecánico y manual que se usa para evitar acumulamiento de energía."},{"li":"Situación de Emergencia: Suceso no deseado que pudiera provocar un riesgo de daño a las instalaciones, maquinaria y equipo de la empresa."},{"li":"Parámetros: Reglas estandarizadas aplicables a la realización de un trabajo determinado."},{"p":"3.7 Señal de seguridad: Cualquier material impreso, grabado o pintado para identificar sustancias químicas."},{"p":"3.8 Hojas técnicas de especificación: Es la información de Seguridad e Higiene necesaria sobre las sustancias químicas que debe existir por escrito en las áreas de trabajo del centro laboral"},{"p":"3.9 Corrosivo: Son ácidos o bases con factores pH menores de 2 o mayores de 12 respectivamente."},{"p":"4.0 Reactividad: Sustancias que presentan reacciones químicas al contacto con el aire o el agua o con cambios de temperatura."},{"p":"4.1 Tóxico: Sustancias que presentan riesgo por envenenamiento y son peligrosas a la salud."},{"p":"4.2 Inflamable: Sustancias con puntos de ignición menores de 37.8°C (100°F)."},{"p":"4.3 Carburante: Mezcla de hidrocarburos que se emplea en los motores de explosión y de combustión interna. Ejemplos: la gasolina, el gasóleo y el diésel."},{"p":"4.4 Gases bajo presión: Gases comprimidos o licuados."},{"h":"4.0 Administración"},{"p":"4.1 Departamento de Seguridad e Higiene y Recursos Humanos o en su defecto el departamento de Mantenimiento."},{"li":"Procedimiento"},{"p":"RECEPCIÓN DE MATERIAL"},{"li":"RECEPCIÓN DE MATERIAL/SUSTANCIAS QUÍMICAS"},{"p":"5.1 Vigilancia avisa al técnico de Seguridad en turno de la llegada de material peligroso."},{"p":"5.2 El técnico de seguridad se debe desplazar a Vigilancia y revisar la unidad, que este cuente con todo el equipo y dispositivos de seguridad, para aprobar el ingreso."},{"p":"5.2.1 El técnico de seguridad verificará que el proveedor tenga las hojas de seguridad de cada químico a entregar y concuerden con los químicos entregados, así como se encuentren en concordancia a la normatividad vigente. Se otorgará una copia al técnico para su resguardo."},{"li":"NOTA: En caso de ausencia de hojas de seguridad no se aceptará el ingreso del químico. En caso de alguna anomalía deberá ser notificada inmediatamente a gerencia de la planta o dependencia de gobierno pertinente."},{"p":"5.2.2 El técnico de seguridad verificará los siguientes datos en las hojas de seguridad presentadas:"},{"li":"Nombre del fabricante"},{"li":"Datos de contacto del fabricante (dirección, número telefónico, correo, etc.)"},{"li":"Nombre del químico o compuesto."},{"li":"No. CAS"},{"li":"Condiciones especiales de manejo, transporte o almacenamiento."},{"li":"Equipo de protección requerido para su manejo."},{"li":"Precauciones especiales en el combate de incendio."},{"li":"Primeros auxilios"},{"li":"Que cuente con las 16 secciones de una Hoja de Datos de Seguridad:"},{"p":"a) SECCIÓN 1. Identificación de la sustancia química peligrosa o mezcla y del proveedor o fabricante:"},{"p":"b) SECCIÓN 2. Identificación de los peligros:"},{"p":"c) SECCIÓN 3. Composición/información sobre los componentes:"},{"p":"d) SECCIÓN 4. Primeros auxilios:"},{"p":"e) SECCIÓN 5. Medidas contra incendios:"},{"p":"f) SECCIÓN 6. Medidas que deben tomarse en caso de derrame accidental o fuga accidental:"},{"p":"g) SECCIÓN 7. Manejo y almacenamiento:"},{"p":"h) SECCIÓN 8. Controles de exposición/protección personal:"},{"p":"i) SECCIÓN 9. Propiedades físicas y químicas:"},{"p":"j) SECCIÓN 10. Estabilidad y reactividad:"},{"p":"k) SECCIÓN 11. Información toxicológica:"},{"p":"l) SECCIÓN 12. Información ecotoxicológica:"},{"p":"m) SECCIÓN 13. Información relativa a la eliminación de los productos:"},{"p":"n) SECCIÓN 14. Información relativa al transporte:"},{"p":"o) SECCIÓN 15. Información reglamentaria:"},{"p":"p) SECCIÓN 16. Otras informaciones incluidas las relativas a la preparación y actualización de las hojas de datos de seguridad:"},{"p":"5.3 Con la aprobación pasa el camión al lugar de desembarque."},{"p":"5.4 Posteriormente estaciona la unidad en el área de descarga colocando freno de mano y anclaje de caja."},{"p":"5.5 Personal asignado al área y seguridad industrial revisará la zona de descarga de la sustancia química para prevenir la realización de cualquier trabajo que pudiera generar una fuente de ignición o riesgo a esta operación, si este existiera no se procederá a realizar la maniobra."},{"p":"5.6 El operador de la unidad procederá a conectar la tierra respectiva para evitar el acumulamiento de energía estática."},{"p":"5.7 Será responsabilidad del operador y encargado del área supervisar la descarga del producto para prevenir cualquier derrame del producto en caso de que este se presente deberá de pararse por completo la maniobra correspondiente y comunicar a Seguridad Industrial. Los riesgos que presentan las sustancias químicas en su manejo se clasificarán de acuerdo con los posibles daños a la salud de los trabajadores, susceptibilidad de la sustancia a arder, a liberar energía o cualquier otro tipo de problema en:"},{"li":"Riesgo de salud"},{"li":"Riesgo de inflamabilidad"},{"li":"Riesgo de reactividad"},{"li":"Riesgo especial"},{"p":"La empresa debe tener un listado de las sustancias químicas que sean utilizadas."},{"p":"5.8 Queda prohibido a personal ajeno a esta área estar presente en las maniobras de descarga del producto."},{"p":"5.9 En caso de generar algún residuo del producto resultado del proceso de descarga, deberá depositarse en un recipiente adecuado a la sustancia que se esté manejando e identificarlo inmediatamente."},{"p":"5.10 Al término de las maniobras de descarga de la sustancia química serán retiradas las ayudas visuales preventivas."},{"li":"Recuerda: Cualquier situación que se presente o detecte alguna condición insegura en el área deberá ser reportada al Departamento de Seguridad e Higiene Industrial y Recursos Humanos o al Departamento de Vigilancia."},{"li":"RECEPCIÓN DE PIPA CON SUSTANCIAS QUÍMICAS"},{"p":"5.11 Vigilancia avisa al técnico de Seguridad en turno de la llegada de la pipa."},{"p":"5.12 El técnico de seguridad se debe desplazar a Vigilancia y revisar la unidad, de acuerdo al formato F-SH-002, y que este cuente con todo el equipo y dispositivos de seguridad, para aprobar el ingreso."},{"p":"5.13 Con la aprobación pasa la pipa a la báscula para verificar el peso de la misma."},{"p":"5.14 Posteriormente estaciona la unidad en el área de descarga y colocar letreros de prevención para evitar que personal no autorizado se acerque a dicha área."},{"p":"5.15 Personal asignado al área y seguridad industrial revisará la zona de descarga de la sustancia química para prevenir de cualquier trabajo que pudiera generar una fuente de ignición o riesgo a esta operación, si este existiera no se procederá a realizar la maniobra."},{"p":"5.16 El operador de la unidad procederá a conectar la tierra respectiva para evitar el acumulamiento de energía estática."},{"p":"5.17 El operador de la unidad realizara la conexión de la manguera e inspeccionara dicho equipo."},{"p":"5.18 No podrán realizarse conexiones de más de una manquera para realizar la maniobra, deberá ser solamente un tramo en buen estado."},{"p":"5.19 Será responsabilidad del operador y encargado del área supervisar la descarga del producto para prevenir cualquier derrame del producto en caso de que este se presente deberá de pararse por completo la maniobra correspondiente y comunicar a Seguridad Industrial. Los riesgos que presentan las sustancias químicas en su manejo se clasificarán de acuerdo con los posibles daños a la salud de los trabajadores, susceptibilidad de la sustancia a arder, a liberar energía o cualquier otro tipo de problema en:"},{"li":"Riesgo de salud"},{"li":"Riesgo de inflamabilidad"},{"li":"Riesgo de reactividad"},{"li":"Riesgo especial"},{"p":"La empresa debe tener un listado de las sustancias químicas que sean utilizadas."},{"p":"5.20 Por regla de seguridad ningún montacarguista podrá realizar el llenado de tanque de su unidad industrial mientras estén las maniobras de descarga de alguna sustancia química."},{"p":"5.21 Queda prohibido a personal ajeno a esta área estar presente en las maniobras de descarga del producto."},{"p":"5.22 En caso de generar algún residuo del producto resultado del proceso de descarga, deberá depositarse en un recipiente adecuado a la sustancia que se esté manejando e identificarlo inmediatamente."},{"p":"5.23 Al termino de las maniobras de descarga de la sustancia química serán retiradas las ayudas visuales preventivas."},{"p":"5.24 Retirar la conexión a tierra colocada en la unidad y realizar una inspección para cerciorarse de que no existe ningún riesgo."},{"li":"Recuerda: Cualquier situación que se presente o detecte alguna condición insegura en el área deberá ser reportada al Departamento de Seguridad e Higiene Industrial y Recursos Humanos o al Departamento de Vigilancia."},{"p":"ALMACENAMIENTO:"},{"p":"5.25 El responsable de Seguridad e Higiene se encargará de identificar las sustancias químicas según el riesgo que representen con pictogramas y códigos de identificación acordes a la NOM-018-STPS-2015."},{"p":"5.26 El responsable de Seguridad e Higiene se encargará de elaborar un análisis de compatibilidad de sustancias químicas previo a su almacenamiento. Dicho análisis deberá estar disponible en el área de almacenamiento para consulta de cualquier personal de la planta."},{"p":"5.27 Se deberá hacer además una clasificación y separación dependiendo el grado de resigo para la salud que represente la sustancia:"},{"li":"Grado 1: Riesgo Ligero"},{"li":"Grado 2: Riesgo Moderado"},{"li":"Grado 3: Riesgo Serio"},{"li":"Grado 4: Riesgo Severo"},{"p":"5.28 Las personas que durante cualquier proceso de operación en North America Floring/Shelser manejen sustancias químicas, tienen la obligación de consultar las Hojas Técnicas de Especificaciones previo al uso de cualquiera de estas."},{"p":"5.29 La señalización de sustancias químicas deberá:"},{"p":"a) Ser colocada en cada recipiente, así como en el área/ áreas donde se almacenarán las sustancias químicas segregadas según compatibilidades. (área, rack, recipiente, canastilla, estante, etc)"},{"p":"b) Ser colocada en los recipientes que se manejen en el área de producción."},{"p":"Aquí se deberá vigilar que todo recipiente, aun sea vaciado de otro de mayor tamaño, conserve la debida identificación y manejo etiquetado."},{"p":"c) Ser marcada, etiquetada, impresa, pintada, o adherida a cada recipiente en uso."},{"p":"d) Ser de material resistente a la corrosión o lavado evitando la alteración de colores y/o texto o contenido."},{"p":"e) Identificar cada sustancia de acuerdo a como aparece en las Hojas técnicas de especificaciones (según código, nombre común y/o nombre químico)"},{"p":"f) utilizar el sistema de pictogramas de peligros físicos y para la salud de acuerdo a la NOM-018-STPS-2015 (Apéndice B)."},{"p":"g) identificar los riesgos especiales de acuerdo a la NOM-018-STPS-2015. (Apéndices: A, C, D)."},{"p":"TRANSPORTACIÓN"},{"p":"5.30 Antes de transportar cualquier sustancia química se deberá consultar las instrucciones en la Hoja Técnica de Especificaciones de cada producto."},{"p":"5.31 Se entiende transportación también como la movilización de sustancias entre áreas dentro de la planta."},{"p":"USO DE SUSTANCIAS QUÍMICAS"},{"p":"5.32 Durante el uso de sustancias químicas se deberá respetar y utilizar el equipo de protección personal según se indica en las Hojas Técnicas de Especificaciones de cada producto."},{"p":"Es importante mantener las sustancias químicas en el área de trabajo debidamente identificadas y utilizarlas solamente según el uso destinado en el proceso de producción. (¡No mezclarlas y nunca utilizarlas en otra parte del proceso para el que fueron destinadas!)"},{"h":"6.0 Responsabilidad"},{"li":"La responsabilidad de realizar una transportación, recepción, manipulación, uso y almacenamiento del producto está directamente relacionada con los protagonistas que participen en el proceso total hasta que el producto en mención se encuentra plenamente seguro en el deposito respectivo."},{"p":"6.2 Es responsabilidad de los empleados: conocer el uso y manejo adecuado de las sustancias químicas a las que estén expuestos consultando previamente las hojas técnicas de especificaciones."},{"p":"6.3 El encargado de Seguridad e Higiene dentro de la planta es el Responsable de:"},{"li":"Comunicar a todos los empleados de North America Floring/Shelser sobre los riesgos de manejar sustancias químicas."},{"li":"Verificar que las Hojas Técnicas de todas las sustancias utilizadas en la operación de North America Floring/Shelser estén disponibles para las personas expuestas a las mismas"},{"p":"6.4 Participar en la capacitación y adiestramiento para el uso adecuado de sustancias químicas."},{"li":"Jurisdicción"},{"p":"7.1 North America Floring/Shelser se compromete a respetar las Leyes mexicanas por lo que la Ley Federal de Trabajo tendrá prioridad sobre el Reglamento Interior de Trabajo, Políticas y Normas."},{"li":"Distribución"},{"p":"8.1 Seguridad e Higiene"},{"li":"Referencias"},{"p":"9.1 NOM-005-STPS-1998, Relativa a las condiciones de seguridad e higiene en los centros de trabajo para el manejo, transporte y almacenamiento de sustancias químicas peligrosas."},{"p":"9.2 NOM-006-STPS-2014, Relativa a el manejo y almacenamiento de materiales-Condiciones de seguridad y salud en el trabajo."},{"p":"9.3 NOM-010-STPS-2014, Relativa a los agentes químicos contaminantes del ambiente laboral-Reconocimiento, evaluación y control."},{"p":"9.4 NOM-017-STPS-2008, Relativa a el equipo de protección personal, su selección, uso y manejo en los centros de trabajo."},{"p":"9.5 NOM-018-STPS-2015, Relativa a el sistema armonizado para la identificación y comunicación de peligros y riesgos por sustancias químicas peligrosas en los centros de trabajo."},{"p":"9.6 Hojas técnicas de seguridad de las sustancias utilizadas."},{"p":"9.7 Listado de químicos para uso en dentro de la planta."}]},{"c":"EHS-D-005","n":"Programa específico de seguridad e higiene para el manejo, transporte y almacenamiento de sustancias químicas peligrosas","nk":"NOM-005-STPS-1998","k":"Programa","p":"Programa específico con hojas de datos, orden y limpieza, EPP y plan de emergencias.","o":"F-SH-005-00","b":[{"h":"HOJAS DE DATOS DE SEGURIDAD DE LAS SUSTANCIAS QUIMICAS QUE SE MANEJAN, TRANSPORTAN O ALMACENAN EN EL CENTRO DE TRABAJO."},{"p":"A continuación se presenta una lista con las sustancias químicas con las que se cuenta dentro del centro de trabajo, además de la información de si se cuenta actualmente con la hoja de seguridad de la misma:"},{"t":[["SUSTANCIA QUIMICA","HOJA DE SEGURIDAD"],["","✓"]]},{"h":"PROCEDIMIENTOS DE LIMPIEZA Y ORDEN"},{"h":"En esta sección se deberá hablar sobre los pasos a seguir para cumplir con tener las sustancias químicas peligrosas en orden y de manera limpia para disminuir el riesgo a accidentes. Existen algunos puntos que deben ser considerados para este procedimiento y a los cuales se debe añadir las medidas de seguridad para cubrir dichos requisitos, como son:"},{"li":"Eliminar lo innecesario y clasificar lo útil."},{"li":"Acondicionar los medios para guardar y localizar el material fácilmente."},{"li":"Evitar ensuciar y limpiar después."},{"li":"Favorecer el orden y la limpieza."},{"li":"Gestionar adecuadamente el procedimiento"},{"h":"INFORMACIÓN DE LAS SUSTANCIAS QUIMICAS"},{"t":[["SUSTANCIA QUIMICA","CANTIDAD MAXIMA DE LA SUSTANCIA EN EL AREA DE PRODUCCION","EQUIPO DE PROTECCION PERSONAL ESPECIFICO"]]},{"h":"PROHIBICION DE INGERIR ALIMENTOS Y BEBIDAS, FUMAR Y UTILIZAR FLAMA ABIERTA"},{"p":"Se deben colocar letreros de acuerdo al tipo de material al que se pueda estar expuesto, desde no consumir alimentos en el área hasta no generar flama abierta o fumar en ciertas zonas. Para ello, se podrían colocar señalizaciones como las descritas en la NOM-003-SEGOB-2011, algunos ejemplos se muestran a continuación:"},{"p":"Dichos señalamientos deben cumplir con las siguientes características de acuerdo a la NOM-003- SEGOB-2011:"},{"li":"Color: seguridad en color rojo, con el fondo en blanco."},{"li":"Forma: círculo con una diagonal."},{"li":"Símbolo: silueta del objeto o acción prohibida (cigarro, bebida, alimento, flama, etc)."},{"li":"Aviso: en caso se querer describir la imagen se colocará su significado (opcional)."},{"h":"PLAN DE EMERGENCIAS"},{"p":"Dicho documento debe contener información sobre las acciones a llevar a cabo en caso de una emergencia, por accidente en el centro de trabajo o por situaciones externas. Basado en ello se puede considerar tener presentes los siguientes temas a desarrollar en el mismo:"},{"p":"1) Procedimientos de seguridad en caso de fuga, derrame, emanaciones o incendio;"},{"p":"2) Manual de primeros auxilios"},{"p":"3) Procedimiento para evacuación;"},{"p":"4) Procedimientos para volver a condiciones normales,"},{"p":"5) Procedimientos para rescate en espacios confinados"},{"h":"PROCEDIMIENTOS SEGUROS PARA REALIZAR ACTIVIDADES PELIGROSAS Y TRABAJOS EN ESPACIOS CONFINADOS"},{"h":"En caso de ser aplicable en el centro de trabajo"}]},{"c":"EHS-D-006","n":"Plan de atención a emergencias en la ejecución de trabajos en altura","nk":"NOM-009-STPS-2011","k":"Plan","p":"Activación del plan de emergencias y rescate para trabajos en altura.","o":"F-SH-009-00","b":[{"h":"ALCANCE"},{"p":"Este Procedimiento aplica a los trabajos que se realizan en alturas y que requieran de realizarse un rescate de un colaborador de NOMBRE DE LA EMPRESA o contratistas prestadores de servicios."},{"h":"PROPÓSITO"},{"li":"Establecer reglas y mecanismos para activar el plan de atención de emergencias por trabajos en alturas con colaboradores de NOMBRE DE LA EMPRESA o contratistas prestadores de servicios."},{"h":"DOCUMENTOS ASOCIADOS"},{"li":"Manual de primeros auxilios"},{"li":"Directorio de números de emergencias."},{"h":"DEFINICIONES"},{"li":"Absorbedor de energía; amortiguador de energía: El componente del sistema de protección personal para interrumpir caídas de altura, diseñado para disipar la energía cinética generada durante una caída, y que limita las fuerzas aplicadas en el sistema, en el dispositivo de anclaje y en el usuario."},{"li":"Andamio: Cualquier plataforma, con sus elementos de estructura, soporte y anclaje, elevada en forma temporal, soportada o suspendida, que es empleada para realizar trabajos en altura. Comprende, de m
