anera enunciativa, los tipos siguientes:"},{"li":"De un punto: El sostenido por cables en un solo punto de anclaje;"},{"li":"De dos puntos: El sostenido por cables en dos puntos de anclaje;"},{"li":"De varios puntos: El sostenido por cables en tres o más puntos de anclaje, y en el que los módulos de la plataforma no están articulados entre sí;"},{"li":"Continuo articulado: El constituido por módulos articulados sostenidos por cables en tres o más"},{"p":"puntos de anclaje;"},{"li":"Suspendido temporal: El instalado temporalmente en un edificio o estructura para efectuar tareas específicas, sostenido por uno o más puntos de anclaje, que deberá ensamblarse antes de ser utilizado en el sitio de trabajo, y desmantelarse o removerse al concluir las tareas, y"},{"li":"De varios puentes: El formado por dos o más niveles montados verticalmente."},{"li":"Arnés; arnés de cuerpo completo: El equipo de protección personal que se ajusta al torso y muslos del usuario, compuesto por elementos como bandas flexibles, hebillas, mecanismos de ajuste, herrajes y anillos metálicos, y que se emplea principalmente en los sistemas de detención de caídas para soportar al usuario."},{"li":"Autoridad laboral; autoridad del trabajo: Las unidades administrativas competentes de la Secretaría del Trabajo y Previsión Social que realizan funciones de inspección en materia de seguridad y salud en el trabajo y las correspondientes de las entidades federativas y del Distrito Federal, que actúen en auxilio de aquéllas."},{"li":"Bloqueador de caída de tipo corredizo: El dispositivo diseñado para sujetarse a un riel vertical o"},{"p":"línea de vida vertical, y deslizarse hacia arriba y hacia abajo, en respuesta a movimientos de ascenso, y que se bloquea automáticamente en respuesta al movimiento súbito de una caída."},{"li":"Cable de seguridad (en andamios suspendidos): El cable de respaldo que está aparejado con el dispositivo de paro en caso de caída, pero que no soporta normalmente la carga suspendida."},{"li":"Cable de suspensión: El cable que soporta la carga suspendida."},{"li":"Carga total (en sistemas de uso colectivo para trabajos en altura): El peso total al que se someterán los soportes del sistema de suspensión, que comprende el peso de los colaboradores, equipos,"},{"p":"herramientas y materiales de trabajo, así como de todos y cada uno de los componentes del propio sistema, como plataforma, malacates, cables, entre otros."},{"li":"Conector: El dispositivo que permite la unión física de dos elementos de un sistema de protección personal para interrumpir caídas de altura."},{"li":"Contrapesos: Los pesos sujetos al soporte de suspensión para contrarrestar el momento de volcamiento."},{"li":"Despliegue: La acción del absorbedor de energía, de extenderse permanentemente, para disipar la energía aplicada a él durante una caída."},{"li":"Dispositivos de seguridad (en los sistemas suspendidos): Los elementos que impiden el"},{"p":"desarrollo de una fase peligrosa, como falla en malacates, cables de suspensión, soportes y otros dispositivos de suspensión. Los tipos de dispositivos que se presentan normalmente son:"},{"li":"De descenso por falta de energía: Permite el descenso en forma manual de una plataforma motorizada;"},{"li":"De paro durante la caída: Detiene el descenso de la plataforma al actuar directamente en el cable de seguridad;"},{"li":"De detección de la inclinación: Indica la pendiente longitudinal de la plataforma, cuando excede un ángulo preestablecido;"},{"li":"Secundario: Detiene el descenso de la plataforma en caso de ruptura del cable de suspensión o falla del malacate, y"},{"li":"De freno secundario: Detiene el descenso de la plataforma al accionar directamente sobre el tambor, la polea de tracción o el extremo del eje impulsor."},{"li":"Equipo suspendido de acceso (para mantenimiento de edificios): El equipo concebido o seleccionado para ser instalado permanentemente en una estructura o edificio específico. Está compuesto de una plataforma suspendida y un soporte superior. En general, es una unidad con trole y malacate, que opera sobre rieles o sobre otra superficie apropiada, como una pista de concreto o monorriel, con trole transversal u otros sistemas superiores de suspensión."},{"li":"Escala móvil; escalera portátil; escalera de mano: El aparato portátil que consiste en dos piezas paralelas o ligeramente convergentes, unidas a intervalos por travesaños, y que sirve para subir o bajar a una persona de un nivel a otro."},{"li":"Estabilizador: El elemento en forma de brazo, en plataformas de elevación, que actúa como soporte para dar mayor estabilidad a la plataforma de elevación."},{"li":"Línea de vida: El segmento de material flexible que, junto con un absorbedor de energía, se utiliza como elemento de unión o conexión, en caso de caída de un colaborador."},{"li":"Línea de vida horizontal: La línea flexible bajo tensión cuyos extremos se sujetan a puntos de anclaje, y sobre la cual se puede deslizar un conector de un sistema de protección personal para interrumpir caídas de altura."},{"li":"Línea de vida vertical: La línea flexible instalada en forma temporal o permanente, suspendida o bajo tensión, y sobre la cual se puede conectar un bloqueador de caída de tipo corredizo."},{"li":"Malacate: El dispositivo de ascenso, descenso y tracción, que eleva o desciende la plataforma, canastilla o silleta en un sistema suspendido."},{"li":"Monorriel: El riel asentado en el perímetro del edificio al nivel de la azotea, para soportar y guiar el"},{"p":"trole transversal."},{"li":"Nivel de referencia: La superficie considerada como base para medir la altura del plano de trabajo."},{"li":"Patrón: La persona física o moral en quien recae la responsabilidad de ejecutar los trabajos en altura, mediante los servicios de uno o varios colaboradores a su cargo."},{"li":"Plataforma de trabajo; plataforma soporte: La superficie del andamio o plataforma de elevación,"},{"p":"que soporta a los colaboradores, equipos, herramientas y materiales, y desde la cual se realizan las actividades o trabajos en altura."},{"li":"Protección lateral; barandal: El resguardo dispuesto en forma perimetral en una plataforma de trabajo o en las zonas en las que existe riesgo de caída de altura."},{"li":"Punto de anclaje: El elemento que posee suficiente resistencia para la fijación de malacates, cables de suspensión, cables de seguridad y otros dispositivos de suspensión, soporte o paro durante una caída, y"},{"p":"que puede ubicarse o instalarse en los edificios, andamios suspendidos, plataformas de elevación, entre otros, en los que se realiza un trabajo en altura."},{"li":"Red de seguridad: La malla de material flexible dispuesta para detener la caída de una o varias personas y cuyo diseño impide que éstas sean proyectadas fuera de la red. Las redes también pueden emplearse como protección contra la caída de objetos."},{"li":"Sistema de protección personal para interrumpir caídas de altura; sistema de detención de caídas: El sistema que minimiza las fuerzas al momento de interrumpir la caída de altura; controla la distancia total recorrida durante la caída previniendo la colisión contra el piso o cualquier otro obstáculo, y permite mantener a la persona en una posición adecuada después de la caída para propósitos de rescate."},{"li":"Sistema de suspensión: El conjunto de elementos de un andamio suspendido u otro sistema similar, que comprende de manera general los soportes y las cuerdas o cables de suspensión."},{"li":"Sistemas personales para trabajos en altura: Aquéllos de uso personal empleados para suspender o soportar a un colaborador en actividades que impliquen riesgo de caída de altura. Incluyen también los utilizados para la prevención de caídas de altura y para la detención en el caso de que éstas lleguen a presentarse. Comprenden, entre otros, los denominados de restricción, posicionamiento, ascenso y/o descenso controlado y detención de caídas."},{"li":"Sistemas restrictivos de los cables de suspensión: Los dispositivos de un equipo suspendido, localizados horizontalmente en la pared del edificio, equipados con cabo y anillo acoplados a cada uno de los cables de suspensión durante el movimiento de descenso, y desacoplados en el ascenso."},{"li":"Soporte de suspensión; anclaje: La estructura fija o móvil que permite anclar los cables de suspensión y de seguridad."},{"li":"Tambor: El cilindro hueco de metal liso o ranurado, cuyos extremos están flanqueados por discos y"},{"p":"en el cual se enrolla el cable."},{"li":"Trabajos en altura: Las actividades de mantenimiento, instalación, demolición, operación, reparación, limpieza, entre otras, que se realizan a alturas mayores de 1.80 m sobre el nivel de referencia."},{"p":"Incluye también el riesgo de caída en aberturas en las superficies de trabajo, tales como perforaciones, pozos, cubos y túneles verticales."},{"li":"Trole transversal: El carro con ruedas que está diseñado para desplazarse con un movimiento transversal a lo largo de un monorriel del que se suspende una plataforma."},{"li":"Viga de suspensión: El elemento estático para soportar el equipo suspendido de acceso, cuya"},{"p":"estabilidad es asegurada con contrapesos."},{"h":"RESPONSABILIDADES"},{"li":"El coordinador de EHS es el responsable de mantener, actualizar e implementar este plan de rescate en trabajos en alturas."},{"li":"El líder de mantenimiento apoyara a la ejecución de este plan."},{"li":"El personal de la brigada de primeros auxilios, de la brigada de búsqueda y rescate, así como los líderes de área que autorizan los permisos de trabajo en altura y contratistas deben de conocer este plan."},{"li":"El personal de vigilancia debe conocer este plan, así como tener una copia impresa en caseta de vigilancia."},{"li":"En cada permiso de trabajo en alturas debe haber la firma de supervisor responsable, servicio médico, vigilancia y EHS para que estén enterados que un trabajo en alturas se está realizando y que existe la posibilidad de aplicar un rescate de trabajos en alturas."},{"li":"El colaborador que sufre un accidente, incidente en alturas debe comunicarlo de manera inmediata."},{"li":"El supervisor compañeros de trabajo involucrados en un accidente, incidente en trabajos en alturas deben comunicarlo inmediatamente para evitar cualquier riesgo para sus colaboradores."},{"h":"PROCEDIMIENTOS"},{"h":"ALERTAMIENTO Y COMUNICACIÓN DE LA EMERGENCIA:"},{"p":"Es la primera fase y la de mayor importancia, pues el rescate de una persona en las alturas debe ser ejecutado lo antes posible pues el colaborador suspendido, atorado o que requiera cualquier asistencia en alturas su salud depende de la rapidez de las acciones tomadas."},{"t":[["Diagrama de flujo","Actividad","Teléfonos","Responsable"],["","Comunicación directamente con el coordinador de EHS o líder de mantenimiento mediante aviso a Vigilancia.","EHS:\nVigilancia:","Jefe directo o mismo colaborador en emergencia"],["","Determinar con claridad las características del evento, lesionados, lugar, altura, trabajo desarrollado, posibles situaciones de riesgo, entre otros.","","Coordinador EHS"],["","Pese al tipo de emergencia, siempre se deberá solicitar el apoyo de bomberos y protección civil para asegurar la eficacia de las acciones a realizar.","Bomberos:\nProtección Civil:","Vigilancia"],["","Pese al tipo de emergencia, siempre se deberá solicitar el apoyo de bomberos y protección civil para asegurar la eficacia de las acciones a realizar.","","Vigilancia"]]},{"h":"SUSPENCIÓN DE LAS ACTIVIDADES:"},{"p":"En el momento que se ha declarado una situación de alerta y emergencia TODO trabajo que se realizaba en las alturas DEBE quedar suspendido, si en las instalaciones existe algún otro contratista, empleado de NOMBRE DE LA EMPRESA o cualquier otra persona está ejecutando este mismo u otro trabajo en alturas también debe suspender."},{"p":"El objetivo de esta suspensión es concentrar todos los recursos disponibles y atención posible al rescate y evitar que un segundo rescate sea requerido al mismo tiempo."},{"t":[["Diagrama de flujo","Actividad","Responsable"],["","Se notifica mediante teléfono, o altavoz que todos los trabajos en alturas quedan suspendidos","Coordinador EHS"],["","Todo aquel colaborador que realiza trabajos en alturas debe suspender las actividades y reportarse al líder de área","Jefe directo o líder de área"],["","Todo acceso de personal externo queda restringido, caseta de vigilancia notifica que no puede usar teléfonos o brindar atención pues está en proceso de emergencia, se debe tener libres los accesos y salidas de caseta.","Vigilancia"],["","Continuar con el procedimiento de rescate","Coordinador EHS"],["","Comenzar a bajar sin herramientas o equipo uno por uno. (si existe el menor riesgo para el personal en emergencia o para los colaboradores deben permanecer a la espera para el rescate)","Colaboradores en alturas"],["","Deben esperar sin entrar en pánico a que después de ejecutar el rescate o la atención de emergencia para bajar. (se debe buscar la manera de hidratarlos)","Jefe inmediato"],["","Deben de bajar únicamente si es seguro y sin riesgos.","Colaboradores en alturas"]]},{"h":"EL RESCATE:"},{"p":"En este punto se debe de contar con la siguiente información para poder ejecutar el rescate sin que exista algún otro lesionado o un riesgo mucho mayor durante el rescate."},{"li":"Lista detallada del material para el rescate."},{"li":"Cuerdas en piezas y en metros."},{"li":"Mosquetones con seguro"},{"li":"Puntos de anclaje."},{"li":"Cinta plana para rescate"},{"li":"Líneas de vida de acero."},{"li":"Plataforma de elevación disponible."},{"li":"Escaleras telescópicas"},{"li":"Ambulancia"},{"li":"Lista de los rescatistas en planta."},{"li":"Vigilancia debe cronometrar el tiempo desde que se activó la emergencia con el objetivo de conocer el tiempo que la persona lleva desde que inició la emergencia, este tiempo es de vital importancia, todo rescate debe ejecutarse lo más pronto posible"},{"li":"Tiempo en que los cuerpos de rescate fueron notificados."},{"t":[["Diagrama de flujo","Actividad","Responsable"],["","Mantenimiento eléctrico baja sistemas de alimentación eléctrica del área y verifica ausencia de voltaje","Líder de mantenimiento"],["","Se le dictan las actividades a realizar paso a paso, se debe notificar que es lo que ha sucedido, pregunta cómo se encuentra su estado de salud","Coordinador EHS"],["","Si es posible que un rescatista interno realice las actividades de rescate, estas se harán conforme a las instrucciones que le perezcan apropiadas","Todos"],["","Al llegar los cuerpos de apoyo externo si aún no ha terminado el rescate interno, entregar la atención a los cuerpos de emergencia profesionales.","Coordinador EHS"],["","Una vez a nivel del suelo dar atención al colaborador rescatado y brindar primeros auxilios en caso de ser necesario","Servicio Medico"]]},{"h":"PRIMEROS AUXILIOS"},{"h":"En el caso de que el colaborador rescatado requiera de primeros auxilios, estos deberán brindarse en base a lo indicado en el manual de primeros auxilios de NOMBRE DE LA EMPRESA y tomando en cuenta las siguientes directrices:"},{"li":"Se debe asegurar el espacio."},{"li":"No debe moverse al paciente si no hay un riesgo inminente hasta estabilizar lesiones."},{"li":"En caso de aprisionamiento se debe despejar primero la cara y el tórax."},{"li":"Se debe evaluar al paciente y establecer posibles lesiones."},{"li":"Se debe controlar las lesiones en orden de prioridad, asegurándose que vendajes e inmovilizaciones resistan el resto de la operación."},{"li":"Se debe controlar cualquier hemorragia."},{"li":"Se debe controlar constantemente los signos vitales."},{"li":"Se debe estabilizar cualquier la lesión cervical."},{"li":"Se debe colocar al paciente en posición cómoda, anatómica y segura."},{"li":"Se debe proteger al paciente de las inclemencias del clima (calor o frío)."},{"li":"Se deben aflojar prendas apretadas."},{"li":"Se deben mantener libres las vías respiratorias."},{"li":"Se debe prevenir y/o controlar el estado de shock."},{"li":"Se debe velar siempre por la dignidad del paciente."},{"li":"Se debe estabilizar la condición anímica del paciente."},{"h":"ELIMINACION DE RIESGOS."},{"h":"Para eliminar cualquier posible riesgo durante las operaciones de rescate se debe seguir con lo siguiente:"},{"h":"Antes de iniciar el rescate:"},{"li":"Evaluar los posibles riesgos."},{"li":"Asegurar vías de acceso"},{"li":"Delimitar las áreas de más alto riesgo dentro de la zona de impacto."},{"li":"Realizar evaluación de estructuras y marcación."},{"li":"Colocar señalización interna y externa."},{"li":"Realizar doble verificación de los sistemas de protección contra caídas."},{"li":"Controlar el número de rescatistas en el área."},{"li":"Asegurar vías de escape y señalizarlas."},{"li":"Evaluar y planear la operación de rescate."},{"h":"Durante el rescate:"},{"li":"El despliegue y traslado del rescatista hasta el accidentado es una maniobra delicada, por lo que requiere de tener en cuenta todos los parámetros técnicos para asegurar al rescatista y al accidentado."},{"li":"Después que el rescatista asiste al accidentado y lo desplaza a un lugar seguro el rescatista debe estabilizar al accidentado y remitir a un sitio donde se le brinde asistencia médica."},{"h":"Después del rescate"},{"li":"Se debe realizar una evaluación de la maniobra o proceso de rescate, con el fin de detectar cualquier posible error o falla por parte de los rescatistas o los equipos utilizados."},{"li":"Se debe verificar la condición de los rescatistas, de ser necesario se debe hacer una revisión medica para asegurar que se encuentren en condiciones saludables."},{"h":"USO DE SISTEMAS Y EQUIPOS DE RESCATE"},{"h":"Cuando no es posible que el colaborador ejecute un Autorescate y sea necesario realizar un rescate mecánico asistido, se deberán seguir las siguientes directrices:"},{"li":"La línea de vida será llevada hasta el colaborador, la que será tomada con una mano, y el mecanismo de izaje será operado hasta el levantamiento del colaborador hasta al nivel donde la caída se produjo."},{"li":"El colaborador podrá volver al suelo o terreno y tomar todos los componentes necesarios de su sistema de detención de caídas y ponerlo fuera de servicio."},{"li":"El colaborador guardara y etiquetara los componentes con su nombre, la fecha y la actividad en el momento de la caída y la entregara al coordinador de trabajo en altura o al coordinador de EHS"},{"h":"A continuación, se describen los principales sistemas de tracción mecánica asistida por sistema de cable o cuerda y su uso."},{"h":"a.) Sistema de polea sencilla:"},{"h":"Este sistema proporciona rescate rápido y eficaz de la víctima, se debe tener en cuenta la diferencia de proporcionalidad que se encuentran los pesos al momento del rescate, luego de que el rescatista que accede a la víctima se posicione e instale el sistema de polea sencilla se debe"},{"h":"realizar el descenso controlado de la víctima ya sea desde el lugar donde se encuentra el rescatista que accede o desde la superficie de suelo, se debe posicionar tanto el rescatista como la persona que descenderá la víctima para evitar la elevación brusca del rescatista por la diferencia de pesos."},{"h":"b.) Sistema de poleas doble y sencilla (3-1)"},{"h":"Este sistema proporciona rescate eficaz de la víctima, este tipo de polipasto es padre de todos, la base. Consiste en la combinación de una polea fija y una móvil. Se produce una ganancia mecánica de 3:1, es decir debemos ejercer una fuerza 3 veces menor de lo que nos correspondería, pero por contra por cada metro que supere la carga deberemos recoger 3m."},{"h":"Es posible que no se cuente con ningún otro sistema mecánico de rescate, entonces será necesario el descenso de un rescatista competente que asegure al colaborador accidentado y lo descienda de forma segura hasta el piso. Para ello se deben tener en cuenta las siguientes consideraciones:"},{"h":"ADVERTENCIA: Los rescates técnicos deben ser realizados por personas entrenadas y dotadas para tal fin, no se permite realizar rescates improvisando con equipos no aptos y personas inexpertas para tal fin."},{"li":"El rescatista ubicara un punto de anclaje seguro, usando para ello sistemas certificados para ello (Cintas de anclaje, anclajes móviles o tie off)"},{"li":"Descenderá usando un equipo de descenso conectado a su argolla ventral/pélvica o pectoral en caso de no tenerla y una línea de vida extra conectada a su argolla dorsal."},{"li":"El rescatista conectara a una línea extra o a su arnés de rescate si no hubiese otra manera al colaborador accidentado."},{"li":"A través de diferentes métodos de manejo de cargas (Sistema de poleas o polipasto) liberará al colaborador, desenganchándolo, cuando esto no sea posible, el rescatista deberá cortar el sistema de protección contra caídas usando una navaja."},{"li":"El colaborador liberado será izado o descendido al piso con el sistema de descenso o a la par con el rescatista."},{"li":"Preste los primeros auxilios al colaborador de ser necesario."},{"li":"El colaborador o el rescatista tomará todos los componentes necesarios del sistema de detención de caídas que fue activado y lo pondrá fuera de servicio."},{"li":"El colaborador o el rescatista guardara y etiquetara los componentes con el nombre de la víctima, la fecha y la actividad en el momento de la caída y la entregara al coordinador de trabajo en altura o al coordinador EHS."},{"h":"REANUDACION DE ACTIVIDADES"},{"h":"Se deberán realizar las siguientes actividades para desactivar el proceso de rescate y poder proceder a reanudar las actividades normales:"},{"h":"1. Control final del área del evento: Identificación de circunstancias que pudieran convertirse en posibles potenciales de riesgo, adicionalmente, el registro de evidencias que pudieran aportar información valiosa para el análisis de las causas del accidente."},{"h":"2. Recoger, inventariar y chequear equipos: En este paso se inspeccionan los equipos utilizados, teniendo en cuenta hacer el reporte y señalar los que han sufrido daño."},{"h":"3. Consolidar información: Normalmente se determinan formatos de consolidación de información de las maniobras de rescate, en donde se describen el personal, equipo, resultado e información importante para el seguimiento de las operaciones de rescate."},{"h":"Es responsabilidad de los rescatistas documentar lo mejor posible todas las acciones de rescate ya que involucran el salvamento de vidas y, además, pueden verse envueltos en procesos legales, en donde se investiguen posibles muertes. Esta información formalizada puede ayudar mucho en los procesos en donde se vean involucrados."},{"h":"4. Reportar disponibilidad: Este paso es la constante del personal de rescatistas, pues se tiene en cuenta aquellos que han reportado disponibilidad (estar listos), para la atención de eventos similares en donde puedan involucrarse según su capacidad."},{"h":"IDENTIFICACION DE LAS RUTAS DE EVACUACION Y DE ESCAPE"},{"h":"A continuación, se muestran las rutas de evacuación y escape de las áreas en las que se efectúan trabajos en altura."},{"h":"Añadir plano o mapa con rutas de evacuación de las áreas de la empresa donde se realizan trabajos en altura"},{"h":"ACCIONES POR IMPLEMENTAR, EN CASO DE CUALQUIER FALLA EN EL SISTEMA O EQUIPO EN USO"},{"h":"En caso de que se presente alguna falla en los sistemas o equipos utilizados en las emergencias que pueden presentarse en los trabajos en alturas que realiza el personal de NOMBRE DE LA EMPRESA, se deberán realizar las siguientes acciones:"},{"h":"Describir en base a los sistemas o equipos con los que cuenta la empresa"},{"h":"SISTEMAS Y EQUIPOS DE RESCATE, DE PROTECCIÓN PERSONAL U OTROS QUE SE REQUIEREN PARA LA ATENCIÓN DE LAS EMERGENCIAS QUE PUEDAN PRESENTARSE EN CADA UNO DE LOS TRABAJOS EN ALTURA QUE SE LLEVAN A CABO EN LA EMPRESA"},{"h":"A continuación, se enlistan los sistemas y equipos de rescate con los que cuenta NOMBRE DE LA EMPRESA, y que son necesarios para la atención de las emergencias que se pueden presentar en los trabajos en alturas que realiza su personal:"},{"h":"-"},{"h":"."},{"h":"."},{"h":"."},{"h":"CAPACITACIÓN Y ADIESTRAMIENTO DE LOS TRABAJADORES EN RELACIÓN CON EL CONTENIDO DEL PLAN."},{"h":"La capacitación y adiestramiento del contenido de este plan para los trabajadores de NOMBRE DE LA EMPRESA que realizan trabajos en alturas se realizara de acuerdo al siguiente cronograma:"},{"t":[["CRONOGRAMA DE CAPACITACION EN RELACION CON EL PLAN DE ATENCION A EMERGENCIAS EN LA EJECUCION DE TRABAJOS EN ALTURA"],["2022"],["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"]]},{"t":[["RESCATE DE TRABAJOS EN ALTURAS\n\nNOMBRE LAS PERSONAS A RESCATAR:\n1.- \n2.- \n3.- \n4.- \n5.- \nEMPRESA: TRABAJO QUE ESTABAN REALIZANDO: \n\n\n\nUBICACIÓN EXACTA EN DONDE SE ENCUENTRAN: \n\n\n\n\n\nALTURA ESTIMADA PARA HACER EL RESCATE: en metros ESTADO DE LOS INVOLUCRADOS:"]]}]},{"c":"EHS-D-007","n":"Programa específico de conservación de la audición","nk":"NOM-011-STPS-2001","k":"Programa","p":"Evaluación de ruido, protección auditiva, capacitación y vigilancia a la salud del personal expuesto.","o":"F-SH-011-00","b":[{"h":"EVALUACIÓN DEL NSA PROMEDIO Y LA DETERMINACIÓN DEL NER."},{"li":"Reconocimiento:"},{"li":"Áreas y fuentes emisoras"},{"p":"Se efectúo un recorrido en las instalaciones para hacer un reconocimiento de las áreas y/o fuentes emisoras, para posteriormente medir el NSA instantáneo,"},{"li":"Trabajadores con exposición potencial a ruido."},{"p":"De acuerdo a los resultados obtenidos sobre el NSA instantáneo se pueden identificar los trabajadores con exposición potencial a ruido."},{"li":"Método para la evaluación de la exposición a ruido en las áreas de trabajo."},{"p":"El método utilizado para la evaluación de la exposición a ruido en las áreas de trabajo donde existen puestos fijos de trabajo fue por método de SONOMETRÍAS. En el caso del puesto de operador de montacargas se utilizó el método de DOSIMETRIAS."},{"li":"Instrumentación para efectuar la evaluación de la exposición a ruido en las áreas de trabajo."},{"p":"Los instrumentos para efectuar la evaluación de la exposición a ruido están debidamente certificados."},{"p":"Toda la información puntual a los temas antes descritos se encuentra en el estudio de análisis de ruido efectuado en 11-12-2020"},{"li":"Evaluación."},{"p":"Los métodos de evaluación e instrumentos de medición establecidos en el Apéndice B de la NOM-011-STPS-2001, según lo referido en el estudio de ruido."},{"p":"Se determinaron los Niveles de Exposición a Ruido, aplicando el método establecido en el Apéndice B de la NOM-011-STPS-2001, según lo referido en el estudio de ruido, dando los siguientes resultados:"},{"p":"De acuerdo a los resultados anteriores las exposiciones a ruido exceden el NER de 80 dB(A) en la mayoría de las mediciones, por lo que el reconocimiento y evaluación del NER se repetirá cada dos años o dentro de los noventa días posteriores a un cambio de producción, procesos, equipos, controles u otros cambios, que puedan ocasionar variaciones en los resultados del estudio anterior."},{"h":"EVALUACIÓN DEL NIVEL DE PRESIÓN ACÚSTICA (NPA) EN BANDAS DE OCTAVA."},{"li":"Reconocimiento:"},{"p":"Se identificaron las áreas con NSA mayor o igual a 80 dB(A) y en donde la exposición a ruido de los trabajadores es representativa."},{"li":"Evaluación:"},{"p":"Se emplearon los métodos de evaluación e instrumentos de medición señalados en el Apéndice C de la NOM-011-STPS-2001, según lo referido en el estudio de ruido."},{"p":"Se cuantificaron los NPA dando los siguientes resultados."},{"p":"Periodo 1"},{"t":[["HZ","P1","P2","P3","P4","P5","P6","P7","P8","P9","P10","P11","P12","P13","P14","P15","P16","P17"],["31.5","75.3","75.9","76.6","75.3","75.4","","","","","","","","","","","",""],["63","83.9","83.9","83.6","83.9","90.7","","","","","","","","","","","",""],["125","83.2", ITIVA."},{"p":"Derivado del análisis anterior, se cuenta con los procedimientos siguientes:"},{"li":"Selección técnica y médica del EPP."},{"p":"El factor de reducción R o nivel de ruido efectivo en ponderación A (NRE) que proporciona dicho equipo, es 26 dB, mismo que cuenta con la debida certificación I"},{"li":"Capacitación de los trabajadores en su uso, mantenimiento, limpieza, cuidado, reemplazo y limitaciones."},{"li":"Supervisión de su uso por parte de los trabajadores."},{"p":"Se realiza una revisión diaria por parte de los supervisores para verificar el uso de los tapones auditivos. Al tener tres amonestaciones por medio de actas administrativas, se suspende el trabajador un día sin goce de sueldo, verificar que procedimiento se puede aplicar."},{"p":"Toda persona que ingrese a las áreas con señalamientos de uso obligatorio de equipo de protección personal auditiva deberá ingresar con dicho equipo."},{"h":"CAPACITACIÓN Y ADIESTRAMIENTO."},{"p":"Los trabajadores son capacitados respecto a las medidas de control, donde se incluye:"},{"li":"Efectos a la salud del ruido,"},{"li":"Niveles máximos permisibles de exposición,"},{"li":"Medidas de protección,"},{"li":"Exámenes audio métricos,"},{"li":"Sitios de trabajo que presenten condiciones críticas de exposición,"},{"p":"La información proporcionada en el programa de capacitación se actualiza, incluyendo prácticas de trabajo y del uso, cuidado, mantenimiento, limpieza, reemplazo y limitaciones de los equipos de protección auditiva según aplique o haya modificaciones."},{"h":"VIGILANCIA A LA SALUD."},{"p":"Para mantener vigilada la salud de los trabajadores, se tienen programadas audiometrías a cada trabajador expuesto a niveles de ruido de 85 dB(A) y mayores."},{"p":"El departamento de enfermería cuenta con los registros pertinentes sobre las audiometrías programadas en el transcurso del año."},{"h":"CONTROL."},{"p":"Los resultados del NER supera los límites máximos permisibles de exposición establecidos en la Tabla A.1, del a NOM-011-STPS-2001, por lo que se aplican las medidas de control siguientes, para mantener la exposición dentro de lo permisible:"},{"li":"Medidas técnicas de control, consistentes en Mantenimiento preventivo y correctivo de las fuentes generadoras de ruido; cuya programación se encuentra incluido en el Programa general de mantenimiento."},{"li":"Señalización de áreas donde se registraron más de 85 dB"},{"p":"En las áreas donde los NSA sean iguales o superiores a 85 dB(A), se colocaron señalamientos de uso obligatorio de equipo de protección personal auditiva, según lo establecido en la NOM-026-STPS-2008."},{"h":"Documentación del programa de conservación de la audición."},{"p":"La documentación del programa de conservación de la audición, se debe conservar durante los últimos 5 años."},{"h":"CRONOGRAMA DE ACTIVIDADES PARA EL DESARROLLO DE LA IMPLEMENTACIÓN DEL PROGRAMA DE CONSERVACIÓN DE LA AUDICIÓN."},{"h":"Colocar el cronograma de acuerdo a las actividades de la planta para el año en curso"}]},{"c":"EHS-D-008","n":"Acta de integración de la comisión de seguridad e higiene","nk":"NOM-019-STPS-2011","k":"Acta","p":"Integración de la comisión, funciones de sus miembros y causas de sustitución.","o":"F-SH-019-0","b":[{"h":"ACTA DE INTEGRACIÓN DE LA COMISIÓN DE SEGURIDAD E HIGIENE"},{"p":"En la ciudad de Municipio, Estado, el día 00 de mes del 0000 se reúnen por una parte los trabajadores que representan a la empresa Razon Social, quien inició operaciones el 00 de mes del año 0000, con registro Federal de Contribuyentes XXX-000000-0XX Registro Patronal del IMSS A000000000-0 y cuya actividad económica es Describir actividad económica, contando a la fecha con 00 empleados para ofrecer este servicio distribuidos en 0 turnos, los cuales son de 0:00 horas a 0:00 horas, (indicar todos los turnos) ; y por la otra parte, los representantes de los trabajadores con la finalidad de construir la Comisión de Seguridad e Higiene, que atienda las obligaciones al respecto, para patrones y trabajadores, que indica la Ley Federal del Trabajo y que emita las recomendaciones necesarias para garantizar la salud y seguridad para los trabajadores de este centro de trabajo."},{"p":"Los datos de la comisión son los siguientes:"},{"p":"I.- NOMBRE COMPLETO, Coordinador de esta Comisión, cuyas funciones serán las siguientes:"},{"li":"Presidir las reuniones de trabajo de la misma y vigilar su funcionamiento."},{"li":"Planear el programa Anual de Trabajo en esta materia."},{"li":"Elaborar, con el apoyo del Secretario, las actas de verificación de los recorridos y/o reuniones que se realicen y, en su caso, de análisis de accidentes de trabajo, mismas que serán validadas por ambos mediante su firma, y entregadas al patrón."},{"li":"Asesorar a los vocales y al personal en general sobre la verificación y detección de condiciones peligrosas presentes en el medio ambiente laboral."},{"li":"Solicitar previo análisis de la Comisión la sustitución de alguno de los integrantes."},{"li":"Participar en las inspecciones de seguridad e higiene que practique la Autoridad Laboral en el centro de trabajo."},{"p":"II.- NOMBRE COMPLETO, Secretario de esta Comisión, cuyas funciones serán las siguientes:"},{"li":"Convocar a los integrantes de esta Comisión para efectuar las verificaciones"},{"p":"programadas."},{"li":"Apoyar el desarrollo de las reuniones de trabajo de la Comisión, de acuerdo a lo que señale el Coordinador."},{"li":"Participar en las inspecciones de seguridad e higiene que practique la autoridad laboral en el centro de trabajo."},{"li":"Asesorar a los Vocales y al personal en general sobre la verificación y detección de condiciones peligrosas presentes en medio ambiente laboral."},{"li":"Conservar copia de las actas de verificación por doce meses para revisar el seguimiento de las propuestas de medidas para la prevención de accidentes y/o enfermedades de trabajo."},{"p":"III.- NOMBRE COMPLETO y NOMBRE COMPLETO, Vocales de esta Comisión, el primero e de seguridad y salud en el trabajo, para el establecimiento ubicado en calle Expansión número 350, VYNMSA Escobedo Industrial Park II, en el municipio de General Escobedo, Nuevo León, México, C.P. 66083."},{"p":"Atentamente,"},{"p":"____________________________"},{"h":"Nombre y Firma del Patrón / Representante."},{"h":"FIRMA DE ENTERADO"},{"p":"Responsable de SST"},{"p":"___________________________"},{"h":"Nombre y Firma"}]},{"c":"EHS-D-010","n":"Acta constitutiva de la Unidad Interna de Protección Civil","nk":"Ley General de Protección Civil","k":"Acta","o":"ACTA-UIPC-2026","p":"Acta de constitución de la Unidad Interna de Protección Civil: fundamento, integrantes, funciones de cada brigada y compromisos del establecimiento.","b":[{"h":"Acta constitutiva"},{"p":"En el municipio de General Escobedo, Nuevo León, se reúnen el representante legal, el responsable de seguridad y salud, los integrantes de la Unidad Interna de Protección Civil y el Director de Protección Civil del Estado, con el objeto de constituir formalmente la Unidad Interna del establecimiento."},{"h":"Antecedentes"},{"p":"Como consecuencia de los sismos de 1985, el Gobierno Federal estableció el Sistema Nacional de Protección Civil, que obliga a los centros de trabajo a integrar unidades internas capaces de actuar antes, durante y después de una emergencia."},{"h":"Integrantes y funciones"},{"p":"Jefe de la unidad: coordina la operación del plan y la toma de decisiones. Responsable del plan: mantiene actualizado el plan de emergencias y su documentación. Brigada de evacuación: dirige el desalojo por rutas y salidas definidas y verifica el punto de reunión. Brigada de primeros auxilios: atiende lesionados y coordina el traslado a servicios médicos. Brigada contra incendio: opera extintores y equipos de contención. Brigada de comunicación: notifica a autoridades, brigadas externas y familiares. Brigada de búsqueda y rescate: localiza y rescata personas atrapadas o lesionadas."},{"h":"Compromisos del establecimiento"},{"p":"Proporcionar capacitación anual a la unidad, equipo y materiales para su operación, señalización y rutas de evacuación en buen estado, y realizar simulacros conforme al programa anual, documentando resultados y acciones de mejora."},{"h":"Vigencia y firmas"},{"p":"El acta se firma por los integrantes de la unidad, el representante legal y la autoridad de protección civil que da fe de la constitución, y se revisa cada vez que cambie un integrante o el plan de emergencias."}]},{"c":"EHS-D-011","n":"Identificación de riesgos por fluidos conducidos en tuberías","nk":"NOM-026-STPS-2008","k":"Guía","o":"F-SH-026-00","p":"Elementos del código de identificación de tuberías, clasificación de fluidos peligrosos, colores de seguridad y dimensiones de bandas y letras.","b":[{"h":"Elementos de la identificación"},{"p":"El código de identificación para tuberías consta de color de seguridad, color contrastante, leyenda y dirección de flujo."},{"h":"Clasificación de fluidos"},{"p":"Un fluido es peligroso cuando así lo establecen sus hojas de datos de seguridad conforme a la NOM-018-STPS-2015, o cuando está sometido a condición extrema de temperatura (más de 50 °C, o baja temperatura que pueda causar lesión al contacto) o de presión (686 kPa o 7 kg/cm2 manométricos, o mayor). Los fluidos de bajo riesgo no son peligrosos por naturaleza y no rebasan esos límites."},{"h":"Aplicación del color de seguridad"},{"p":"Se pinta la tubería a todo lo largo cubriendo toda la circunferencia, o bien con bandas de identificación de 100 mm de ancho como mínimo que cubran toda la circunferencia, incrementándolas en proporción al diámetro exterior."},{"h":"Dimensiones"},{"p":"Para tuberías de hasta 300 mm de diámetro, la altura de las letras se calcula como h = d (π/6), donde d es el diámetro exterior de la tubería y su recubrimiento. Para diámetros mayores de 300 mm, la altura mínima de las letras es de 15 cm y la máxima el valor obtenido con la misma ecuación."},{"h":"Mantenimiento"},{"p":"La identificación se revisa y repinta cuando la tubería se modifica, cambia el fluido que conduce o la señal se deteriora, y se documenta en el programa de mantenimiento de las instalaciones."}]}];
/* =====================================================================
   DOCUMENTOS: programas, procedimientos, manuales, planes e instructivos
   Texto íntegro de los documentos de la carpeta de referencia (F-SH / D-SH).
   Bloques: {h:título} {p:párrafo} {li:viñeta} {t:[[celdas]]}
   ===================================================================== */
function vDocumentos(){
  const q=(window.__qd||'').trim().toLowerCase();
  const tipo=window.__docTipo||'';
  const list=DOCUMENTOS.filter(d=>{
    if(tipo&&d.k!==tipo) return false;
    if(!q) return true;
    return (d.n+' '+d.c+' '+d.nk+' '+d.k+' '+d.o).toLowerCase().includes(q);
  });
  const tipos=[...new Set(DOCUMENTOS.map(d=>d.k))];
  const chip=(val,label,on)=>`<span class="pill ${on?'ok':'mute'}" style="cursor:pointer" onclick="setDocTipo('${val}')">${label}</span>`;
  const grupos=[...new Set(list.map(d=>d.nk))];
  return `<div class="card pad" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="text" placeholder="Buscar documento por nombre, código o norma…" value="${esc(window.__qd||'')}" oninput="window.__qd=this.value;document.getElementById('view').innerHTML=vDocumentos()" style="max-width:420px">
      <span class="small muted">${list.length} documentos</span>
      <div style="white-space:nowrap">${chip('','Todos',!tipo)} ${tipos.map(t=>chip(t,t+'s',tipo===t)).join(' ')}</div>
    </div>`+
  (list.length?grupos.map(g=>`<div style="margin-bottom:18px">
      <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:8px"><h3 class="sec" style="margin:0">${esc(g)}</h3><span class="tag">${list.filter(d=>d.nk===g).length}</span></div>
      <div class="grid g3">${list.filter(d=>d.nk===g).map(d=>`<div class="card pad" style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:8px"><span class="mono" style="color:var(--accent);font-weight:700;font-size:12px">${esc(d.c)}</span><span class="tag">${esc(d.k)}</span></div>
        <div style="font-weight:600;font-size:13.5px;line-height:1.35">${esc(d.n)}</div>
        <div class="small muted" style="flex:1">${esc(d.p)}</div>
        <div class="small muted">Origen: ${esc(d.o)} · ${docPalabras(d)} palabras</div>
        <div style="display:flex;gap:6px;margin-top:4px"><button class="btn sm primary" onclick="verDocumento('${d.c}')">Leer</button><button class="btn sm" onclick="imprimirDocumento('${d.c}')">Imprimir / PDF</button></div>
      </div>`).join('')}</div></div>`).join(''):'<div class="empty">Sin resultados.</div>');
}
function setDocTipo(t){ window.__docTipo=t; document.getElementById('view').innerHTML=vDocumentos(); }
function docPalabras(d){ let n=0; d.b.forEach(b=>{ const t=b.h||b.p||b.li; if(t) n+=t.split(/\s+/).length; else if(b.t) b.t.forEach(r=>r.forEach(c=>n+=c.split(/\s+/).filter(Boolean).length)); }); return n.toLocaleString('es-MX'); }
function docCuerpoHTML(d){
  let html='',inUl=false;
  const cierra=()=>{ if(inUl){ html+='</ul>'; inUl=false; } };
  d.b.forEach(b=>{
    if(b.li!==undefined){ if(!inUl){ html+='<ul>'; inUl=true; } html+=`<li>${esc(b.li)}</li>`; return; }
    cierra();
    if(b.h!==undefined) html+=`<h2>${esc(b.h)}</h2>`;
    else if(b.p!==undefined) html+=`<p>${esc(b.p)}</p>`;
    else if(b.t){ html+=`<table class="tb"><tbody>${b.t.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
  });
  cierra(); return html;
}
function docHojaHTML(d){
  const co=colorEmp();
  return `<div class="pdoc pdoc-long" style="--co:${co};--co-txt:${textoColor(co)};--co-soft:${tinte(co,.12)}"><div class="sheet">
    <div class="hdr"><img src="${logoSrc()}" alt=""><div class="co"><div class="n">${esc(DB.org.nombre||'')}</div><div class="s">Seguridad y Salud en el Trabajo</div><div class="c">${esc(DB.org.centro||'')}</div></div><div class="rev"><b>${esc(d.c)}</b>Rev. 00</div></div>
    <div class="ctrl"><div><b>Código</b>${esc(d.c)}</div><div><b>Revisión</b>00</div><div><b>Fecha</b>${esc(fdate(hoy()))}</div><div><b>Referencia</b>${esc(d.o)}</div></div>
    <div class="title"><h1>${esc(d.n)}</h1><div class="n">${esc(d.nk)} · ${esc(d.k)}</div></div>
    <div class="dbody">${docCuerpoHTML(d)}</div>
    <div class="sig">${['Elaboró — Coordinación EHS','Revisó — Jefe de área','Autorizó — Gerencia'].map(x=>`<div class="sg"><span class="l"></span><div class="nm"></div><div>${esc(x)}</div></div>`).join('')}</div>
    <div class="foot"><span>Documento controlado · ${esc(d.c)} · Rev. 00</span><span>${esc(DB.org.resp||'')} · ${esc(DB.org.puesto||'')}</span></div>
  </div></div>`;
}
function verDocumento(c){
  const d=DOCUMENTOS.find(x=>x.c===c); if(!d) return;
  VIEW='documento'; renderNav();
  document.getElementById('pageTitle').textContent=d.c;
  document.getElementById('pageSub').textContent=d.n+' · '+d.nk;
  document.getElementById('topActions').innerHTML=`<button class="btn sm" onclick="go('documentos')">← Documentos</button> <button class="btn sm primary" onclick="imprimirDocumento('${d.c}')">Imprimir / PDF</button>`;
  document.getElementById('view').innerHTML=`<div class="sheet-wrap" style="max-height:none"><div class="sheet-zoom" style="zoom:.9">${docHojaHTML(d)}</div></div>`;
  window.scrollTo(0,0);
}
function imprimirDocumento(c){
  const d=DOCUMENTOS.find(x=>x.c===c); if(!d) return;
  document.getElementById('printRoot').innerHTML=docHojaHTML(d);
  window.print();
}

const PICTOS=[['corrosivo','Corrosivo'],['toxico','Tóxico'],['inflamable','Inflamable'],['oxidante','Oxidante'],
  ['irritante','Irritante'],['nocivo','Nocivo'],['presion','Gas a presión'],['salud','Peligro para la salud'],['ambiente','Peligroso para el ambiente']];
const RESID=['C','R','E','T','I'];
function etiqueta(){
  if(!DB.etiqueta) DB.etiqueta={tipo:'sustancia',nombre:'',cas:'',senal:'',h:'',p:'',fab:'',pictos:{},
    res:'',car:{},area:'',cant:'',fecha:'',control:'',empresa:''};
  return DB.etiqueta;
}
function setEt(k,v){ const e=etiqueta(); e[k]=v; save(); pintarEtiqueta(); }
function setEtCar(k){ const e=etiqueta(); e.car=e.car||{}; e.car[k]=!e.car[k]; save(); pintarEtiqueta(); }
function setEtPicto(k){ const e=etiqueta(); e.pictos=e.pictos||{}; e.pictos[k]=!e.pictos[k]; save(); pintarEtiqueta(); }
function vEtiquetas(){
  const e=etiqueta(), esSus=e.tipo!=='residuo';
  return `<div class="grid g2" style="align-items:start">
  <div class="card pad">
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="btn sm ${esSus?'primary':''}" onclick="setEt('tipo','sustancia')">Sustancia química</button>
      <button class="btn sm ${!esSus?'primary':''}" onclick="setEt('tipo','residuo')">Residuo peligroso</button>
    </div>
    ${esSus?`
      <label class="fld"><span>Nombre del químico</span><input type="text" value="${esc(e.nombre||'')}" oninput="setEt('nombre',this.value)"></label>
      <label class="fld"><span>CAS</span><input type="text" value="${esc(e.cas||'')}" oninput="setEt('cas',this.value)"></label>
      <label class="fld"><span>Palabra señal</span><input type="text" value="${esc(e.senal||'')}" oninput="setEt('senal',this.value)"></label>
      <label class="fld"><span>Códigos H (peligros)</span><textarea rows="2" oninput="setEt('h',this.value)">${esc(e.h||'')}</textarea></label>
      <label class="fld"><span>Códigos P (consejos de prudencia)</span><textarea rows="3" oninput="setEt('p',this.value)">${esc(e.p||'')}</textarea></label>
      <label class="fld"><span>Fabricante y dirección</span><textarea rows="2" oninput="setEt('fab',this.value)">${esc(e.fab||'')}</textarea></label>
      <div class="fld"><span>Pictogramas</span>
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px">
          ${PICTOS.map(([k,l])=>`<button class="btn sm" onclick="setEtPicto('${k}')" style="${(e.pictos||{})[k]?'background:var(--danger-bg);border-color:#fecaca;font-weight:600':''}">${(e.pictos||{})[k]?'☑':'☐'} ${esc(l)}</button>`).join('')}
        </div>
      </div>`:`
      <label class="fld"><span>Nombre del residuo peligroso</span><input type="text" value="${esc(e.res||'')}" oninput="setEt('res',this.value)"></label>
      <div class="fld"><span>Característica de peligrosidad</span>
        <div style="display:flex;gap:5px;margin-top:4px">
          ${RESID.map(c=>`<button class="btn sm" onclick="setEtCar('${c}')" style="${(e.car||{})[c]?'background:var(--danger-bg);border-color:#fecaca;font-weight:700':''}">${c}</button>`).join('')}
        </div>
      </div>
      <label class="fld"><span>Área de generación</span><input type="text" value="${esc(e.area||'')}" oninput="setEt('area',this.value)"></label>
      <label class="fld"><span>Cantidad (toneladas)</span><input type="text" value="${esc(e.cant||'')}" oninput="setEt('cant',this.value)"></label>
      <label class="fld"><span>Fecha de ingreso al almacén</span><input type="date" value="${esc(e.fecha||'')}" oninput="setEt('fecha',this.value)"></label>
      <label class="fld"><span>Número de control del contenedor</span><input type="text" value="${esc(e.control||'')}" oninput="setEt('control',this.value)"></label>
      <label class="fld"><span>Empresa</span><input type="text" value="${esc(e.empresa||'')}" oninput="setEt('empresa',this.value)"></label>`}
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn primary sm" onclick="imprimirEtiqueta(4)">Imprimir 4 etiquetas</button>
      <button class="btn sm" onclick="imprimirEtiqueta(1)">Imprimir 1</button>
    </div>
    <p class="small muted" style="margin:10px 0 0">Se imprimen en hoja carta, cuatro por hoja, para recortar.</p>
  </div>
  <div class="card pad"><h3 class="sec">Vista previa</h3><div id="etPrev">${etiquetaHTML()}</div></div>
  </div>`;
}
function pintarEtiqueta(){ const p=document.getElementById('etPrev'); if(p) p.innerHTML=etiquetaHTML(); }
function etiquetaHTML(){
  const e=etiqueta();
  if(e.tipo==='residuo'){
    return `<div class="lbl"><div class="lb-co">${esc(e.empresa||DB.org.nombre||'')}</div>
      <div class="lb-t">RESIDUO PELIGROSO</div>
      <div class="lb-n">${esc(e.res||'NOMBRE DEL RESIDUO PELIGROSO')}</div>
      <div class="lb-car">${RESID.map(c=>`<span class="${(e.car||{})[c]?'on':''}">${c}</span>`).join('')}</div>
      <table class="lb-f"><tr><td>Área de generación:</td><td>${esc(e.area||'')}</td></tr>
        <tr><td>Cantidad:</td><td>${esc(e.cant||'')} toneladas</td></tr>
        <tr><td>Fecha de ingreso al almacén:</td><td>${esc(fdate(e.fecha)||'')}</td></tr>
        <tr><td>No. de control del contenedor:</td><td>${esc(e.control||'')}</td></tr></table></div>`;
  }
  const on=PICTOS.filter(([k])=>(e.pictos||{})[k]).map(([,l])=>l);
  return `<div class="lbl"><div class="lb-t">SUSTANCIA QUÍMICA PELIGROSA</div>
    <div class="lb-n">${esc(e.nombre||'NOMBRE DEL QUÍMICO')}</div>
    <div class="lb-cas">CAS: ${esc(e.cas||'')} · ${esc(e.senal||'')}</div>
    ${on.length?`<div class="lb-pic">${on.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
    ${e.h?`<div class="lb-h"><b>H:</b> ${esc(e.h)}</div>`:''}
    ${e.p?`<div class="lb-h"><b>P:</b> ${esc(e.p)}</div>`:''}
    <div class="lb-fab">${esc(e.fab||'')}</div></div>`;
}
function imprimirEtiqueta(n){
  const uno=etiquetaHTML();
  const hojas=Math.ceil(n/4);
  let html='';
  for(let i=0;i<hojas;i++) html+=`<div class="lbl-sheet">${Array.from({length:4},()=>uno).join('')}</div>`;
  document.getElementById('printRoot').innerHTML=html; window.print();
}

function rgbDe(hex){ const h=hex.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function tinte(hex,a){ const [r,g,b]=rgbDe(hex); const m=v=>Math.round(255-(255-v)*a); return `rgb(${m(r)},${m(g)},${m(b)})`; }
function textoColor(hex){ const [r,g,b]=rgbDe(hex); return (0.2126*r+0.7152*g+0.0722*b)>150?'#111':'#fff'; }

function authMsg(d){
  const m=(d&&(d.error_description||d.msg||d.message||d.error))||'';
  if(/invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/email not confirmed/i.test(m)) return 'El correo no está confirmado.';
  if(/rate limit|too many/i.test(m)) return 'Demasiados intentos. Espera un momento.';
  return m||'No se pudo iniciar sesión.';
}
async function authLogin(email,password){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(authMsg(d));
  SESSION={access_token:d.access_token,refresh_token:d.refresh_token,
    expires_at:Date.now()+((d.expires_in||3600)-60)*1000,
    email:(d.user&&d.user.email)||email,uid:d.user&&d.user.id};
  saveSession(SESSION); return SESSION;
}
async function authRefresh(){
  if(!SESSION||!SESSION.refresh_token) throw new Error('Sin sesión');
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:SESSION.refresh_token})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(authMsg(d));
  SESSION=Object.assign({},SESSION,{access_token:d.access_token,refresh_token:d.refresh_token,
    expires_at:Date.now()+((d.expires_in||3600)-60)*1000,
    uid:(d.user&&d.user.id)||SESSION.uid,email:(d.user&&d.user.email)||SESSION.email});
  saveSession(SESSION); return SESSION;
}
function authLogout(){ SESSION=null; saveSession(null); location.reload(); }
async function sb(path,opts){
  opts=opts||{};
  if(!SESSION) throw new Error('Sin sesión');
  if(SESSION.expires_at&&Date.now()>SESSION.expires_at){ try{ await authRefresh(); }catch(e){} }
  const call=()=>fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opts,{
    headers:Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.access_token,'Content-Type':'application/json'},opts.headers||{})}));
  let r=await call();
  if(r.status===401){ await authRefresh(); r=await call(); }
  const txt=await r.text();
  if(!r.ok) throw new Error('supabase '+r.status+': '+txt.slice(0,180));
  return txt?JSON.parse(txt):null;
}
async function sbRpc(fn,body){
  if(!SESSION) throw new Error('Sin sesión');
  if(SESSION.expires_at&&Date.now()>SESSION.expires_at){ try{ await authRefresh(); }catch(e){} }
  const call=()=>fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SESSION.access_token,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  let r=await call();
  if(r.status===401){ await authRefresh(); r=await call(); }
  const txt=await r.text();
  if(!r.ok){
    let msg=txt, code=null;
    try{ const j=JSON.parse(txt); msg=j.message||j.hint||txt; code=j.code||null; }catch(e){}
    const err=new Error(msg); err.code=code; throw err;
  }
  return txt?JSON.parse(txt):null;
}

function subirLogo(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=320; let w=img.width,h=img.height;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      DB.org.logo=cv.toDataURL('image/png');

      document.getElementById('view').innerHTML=vDatos();
      toast('Logo actualizado');

    img.onerror=()=>toast('No se pudo leer la imagen');
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

function genHallazgos(id){
  const d=doc_(id); const f=FORMATOS.find(x=>x.c===d.c);
  let n=0;
  (f.sec||[]).forEach((s,si)=>s.it.forEach((t,ii)=>{
    const k=`s${si}i${ii}`; if(d.it[k]!=='NC') return;
    if(DB.hallazgos.some(h=>h.docId===id&&h.item===k)) return;
    DB.hallazgos.push({id:uid(),folio:'H-'+String(DB.hallazgos.length+1).padStart(3,'0'),desc:t,detalle:(d.ob||{})[k]||'',norma:d.nk,origen:`${d.c} · ${d.n}`,area:(d.f||{}).area||'',resp:'',fecha:hoy(),fechaComp:'',prioridad:'Media',estado:'Abierto',docId:id,item:k});
    n++;
  }));
  save(); toast(n?`${n} hallazgo(s) generado(s)`:'No hay nuevos hallazgos por generar'); renderNav();
}

function imprimir(id){
  const d=doc_(id); if(!d) return;
  const f=FORMATOS.find(x=>x.c===d.c)||{};

}

<script>
/* ============================ MODAL ============================ */
function modal(title,body,footer){
  document.getElementById('modalHost').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)cerrarModal()">
    <div class="modal"><div class="mh"><h3>${title}</h3><div style="margin-left:auto"><button class="btn sm ghost" onclick="cerrarModal()">✕</button></div></div>
    <div class="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:''}</div></div>`;
}
function cerrarModal(){ document.getElementById('modalHost').innerHTML=''; }

/* ============================ REGISTROS ============================ */
function vRegistros(){
  const q=(window.__rq||'').toLowerCase();
  let list=DB.docs.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  if(q) list=list.filter(d=>(d.n+d.c+d.nk+((d.f||{}).area||'')).toLowerCase().includes(q));
  const abiertos=list.filter(d=>d.estado==='Abierto').length;
  return `<div class="card pad" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="text" placeholder="Buscar registro…" value="${esc(window.__rq||'')}" oninput="window.__rq=this.value;document.getElementById('view').innerHTML=vRegistros()" style="max-width:360px">
      <span class="tag">${list.length} registros · ${abiertos} abiertos</span>
      <div style="margin-left:auto"><button class="btn sm primary" onclick="go('formatos')">+ Nuevo</button></div>
    </div>
    <div class="card" style="overflow:hidden">
    ${list.length?`<table><thead><tr><th>Código</th><th>Formato</th><th>Norma</th><th>Fecha</th><th>Área</th><th>NC</th><th>Estado</th><th></th></tr></thead><tbody>
      ${list.map(d=>{const nc=Object.values(d.it||{}).filter(v=>v==='NC').length;
        return `<tr>
          <td class="mono" style="font-weight:600">${esc(d.c)}</td>
          <td>${esc(d.n)}</td>
          <td class="small muted">${esc(d.nk)}</td>
          <td class="small">${fdate(d.fecha)}</td>
          <td class="small">${esc((d.f||{}).area||'—')}</td>
          <td class="num">${nc?`<span class="pill danger">${nc}</span>`:'—'}</td>
          <td><span class="pill ${d.estado==='Cerrado'?'ok':'info'}">${esc(d.estado)}</span></td>
          <td style="white-space:nowrap;text-align:right">
            <button class="btn sm" onclick="abrirDoc('${d.id}')">Abrir</button>
            <button class="btn sm ghost" onclick="imprimir('${d.id}')" title="Imprimir">⎙</button>
          </td></tr>`}).join('')}
    </tbody></table>`:`<div class="empty"><div class="big">▤</div>Aún no hay registros.<br><button class="btn sm primary" style="margin-top:10px" onclick="go('formatos')">Ir a formatos</button></div>`}
    </div>`;
}

/* ============================ HALLAZGOS ============================ */
function vHallazgos(){
  const list=DB.hallazgos.slice().sort((a,b)=>(a.estado==='Cerrado')-(b.estado==='Cerrado')||(b.fecha||'').localeCompare(a.fecha||''));
  const ab=list.filter(h=>h.estado!=='Cerrado');
  return `<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><div class="lbl">Total</div><div class="val">${DB.hallazgos.length}</div></div>
    <div class="card kpi warn"><div class="lbl">Abiertos</div><div class="val">${ab.length}</div></div>
    <div class="card kpi danger"><div class="lbl">Vencidos</div><div class="val">${ab.filter(h=>h.fechaComp&&h.fechaComp<hoy()).length}</div></div>
    <div class="card kpi ok"><div class="lbl">Cerrados</div><div class="val">${DB.hallazgos.filter(h=>h.estado==='Cerrado').length}</div></div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm primary" onclick="editHallazgo()">+ Nuevo hallazgo</button></div>
  <div class="card" style="overflow:hidden">
  ${list.length?`<table><thead><tr><th>Folio</th><th>Hallazgo</th><th>Norma</th><th>Área</th><th>Responsable</th><th>Compromiso</th><th>Prioridad</th><th>Estado</th><th></th></tr></thead><tbody>
    ${list.map(h=>{const venc=h.estado!=='Cerrado'&&h.fechaComp&&h.fechaComp<hoy();
      return `<tr>
        <td class="mono small">${esc(h.folio||'')}</td>
        <td><div style="font-weight:550">${esc(h.desc)}</div>${h.detalle?`<div class="small muted">${esc(h.detalle)}</div>`:''}${h.origen?`<div class="small muted" style="font-size:11px">Origen: ${esc(h.origen)}</div>`:''}</td>
        <td class="small muted">${esc(h.norma||'—')}</td>
        <td class="small">${esc(h.area||'—')}</td>
        <td class="small">${esc(h.resp||'—')}</td>
        <td class="small ${venc?'':''}">${h.fechaComp?`<span class="pill ${venc?'danger':'mute'}">${fdate(h.fechaComp)}</span>`:'—'}</td>
        <td><span class="pill ${h.prioridad==='Alta'?'danger':h.prioridad==='Media'?'warn':'mute'}">${esc(h.prioridad||'Media')}</span></td>
        <td><select onchange="setHallEstado('${h.id}',this.value)" style="width:auto;font-size:12px;padding:3px 6px">
          ${['Abierto','En proceso','Cerrado'].map(s=>`<option ${h.estado===s?'selected':''}>${s}</option>`).join('')}</select></td>
        <td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" onclick="editHallazgo('${h.id}')">Editar</button><button class="btn sm ghost" onclick="delHall('${h.id}')">✕</button></td>
      </tr>`}).join('')}
  </tbody></table>`:`<div class="empty"><div class="big">⚑</div>Sin hallazgos registrados.<br><span class="small">Se generan automáticamente al marcar NC en una lista de verificación.</span></div>`}
  </div>`;
}
function setHallEstado(id,v){ const h=DB.hallazgos.find(x=>x.id===id); h.estado=v; if(v==='Cerrado') h.fechaCierre=hoy(); save(); renderNav(); }
function delHall(id){ if(!confirm('¿Eliminar hallazgo?'))return; DB.hallazgos=DB.hallazgos.filter(h=>h.id!==id); save(); go('hallazgos'); }
function editHallazgo(id){
  const h=id?DB.hallazgos.find(x=>x.id===id):{prioridad:'Media',estado:'Abierto',fecha:hoy()};
  modal(id?'Editar hallazgo':'Nuevo hallazgo',`
    <label class="fld"><span>Descripción del hallazgo</span><input type="text" id="h_desc" value="${esc(h.desc||'')}"></label>
    <label class="fld"><span>Detalle / condición encontrada</span><textarea id="h_det" rows="2">${esc(h.detalle||'')}</textarea></label>
    <div class="row">
      <label class="fld"><span>Norma</span><select id="h_norma">${NORMAS.map(n=>`<option ${h.norma===n.k?'selected':''}>${esc(n.k)}</option>`).join('')}</select></label>
      <label class="fld"><span>Área</span><input type="text" id="h_area" value="${esc(h.area||'')}"></label>
    </div>
    <div class="row">
      <label class="fld"><span>Responsable</span><input type="text" id="h_resp" value="${esc(h.resp||'')}"></label>
      <label class="fld" style="max-width:170px"><span>Fecha compromiso</span><input type="date" id="h_comp" value="${esc(h.fechaComp||'')}"></label>
      <label class="fld" style="max-width:150px"><span>Prioridad</span><select id="h_pri">${['Alta','Media','Baja'].map(p=>`<option ${h.prioridad===p?'selected':''}>${p}</option>`).join('')}</select></label>
    </div>`,
    `<button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn primary" onclick="guardarHall('${id||''}')">Guardar</button>`);
}
function guardarHall(id){
  const g=k=>document.getElementById(k).value;
  const obj={desc:g('h_desc'),detalle:g('h_det'),norma:g('h_norma'),area:g('h_area'),resp:g('h_resp'),fechaComp:g('h_comp'),prioridad:g('h_pri')};
  if(!obj.desc){ toast('Escribe la descripción'); return; }
  if(id){ Object.assign(DB.hallazgos.find(x=>x.id===id),obj); }
  else { DB.hallazgos.push(Object.assign({id:uid(),folio:'H-'+String(DB.hallazgos.length+1).padStart(3,'0'),fecha:hoy(),estado:'Abierto'},obj)); }
  save(); cerrarModal(); go('hallazgos');
}

  const ult=list.length?list.map(i=>i.fecha).sort().pop():null;
  const sinAcc=ult?Math.max(0,Math.round((new Date()-new Date(ult+'T12:00:00'))/864e5)):'—';

      <label class="fld" style="max-width:150px"><span>Estado</span><select id="i_est">${['Abierta','En investigación','Cerrada'].map(t=>`<option ${i.estado===t?'selected':''}>${t}</option>`).join('')}</select></label>

    <ol class="small" style="color:var(--ink-2);line-height:1.7;margin:0;padding-left:18px">
      <li>En <b>Marco normativo</b>, marca las normas que aplican a tu centro de trabajo.</li>
      <li>En <b>Formatos</b>, abre el formato que necesitas y llénalo en campo o en oficina.</li>
      <li>Al marcar <b>NC</b> en una lista de verificación, describe la condición y genera hallazgos con un clic.</li>
      <li>Da seguimiento a los hallazgos con responsable y fecha compromiso hasta cerrarlos.</li>
      <li>Imprime o guarda en PDF desde cualquier registro: el formato sale en hoja carta con firmas.</li>
    </ol>
  </div>`;
}
function setOrg(k,v){ DB.org[k]=v; save(); guardarEmpresa(); const fo=document.getElementById('footOrg'); if(fo) fo.textContent=DB.org.centro||'—'; }
function exportar(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`ehs-control-respaldo-${hoy()}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast('Respaldo descargado');
}
function exportarCSV(){
  const rows = [];
  // Header row
  rows.push(['Fecha', 'Tipo', 'Norma', 'Área', 'Responsable', 'Descripción', 'Estatus']);
  // Docs
  DB.docs.forEach(d => {
    rows.push([
      d.fecha || '',
      'Documento',
      d.nk || '',
      d.area || '',
      d.resp || '',
      d.desc || '',
      d.estado || ''
    ]);
  });
  // Hallazgos
  DB.hallazgos.forEach(h => {
    rows.push([
      h.fecha || '',
      'Hallazgo',
      h.norma || '',
      h.area || '',
      h.resp || '',
      h.descripcion || '',
      h.estado || ''
    ]);
  });
  // Incidentes
  DB.incidentes.forEach(i => {
    rows.push([
      i.fecha || '',
      'Incidente',
      i.tipo || '',
      i.area || '',
      i.resp || '',
      i.desc || '',
      i.estado || ''
    ]);
  });
  const csvString = rows.map(r => r.map(v => `"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csvString], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ehs-control-datos-${hoy()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV descargado');
}
function importar(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.org||!d.docs) throw 0;
      DB=Object.assign({},DEFAULTS,d); save(); toast('Respaldo cargado'); go('panel'); }
    catch(e){ toast('Archivo no válido'); } };
  r.readAsText(f);
}
function resetAll(){ if(!confirm('Se borrarán todos los registros de la organización. ¿Continuar?'))return;
  DB=JSON.parse(JSON.stringify(DEFAULTS)); saveLocal(); save(); go('panel'); toast('Datos borrados'); }

/* ============================ INIT ============================ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrarModal(); });
window.EHS={get db(){return DB},set db(v){DB=v},save,get version(){return CENTRO_VERSION},get centro(){return CENTRO_ID},get user(){return SESSION&&SESSION.email}};

/* ============================ TEMA ============================ */
function aplicarTema(dark){
  if(dark) document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  const ic=document.getElementById('themeIcon'); if(ic) ic.textContent=dark?'☀️':'🌓';
}
function toggleTheme(){
  const dark=document.documentElement.getAttribute('data-theme')!=='dark';
  aplicarTema(dark);
  try{ localStorage.setItem('ehs.theme',dark?'dark':'light'); }catch(e){}
}
try{ if(localStorage.getItem('ehs.theme')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}

boot();
