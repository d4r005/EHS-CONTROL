<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EHS Control · Sistema de Gestión EHS</title>
<style>
:root{
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --line:#e2e8f0;
  --bg:#f5f6f8; --card:#ffffff; --accent:#0f766e; --accent-2:#14b8a6;
  --warn:#b45309; --warn-bg:#fef3c7; --danger:#b91c1c; --danger-bg:#fee2e2;
  --ok:#15803d; --ok-bg:#dcfce7; --info:#1d4ed8; --info-bg:#dbeafe;
  --nav:#0e1726; --nav-2:#1a2739;
  --r:10px; --sh:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
  /* Paleta mejorada para formatos */
  --form-ok:#15803d; --form-ok-bg:#dcfce7;
  --form-nc:#b45309; --form-nc-bg:#fef3c7;
  --form-na:#64748b; --form-na-bg:#f1f5f9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:236px;flex:0 0 236px;background:var(--nav);color:#cbd5e1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{display:flex;align-items:center;gap:9px}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent-2),var(--accent));
  display:grid;place-items:center;color:#062a26;font-weight:800;font-size:13px;letter-spacing:-.5px
}
.brand h1{font-size:14.5px;margin:0;color:#fff;font-weight:650;letter-spacing:-.2px}
.brand small{display:block;color:#7b8ba3;font-size:11px;margin-top:2px}
.nav{padding:10px 8px;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#5d6d84;padding:12px 10px 6px;font-weight:700}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:#c3cfdd;
  padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.2px;margin-bottom:1px
}
.nav button:hover{background:var(--nav-2);color:#fff}
.nav button.on{background:rgba(20,184,166,.14);color:#fff;box-shadow:inset 2px 0 0 var(--accent-2)}
.nav .ico{width:16px;text-align:center;opacity:.85;font-size:13px}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.1);color:#dbe6f0;font-size:10.5px;padding:1px 6px;border-radius:20px;font-weight:600}
.nav .badge.alert{background:rgba(185,28,28,.3);color:#fecaca}
.side .foot{padding:10px 16px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#66788f}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20
}
.top h2{font-size:16px;margin:0;font-weight:650;letter-spacing:-.2px}
.top .sub{color:var(--muted);font-size:12.5px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:22px 24px 60px;max-width:1320px;width:100%}

/* ---------- atoms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}.side{display:none}.content{padding:16px}}

h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700}
.kpi{padding:15px 16px}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.8px;margin:5px 0 1px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.warn .val{color:var(--warn)} .kpi.danger .val{color:var(--danger)} .kpi.ok .val{color:var(--ok)}

.btn{
  display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  color:var(--ink-2);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550;font-size:13px;
  transition:.12s
}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0d6b63}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:var(--danger-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:#f1f5f9;color:var(--muted)}
.subhead{background:#fbfcfd}
.nc-in{border-color:#fecaca;background:#fff7f7}

table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:#fbfcfd;white-space:nowrap
}
td{padding:9px 10px;border-bottom:1px solid #eef2f6;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
td.num{font-variant-numeric:tabular-nums;text-align:right}

input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
  outline:none;transition:.12s
}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(20,184,166,.14)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}

.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:26px;opacity:.35;margin-bottom:6px}
.hr{height:1px;background:var(--line);margin:16px 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tag{font-size:11px;background:#f1f5f9;color:var(--ink-2);padding:1px 6px;border-radius:5px;font-weight:600;white-space:nowrap}

.bar{height:7px;background:#eef2f6;border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:20px}

.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(15,23,42,.3)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:15px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fbfcfd;border-radius:0 0 14px 14px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:9px;font-size:13px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* ---------- documento imprimible ---------- */
#printRoot{display:none}
.pdoc{font-family:Arial,Helvetica,"Segoe UI",sans-serif;font-size:9pt;color:#111;background:#fff;line-height:1.35}
.pdoc *{box-sizing:border-box}
.pdoc .hdr{display:flex;align-items:center;gap:14px;padding-bottom:7px;border-bottom:2.5px solid var(--co,#111)}
.pdoc .hdr img{height:42px;width:auto;flex:0 0 auto}
.pdoc .hdr .co{flex:1;text-align:center;min-width:0}
.pdoc .hdr .co .n{font-size:12pt;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.15}
.pdoc .hdr .co .s{font-size:8.5pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#333;margin-top:3px}
.pdoc .hdr .co .c{font-size:8pt;color:#444;margin-top:2px}
.pdoc .hdr .rev{flex:0 0 auto;border:1.5px solid #111;padding:4px 9px;text-align:center;font-size:7pt;text-transform:uppercase;letter-spacing:.05em}
.pdoc .hdr .rev b{display:block;font-size:10pt;letter-spacing:.03em;margin-bottom:1px}
.pdoc .ctrl{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #111;border-top:0}
.pdoc .ctrl div{padding:3px 7px;border-right:1px solid #111;font-size:8pt}
.pdoc .ctrl div:last-child{border-right:0}
.pdoc .ctrl b{display:block;font-size:6.5pt;text-transform:uppercase;letter-spacing:.08em;color:#555;font-weight:700}
.pdoc .title{background:var(--co,#ECB324);color:var(--co-txt,#111);border:1px solid #111;border-top:0;padding:6px 10px;text-align:center}
.pdoc .title h1{font-size:11pt;margin:0;text-transform:uppercase;letter-spacing:.02em;font-weight:800}
.pdoc .title .n{font-size:7.5pt;font-weight:700;letter-spacing:.05em;margin-top:2px}
.pdoc table.meta{width:100%;border-collapse:collapse;font-size:8.5pt}
.pdoc table.meta td{border:1px solid #111;padding:4px 7px;height:26px;vertical-align:top}
.pdoc table.meta td b{display:block;font-size:6.5pt;text-transform:uppercase;letter-spacing:.08em;color:#555;font-weight:700}
.pdoc h2{font-size:8.5pt;margin:12px 0 0;padding:3px 8px;background:#F2F2F2;border:1px solid #111;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.pdoc table.chk{width:100%;border-collapse:collapse;font-size:8pt}
.pdoc table.chk th{border:1px solid #111;padding:3px 4px;background:var(--co-soft,#FDF0CE);font-size:7pt;text-transform:uppercase;letter-spacing:.03em;font-weight:700;text-align:center}
.pdoc table.chk td{border:1px solid #111;padding:3px 5px;vertical-align:top}
.pdoc table.chk td.c{text-align:center;font-weight:700}
.pdoc table.chk tbody tr:nth-child(even) td{background:#FAFAFA}
.pdoc table.tb{width:100%;border-collapse:collapse;font-size:8pt;margin-top:10px}
.pdoc table.tb th{border:1px solid #111;padding:4px;background:var(--co-soft,#FDF0CE);font-size:7.5pt;text-transform:uppercase;letter-spacing:.03em;font-weight:700;text-align:center}
.pdoc table.tb td{border:1px solid #111;padding:3px 5px;height:20px;vertical-align:top}
.pdoc table.prg td.c{text-align:center;font-weight:700;width:5.2%}
.pdoc table.prg td.grp{background:#F2F2F2;font-weight:700;text-transform:uppercase;font-size:7.5pt;letter-spacing:.04em}
/* @@CSS-DOC-INICIO@@ */
.pdoc .dbody{margin-top:10px;font-size:9pt;line-height:1.5}
.pdoc .dbody h2{margin:14px 0 4px;break-after:avoid}
.pdoc .dbody p{margin:0 0 6px;text-align:justify}
.pdoc .dbody ul{margin:2px 0 8px 18px;padding:0}
.pdoc .dbody li{margin:0 0 2px}
.pdoc .dbody table.tb th,.pdoc .dbody table.tb td{height:auto}
.pdoc-long .sig{break-inside:avoid}
/* @@CSS-DOC-FIN@@ */
/* @@TIPOSCSS-INICIO@@ */
.bcard{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.bcard b{display:block;font-size:12.5px;line-height:1.25}
.bcard span{display:block;font-size:11px;color:var(--muted,#667085);margin-top:2px}
.bcard.top{border:2px solid var(--accent,#ECB324);min-width:230px;padding:11px 14px}
.pdoc .bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px}
.pdoc .bcard{border:1px solid #111;border-radius:4px;padding:6px 5px;background:#fff;text-align:center}
.pdoc .bcard b{font-size:7.6pt;line-height:1.2}
.pdoc .bcard span{font-size:6.6pt;color:#333;margin-top:1px}
.pdoc .bcard.top{border:2px solid #111;min-width:180px}
.lbl{border:2px solid #111;border-radius:4px;padding:8px 10px;background:#fff;font-size:11px;line-height:1.3}
.lbl .lb-co{font-size:9px;text-align:right;color:#444}
.lbl .lb-t{font-size:11px;font-weight:800;letter-spacing:.4px;text-align:center;margin:2px 0 5px}
.lbl .lb-n{font-size:13px;font-weight:700;text-align:center;border-bottom:1px solid #111;padding-bottom:4px;margin-bottom:5px}
.lbl .lb-cas{font-size:10px;text-align:center;margin-bottom:5px}
.lbl .lb-pic{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-bottom:5px}
.lbl .lb-pic span{border:1px solid #111;border-radius:3px;padding:1px 4px;font-size:8.5px}
.lbl .lb-h{font-size:9px;margin-bottom:3px}
.lbl .lb-fab{font-size:8.5px;color:#333;margin-top:4px;border-top:1px solid #ccc;padding-top:3px}
.lbl .lb-car{display:flex;gap:4px;justify-content:center;margin-bottom:5px}
.lbl .lb-car span{width:20px;height:20px;border:1px solid #111;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#bbb}
.lbl .lb-car span.on{background:#111;color:#fff}
.lbl table.lb-f{width:100%;font-size:9px;border-collapse:collapse}
.lbl table.lb-f td{padding:1px 2px;border-bottom:1px dotted #bbb}
.lbl-sheet{display:grid;grid-template-columns:1fr 1fr;gap:6mm;page-break-after:always;padding:6mm}
.lbl-sheet .lbl{min-height:62mm}
.pdoc table.sel{width:100%;border-collapse:collapse;font-size:7.8pt;margin-top:2px}
.pdoc table.sel td{border:1px solid #111;padding:2px 5px}
.pdoc table.sel td.bx{width:16px;text-align:center;font-weight:700}
/* @@TIPOSCSS-FIN@@ */
.pdoc .txt{font-size:8.5pt;white-space:pre-wrap;border:1px solid #111;padding:6px;min-height:40px}
.pdoc .blank{border:1px solid #111}
.pdoc .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
.pdoc .sig .sg{text-align:center;font-size:7.5pt}
.pdoc .sig .sg .l{display:block;border-top:1px solid #111}
.pdoc .sig .sg .nm{height:32px}
.pdoc .foot{margin-top:14px;padding-top:5px;border-top:1px solid #111;font-size:6.8pt;color:#444;display:flex;justify-content:space-between;gap:10px}
.pdoc .note{font-size:7.5pt;color:#333;margin-top:6px}
.pdoc .avoid{break-inside:avoid}
.sheet-wrap{background:#e9edf2;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:58vh;overflow:auto}
.sheet-zoom{zoom:.62;background:#fff;padding:10mm 9mm;box-shadow:0 4px 16px rgba(15,23,42,.18)}
html[data-theme="dark"] .sheet-wrap{background:#0d1521}
@media print{
  @page{size:letter portrait;margin:12mm 11mm}
  body{background:#fff}
  .app,.toast,.modal-wrap,.login{display:none !important}
  #printRoot{display:block}
  tr{break-inside:avoid}
}

/* ---------- login ---------- */
.login{position:fixed;inset:0;background:linear-gradient(160deg,#0e1726,#12263a 55%,#0f3b36);display:grid;place-items:center;padding:24px;z-index:100}
.login[hidden]{display:none}
.lcard{width:100%;max-width:382px;background:#fff;border-radius:14px;padding:26px 24px;box-shadow:0 20px 50px rgba(2,8,20,.45)}
.lbrand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.lbrand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#062a26;font-weight:800;font-size:14px}
.lbrand h1{font-size:15px;margin:0;letter-spacing:-.2px}
.lbrand small{display:block;color:var(--muted);font-size:11px}
.lcard h2{font-size:18px;margin:0 0 4px;letter-spacing:-.3px}
.lhint{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.lcard label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:12px}
.lcard input{width:100%;margin-top:5px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.lcard input:focus{outline:2px solid rgba(20,184,166,.35);border-color:var(--accent-2)}
.lerr{color:var(--danger);font-size:12.5px;min-height:17px;margin-bottom:8px}
.lfoot{margin-top:16px;text-align:center;font-size:11px;color:var(--muted)}
.lcard .btn{width:100%;justify-content:center;padding:10px}
.userbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex:0 0 auto}
.sync{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.ok{background:var(--ok-bg);border-color:#bbf7d0;color:var(--ok)}
.sync.busy{background:var(--info-bg);border-color:#bfdbfe;color:var(--info)}
.sync.err{background:var(--danger-bg);border-color:#fecaca;color:var(--danger)}
.ubtn{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;color:var(--ink-2);cursor:pointer}
.ubtn:hover{background:var(--bg)}
@media(max-width:820px){.userbox .uemail{display:none}}

/* ---------- modo oscuro ---------- */
html[data-theme="dark"]{
  --ink:#e8eef6; --ink-2:#c8d5e3; --muted:#9aa9bb; --line:#33445a;
  --bg:#0b1220; --card:#16202e; --nav:#0a111c; --nav-2:#16202e;
  --warn:#fbbf24; --warn-bg:#3a2a08; --danger:#fca5a5; --danger-bg:#3b1414;
  --ok:#6ee7b7; --ok-bg:#0f3d2e; --info:#93c5fd; --info-bg:#12283f;
  color-scheme:dark;
}
html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] .top{background:var(--card);border-bottom-color:var(--line)}
html[data-theme="dark"] .card,html[data-theme="dark"] .lcard{background:var(--card);border-color:var(--line)}
html[data-theme="dark"] .subhead{background:#1b2836}
html[data-theme="dark"] .top h2,html[data-theme="dark"] .kpi .val{color:var(--ink)}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{
  background:#0f1a27;color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:#7b8ba3}
html[data-theme="dark"] .nc-in{border-color:#7f1d1d;background:#2a1212}

/* botones */
html[data-theme="dark"] .btn{background:#243449;border-color:#3d5068;color:#e8eef6}
html[data-theme="dark"] .btn:hover{background:#2e425c;border-color:#4a5f7a}
html[data-theme="dark"] .btn.primary{background:#14b8a6;border-color:#14b8a6;color:#062a26}
html[data-theme="dark"] .btn.primary:hover{background:#2dd4bf;border-color:#2dd4bf}
html[data-theme="dark"] .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
html[data-theme="dark"] .btn.danger{background:#2a1212;border-color:#7f1d1d;color:#fca5a5}
html[data-theme="dark"] .btn.danger:hover{background:#3b1414}

/* etiquetas y chips */
html[data-theme="dark"] .tag{background:#243449;color:#dbe6f0}
html[data-theme="dark"] .pill.mute{background:#243449;color:#c8d5e3}
html[data-theme="dark"] .pill.ok{background:#0f3d2e;color:#6ee7b7}
html[data-theme="dark"] .pill.warn{background:#3a2a08;color:#fbbf24}
html[data-theme="dark"] .pill.danger{background:#3b1414;color:#fca5a5}
html[data-theme="dark"] .pill.info{background:#12283f;color:#93c5fd}
html[data-theme="dark"] .bar{background:#243449}
html[data-theme="dark"] .mono{color:#7dd3c0}

/* tablas */
html[data-theme="dark"] table th{background:#1b2836;color:var(--ink)}
html[data-theme="dark"] tbody tr:hover{background:#1b2836}
html[data-theme="dark"] tr:nth-child(even) td{background:#131e2b}

/* modal, avisos y login */
html[data-theme="dark"] .modal{background:#16202e;color:var(--ink)}
html[data-theme="dark"] .modal .mf{background:#131e2b}
html[data-theme="dark"] .toast{background:#e8eef6;color:#0b1220;font-weight:600}
html[data-theme="dark"] .login{background:linear-gradient(160deg,#080e18,#0d1b2a 55%,#0a2b27)}
html[data-theme="dark"] .lcard input{background:#0f1a27;color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .lfoot,html[data-theme="dark"] .lhint{color:var(--muted)}
html[data-theme="dark"] .lerr{color:#fca5a5}

/* ---------- marca y selector de empresa ---------- */
.brand{padding:14px 14px 12px}
.brandimg{display:block;width:100%;max-width:200px;height:auto;margin:0 auto 10px}
.emp{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:8px;padding:5px 6px}
.emplogo{height:20px;width:auto;max-width:54px;object-fit:contain;background:#fff;border-radius:4px;padding:1px 2px;flex:0 0 auto}
.emp select{flex:1;min-width:0;background:transparent;border:0;color:#dbe6f0;font-size:11.5px;font-weight:600;padding:2px;cursor:pointer}
.emp select option{color:#0f172a}
.empadd{background:rgba(20,184,166,.2);border:0;color:#7dd3c0;font-weight:800;border-radius:6px;width:20px;height:20px;line-height:1;cursor:pointer;flex:0 0 auto}
.empadd:hover{background:rgba(20,184,166,.38)}
.logobox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:120px;min-height:56px;display:grid;place-items:center}
.logobox img{max-height:44px;max-width:150px;object-fit:contain}
html[data-theme="dark"] .logobox{background:#f8fafc}
</style>

<div class="login" id="loginScreen">
  <form class="lcard" id="loginForm" novalidate>
    <div class="lbrand">
      <img id="loginLogo" alt="EHS Control" style="height:54px;width:auto">
    </div>
    <h2>Iniciar sesión</h2>
    <p class="lhint">Acceso para coordinadores EHS.</p>
    <label>Correo electrónico
      <input id="loginEmail" type="email" required autocomplete="username" placeholder="nombre@empresa.com">
    </label>
    <label>Contraseña
      <input id="loginPass" type="password" required autocomplete="current-password" placeholder="••••••••">
    </label>
    <div class="lerr" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" type="submit">Entrar</button>
    <div class="lfoot">North America Flooring · SHELSER</div>
  </form>
</div>
<div class="app" id="appRoot" style="display:none">

    <div class="brand">
      <img id="brandImg" alt="EHS Control" class="brandimg">

        <img id="empLogo" alt="" class="emplogo">

        <button class="empadd" onclick="nuevaEmpresa()" title="Agregar empresa">+</button>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="footOrg">—</div>
      <div style="margin-top:3px;opacity:.7">Marco: STPS · ISO 14001/45001</div>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div>
        <h2 id="pageTitle">Panel</h2>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="right" id="topActions"></div>
      <div class="userbox" id="userBox"></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

S-2011","tipo":"check","frec":"Por evento","p":"Lista de verificación previa a trabajos a más de 1.80 m: trabajos en altura, andamios, escaleras y plataformas de elevación (numeral 5.1).","campos":[["fecha","Fecha y hora de la actividad"],["area","Lugar y área"],["pers","Nombre del personal"],["resp","Responsable del personal"],["act","Tipo de actividad a realizar"]],"sec":[{"t":"Trabajos en altura","it":["Existe autorización para realizar el trabajo.","Hay evidencias documental del personal autorizado para trabajos en altura.","El personal autorizado para trabajos de altura se le ha revisado medicamente y se encuentra apto para realizar actividades.","Hay evidencia documental del entrenamiento que ha recibido el personal en trabajos de altura.","Los accesos a los trabajos en altura son los adecuados y seguros cumpliendo con lo establecido en procedimientos y normas.","Estan preparadas las líneas de vida horizontales y/o verticales para engancharse y se observa que los trabajadores las respetan.","Los trabajadores hacen uso de casco con barbiquejo y bolsa portaherramientas para evitar la caída.","Las herramientas manuales utilizadas en los trabajos en altura se encuentran sujetadas evitando con ello caída.","La zona inferior se encuentra delimitada ante la probable caída de objetos, y está en buen estado para evitar la intrusión de personal no autorizado.","Al entrevistar a trabajadores sobre el conocimiento de los riesgos de su operación estos contestan correctamente ejemplo: forma de sujetarse, revisión de arnes, etc.","El responsable de la supervisión de seguridad identifica de manera preventiva los riesgos estableciendo acciones preventivas que eviten la reincidencia.","Existen condiciones climáticas apropiadas (sin lluvia, viento fuerte).","En caso de trabajar cerca de líneas energizadas, se consideró la distancia de seguridad o el bloqueo de energía.","En caso de trabajar cerca de líneas energizadas, ¿se cuenta con el equipo de protección personal para trabajar cerca de ellas?","Existen puntos de anclaje aprobados","Existen líneas de vida horizontal y/o vertical aprobadas","Se cuenta con el equipo de protección completo para detención de caídas (arnés, línea de vida con amortiguador, conectores)","Existen sistemas de comunicación (radios o celulares para comunicación interna y externa)","En caso de caída, se consideró el efecto pendulo para determinar el retirar obstáculos y establecer un radio de seguridad"]},{"t":"Andamios","it":["El personal que se encuentra armando andamios esta acreditado para esta actividad.","Se encuentran las tarjetas correspondientes (roja-verde) colocadas en lugar visible y estan correctamente llenadas y en buen estado.","La zona de riesgo ante posibles caídas de materiales y herramientas está señalizada y acordonada para evitar que el personal propio como ajeno entre al área de trabajo.","El andamio se encuentra estable sin movimientos que afecten la estabilidad del trabajador.","La base del andamio se apoya sobre una superficie estable y suficientemente amplia y nivelada (uso de maderas de apoyo para repartir cargas y husillos de nivelación).","La plataforma de trabajo tiene una anchura mínima de 60 cm. y está sujeta en sus apoyos de forma que se evitan los movimientos por deslizamiento o vuelco.","La plataforma dispone de barandillas resistentes a una altura de 90 cm., listón intermedio a 45 cm. y rodapiés de 15 cm. de altura.","Al accesar a las plataformas no hay huecos que provoquen una condición peligrosa con riesgo de caída para los trabajadores.","Las escaleras sobre salen de la plataforma 90 cm como minimo.","Se considero la distancia de seguridad próxima a las líneas energizadas.","La plataforma se encuentra libre de productos químicos y/o de sustancias que puedan hacerla resbaladiza o generar cualquier otro riesgo.","Se cuenta con líneas de vida de sujección u otro elemento que permita la sujección del trabajador de forma correcta."]},{"t":"Escaleras","it":["No se utilizan escaleras const DOCUMENTOS = [{"c":"EHS-D-001","n":"Instrucciones de seguridad para la prevención y protección contra incendios","nk":"NOM-002-STPS-2010","k":"Instructivo","p":"Reglas y acciones para prevenir y combatir incendios en el centro de trabajo.","o":"D-SH-002-00","b":[{"h":"Seguridad en la prevención incendios:"},{"p":"Disposiciones para el ingreso, supervisión y egreso de contratistas, proveedores, visitantes, entre otros, en las áreas del centro de trabajo:"},{"p":"a) El registro de ingreso a las instalaciones de NOMBRE DE LA EMPRESA es obligatorio para el personal, contratistas, proveedores, votantes, entre otros, y es llevado a cabo por el personal de seguridad en la caseta de vigilancia."},{"p":"b) El uso de gafete es obligatorio para los contratistas, proveedores, visitantes, entre otros, y es entregado por el personal de seguridad en la caseta de vigilancia al momento de su registro."},{"p":"c) Las indicaciones de seguridad a seguir durante la estancia en las instalaciones son las siguientes:"},{"h":"AREA DE PRODUCCION"},{"li":"El orden y la limpieza son imprescindibles para mantener los estándares de seguridad, se debe de colaborar en conseguirlo."},{"li":"Corregir o dar aviso de las condiciones peligrosas e inseguras."},{"li":"No usar maquinas o vehículos sin estar autorizado para ello."},{"li":"Usar las herramientas apropiadas y cuidar su conservación. Al terminar el trabajo dejarlas en el sitio adecuado."},{"li":"Utilizar en cada tarea el Equipo de Protección Personal necesarios para la actividad y mantenerlos en buenas condiciones."},{"li":"No quitar o bloquear las guardas o sensores de protección de la maquinaria."},{"li":"Todas las heridas requieren atención. Acudir al servicio médico o botiquín."},{"li":"No jugar o hacer bromas en el área de trabajo."},{"li":"No improvisar, seguir las instrucciones y cumplir las normas."},{"li":"Prestar atención al trabajo que se está realizando."},{"li":"En trabajos con riesgos de lesiones en la cabeza, utilizar casco."},{"li":"Si se ejecuta o presencia trabajos con proyecciones, salpicaduras, deslumbramientos, etc. Utilizar gafas de seguridad."},{"li":"Si hay riesgos de lesiones para los pies, no dejar de usar calzado de seguridad."},{"li":"Ante la posibilidad de inhalar productos químicos, neblinas, humos, gases debemos proteger las vías respiratorias."},{"h":"TRABAJOS EN LAS ALTURA"},{"li":"Para realizar el trabajo en las alturas se debe de tomar la presión antes de subir. Tanto trabajadores internos como contratistas."},{"li":"Se debe de utilizar el brazo mecánico con su barandal apropiado."},{"li":"Se debe de utilizar el arnés y la línea de vida."},{"li":"Se debe de acordonar el área donde se va a realizar el trabajo en alturas y no permitir que nadie pase por debajo del trabajo."},{"li":"Utilizar casco para trabajos en las alturas."},{"h":"TRABAJO CON HERRAMIENTAS MANUALES"},{"li":"Utilizar las herramientas manuales sólo para sus fines específicos."},{"li":"Inspeccionar las herramientas periódicamente repare las anomalías presentadas."},{"li":"Retirar de uso las herramientas defectuosas."},{"li":"No llevar herramientas en los bolsillos, salvo que estén adaptados para ello."},{"li":"Dejar las herramientas en lugares que no puedan producir accidentes cuando no se utilicen."},{"li":"Verifique el estado de las bocas de las herramientas llamadas fijas o estriadas."},{"li":"Las herramientas de golpe son para personas que ya hayan tenido experiencias en el uso: Antes de usarlas pregunte."},{"h":"TRABAJOS CON ESCALERAS DE MANO"},{"li":"Antes de utilizar una escalera comprobar que se encuentre en perfecto estado."},{"li":"No utilizar nunca escaleras empalmadas una con otra, salvo que estén preparadas para ello."},{"li":"Al subir o bajar, dar siempre la cara a la escalera."},{"li":"No pinte las escaleras, una rajadura es difícil de ver. Píntelas con aceites, barnices etc."},{"h":"TRABAJOS CON ELECTRICIDAD"},{"li":"Toda instalación debe considerarse bajo tensión o con tensión mientras no se compruebe lo contrario con los aparatos adecuados."},{"li":"No realizar nunca reparaciones en instalaciones o equipos con tensión."},{"li":"Aislarse si se trabaja con máquinas o herramientas alimentadas por tensión eléctrica. Utilizar prendas y equipos de seguridad."},{"li":"Comunicar inmediatamente si se observa alguna anomalía en la instalación eléctrica."},{"li":"Reparar en forma inmediata si los cables están gastados o pelados, o los enchufes rotos."},{"li":"Desconecta el aparato o máquina al menor chispazo."},{"li":"Prestar atención a los calentamientos anormales en motores, cables, armarios."},{"li":"Todas las instalaciones eléctricas deben tener llave térmica, disyuntor diferencial y puesta a tierra."},{"h":"TRABAJO CON QUIMICOS"},{"li":"Si se trabaja con líquidos químicos, pensar que los ojos serían los más perjudicados ante cualquier salpicadura."},{"li":"Utilizar el equipo adecuado, también otras partes del cuerpo pueden ser afectados."},{"li":"Al mezclar ácido con agua, colocar el ácido sobre agua, nunca al revés; podría provocar una proyección sumamente peligrosa."},{"li":"No remover ácidos con objetos metálicos; puede provocar proyecciones."},{"li":"Si se salpica ácido a los ojos, lavarse inmediatamente con abundante agua fría y acudir siempre al servicio médico."},{"li":"Si se manipulan productos corrosivos tomar precauciones para evitar su derrame; si este se produce actuar con rapidez según las normas de seguridad."},{"li":"Si se trabaja con productos químicos extremar la limpieza personal, particularmente antes de las comidas y al abandonar el trabajo."},{"li":"Los riesgos para el organismo pueden llegar por distintas vías: respiratoria, oral, por contacto...etc. Todas ellas requieren atención."},{"li":"Se debe utilizar ropa protectora según el caso de cada producto químico."},{"li":"Utilizar protección respiratoria y ocular."},{"p":"d) Las acciones a ejecutar en situaciones de emergencia;"},{"h":"EMERGENCIAS (INCENDIO, DERRAMES, ETC)"},{"li":"Los extintores son fáciles de utilizar, pero sólo si se conocen; enterarse de cómo funcionan"},{"li":"Conocer las causas que pueden provocar un incendio en el área de trabajo y las medidas preventivas necesarias."},{"li":"Recordar el número de teléfono de los bomberos privados o Voluntarios"},{"li":"Que el buen orden y limpieza son los principios más importantes de prevención de incendios."},{"li":"No fumar en lugares prohibidos, ni tirar las colillas o cigarros sin apagar."},{"li":"Controlar las chispas de cualquier origen ya que pueden ser causa de muchos incendios."},{"li":"Ante un caso de incendio conocer las posibles acciones."},{"li":"Si se manejan productos inflamables, prestar mucha atención y respetar las normas de seguridad."},{"li":"Preocuparse por conocer el plan de emergencia. Conocer las instrucciones de la empresa y de su hogar, escuela, club, etc. al respecto."},{"li":"Seguir las instrucciones que se indiquen, y en particular, de quien tenga la responsabilidad en esos momentos."},{"li":"No correr ni empujar a los demás; si ser está en un lugar cerrado buscar la salida más cercana sin atropellamientos."},{"li":"Usar las salidas de emergencia, nunca los ascensores o montacargas."},{"li":"Prestar atención a la señalización, ayudará a localizar las salidas de emergencia."},{"p":"PARA ACTUAR EN ACCIDENTES"},{"li":"Mantener la calma y actuar con rapidez."},{"li":"La tranquilidad dará confianza al lesionado y a los demás."},{"li":"Pensar antes de actuar."},{"li":"Asegurarse de que no hay más peligros."},{"li":"Asegurarse de quien necesita más la ayuda y atender al herido o heridos con cuidado y precaución."},{"li":"No hacer más de lo indispensable; recordar no reemplazar al médico."},{"li":"No dar jamás de beber a una persona sin conocimiento; puede ser ahogada con el líquido."},{"li":"Avisar inmediatamente por los medios posibles al médico o servicio de socorro."},{"p":"e) El control de acceso a personal no autorizado en áreas restringidas."},{"p":"El acceso a personal no autorizado en áreas restringidas debe ser autorizado por el encargado del área y se debe de dar aviso al departamento de Recursos Humanos y Vigilancia."},{"p":"f) El control de estancia y egreso."},{"p":"Se deberá informar a el encargado del área cuanto tiempo se tiene contemplado permanecer en dicha área, así como también al momento que la abandone."},{"h":"Control de ingreso, almacenamiento y egreso de materiales combustibles, inflamables y explosivos:"},{"li":"El registro de ingreso de los materiales se debe realizar en la caseta de vigilancia, por medio de una lista donde se mencione cuáles son las sustancias a ingresar, indicando su cantidad o volumen."},{"li":"Es obligatorio ingreso de los materiales debidamente señalizados y con hoja de datos de seguridad;"},{"li":"Durante la recepción de los materiales se deberá ser de manera segura, conducirse de manera apropiada en caso de ser pinturas o solventes en contenedores pequeños. En el caso de ser tanques con gases presurizados, el proveedor deberá ingresar con su vehículo, el cual deberá estar debidamente asegurado de las llantas, para posteriormente descargar los tanques llenos y cargar los tanques vacíos. Esta maniobra siempre deberá ser supervisada por el personal de la empresa y asegurarse de que cada tanque vacío o lleno deberá tener su capuchón debidamente fijado. Los tanques llenos deberán de colocarse en su área correspondiente y ser asegurados con cadenas."},{"li":"Las indicaciones de seguridad a seguir para el almacenamiento de materiales son las siguientes:"},{"p":"1) Las áreas donde se encuentren almacenados los materiales deben estar ventiladas;"},{"p":"2) En caso de que se trate de sustancias inflamables, los equipos, vehículos e instalaciones deberán estar conectados a tierra, cuando sea necesario esta actividad se deberá seguir el procedimiento según se indique por parte de la empresa."},{"p":"3) Es necesario realizar el acordonamiento de áreas y señalización correspondiente para evitar cualquier tipo de accidente."},{"p":"4) La cantidad de los materiales debe ser limitada a la requerida para las actividades, no está permitido el ingreso de cantidades de materiales mayores a los necesarios."},{"p":"g) El control y limpieza en las áreas, contenedores, tuberías en caso de derrames."},{"p":"En todo momento se debe de preservar el orden y la limpieza del área donde se desarrollan las actividades."},{"p":"En el caso de que se utilicen contenedores deberán se resguardados de tal manera que evite cualquier fuga o derrame."},{"p":"En caso de tuberías se debe asegurar que sean cerradas o abiertas correctamente a las necesidades de la actividad a realizar."},{"h":"Control de fuentes de ignición:"},{"p":"a) Es obligatorio el uso adecuado de las instalaciones eléctricas. En caso de realizar cualquier tipo de conexión, revisión y/o mantenimiento a las instalaciones eléctricas se deberá ser acompañado por personal de mantenimiento de la empresa."},{"p":"b) Los procedimientos de seguridad para la ejecución de trabajos en caliente son los siguientes:"},{"p":"Requerimientos específicos de seguridad para trabajos de corte, soldadura, flama abierta:"},{"p":"El trabajador que realizará el trabajo de corte, soldadura o flama abierta, pedirá el permiso en el departamento de Seguridad e higiene de la empresa."},{"p":"El trabajador deberá retirar o cubrir todo material inflamable en el área donde se realice corte, soldadura o flama abierta."},{"p":"Una inspección deberá hacerse con el trabajador que va a realizar el trabajo y el supervisor que autoriza el trabajo, antes de empezar el trabajo."},{"p":"El permiso deberá de estar visible en el área de trabajo hasta la terminación de este."},{"p":"Entregará el permiso al departamento de seguridad e higiene para que se mantenga en un archivo para futuras auditorias."},{"p":"Notas importantes de seguridad:"},{"li":"Equipos usados para mezclar aire u oxigeno con gas inflamable o combustible (de corte, soldadura, flama abierta) deberán ser autorizados por el departamento de Seguridad e higiene de la empresa con el propósito de tener el área segura mientras se realiza el trabajo."},{"li":"Ningún trabajador o contratista está autorizado a transferir gases inflamables o combustibles de un cilindro a otro (hacer transvase) o mezclar gases en un cilindro mientras se encuentren en la propiedad de la empresa."},{"li":"El gas acetileno no debe usarse a presiones que excedan a las 15 libras/plg2"},{"li":"Usar Acetileno líquido queda prohibido."},{"li":"Oxigeno usado de cilindros presurizados o cilindros con manifold deberán tener un equipo diseñado para regular la presión y deberá estar etiquetado para ser usado con oxígeno."},{"li":"Gas como combustible de cilindros presurizados o cilindros con manifold deberán tener un equipo diseñado para regular la presión y deberá estar etiquetado para ser usado con el gas especifico"},{"li":"Cilindros, válvulas, reguladores, mangueras y otros aparatos para examinar el contenido o usados para transferir oxigeno deberán de estar libres de aceite o grasa y no pueden manejarse con manos, guantes o materiales con grasa."},{"li":"Cilindros con oxigeno o combustibles deberán estar localizados alejados del punto de corte, soldadura o flama abierta, para evitar calor por radiación, impacto por chispa o una mala dirección de la flama de la antorcha."},{"li":"Todos los combustibles deben de estar alejados del punto de corte, soldadura o flama abierta cuando menos a 10.7m cuando el trabajo se esté realizando."},{"li":"Siempre se debe considerar una distancia de 15 metros entre líquidos o vapores inflamables, altas concentraciones de polvo inflamable en el aire, materiales altamente combustibles, pasillos de tránsito de trabajadores y el punto de corte, soldadura o flama abierta. Todos los deben de estar alejados a 15 metros cuando se esté realizando corte, soldadura o flama abierta, Si estos trabajos se realizan en estas áreas deberán colocarse cortinas no inflamables de protección entre el punto y los materiales o área de tránsito del trabajador que están en riesgo, y tener a la vista el permiso para realizar el trabajo."},{"p":"Por lo menos 1 extintor portátil deberá estar accesible y cerca de la persona que realice el trabajo caliente."},{"p":"Ductos o sistemas transportadores que podrían producir chispas o escorias de combustibles hacia el área del trabajo caliente deberán ser monitoreados o apagados mientras se realice el trabajo."},{"li":"Cuando el trabajo caliente se hace cerca de paredes, tabiques o techo, construidos de material combustible, cortinas resistentes a fuego a guardas deberán de ser usadas para prevenir cualquier ignición."},{"li":"No se harán trabajos calientes en tambores, barriles, tanques u otros contenedores que tuvieron substancias inflamables hasta que sean limpiados y estén libres de substancias inflamables como grasa, brea, ácidos u otros químicos los cuales puedan generar vapores toxico inflamables cuando se calientan."},{"li":"Cuando se realice un trabajo caliente en un tanque u otro contenedor, toda la tubería o conexiones de fluidos deberán de ser desconectadas."},{"p":"Equipo de Protección Personal:"},{"li":"Careta y protección en las manos deben ser usadas durante el trabajo de soldadura y corte. Si el trabajo no se coloca cortinas de protección los trabajadores alrededor del área deberán usar protección en los ojos. El material usado para careta y guantes deben de ser para proteger del calor y corriente eléctrica y de material inflamable."},{"li":"La careta debe proteger cara, cuello y oídos de energía radiante del arco de soldadura."},{"li":"Ropa apropiada de material inflamable capaz de proteger al trabajador de quemaduras."},{"p":"d) Está prohibido fumar o introducir objetos que produzcan chispa o flama, en las áreas de riesgo de incendio"},{"p":"e) Es obligatorio el uso de equipos y aparatos eléctricos o electrónicos intrínsecamente seguros (a prueba de explosión);"},{"p":"f) Se debe vigilar la generación y acumulación de electricidad estática en equipo, instalaciones, maquinaria, vestimenta, herramientas, entre otros, y"},{"h":"Seguridad en la protección contra incendios:"},{"p":"a) La ubicación de rutas de evacuación, salidas de emergencia y puntos de reunión se encuentra publicada en diferentes lugares de la empresa, deberá situar la ruta de evacuación más apta desde el área donde se encuentre para conducirse a la salida de emergencia más cercana dirigirse al punto de reunión que corresponda."},{"p":"b) Los medios de alertamiento existentes para situaciones de emergencia son audibles, en caso de reconocerlo y recibir indicaciones de los brigadistas y evacuación, favor de atenderlas. Diríjase en todo momento con calma, evitando correr, aventar a los demás compañeros y caer en pánico."}]},{"c":"EHS-D-002","n":"Programa específico para revisión y mantenimiento de la maquinaria, equipo y herramientas","nk":"NOM-004-STPS-1999","k":"Programa","p":"Procedimientos de operación, ajuste, limpieza y mantenimiento seguro de maquinaria y equipo.","o":"F-SH-004-00","b":[{"p":"INTRODUCCION"},{"p":"La aplicación de nuevos enfoques de mantenimiento a partir de la identificación de oportunidades de mejora continua de la confiabilidad operacional y los elementos que la componen, es una necesidad para todas las empresas que pretendan incrementar sus indicadores de eficiencia. A partir de la realización de un análisis en el que fueron establecidas las funciones, los fallos funcionales, los modos de fallo y sus efectos, se identificaron los requerimientos de mantenimiento de estas máquinas y las tareas necesarias para asegurar la continuidad de las funciones, las que se concentraron en una propuesta de programa con marcada tendencia a las actividades proactivas."},{"p":"Estrategias de Mantenimiento"},{"p":"En la actualidad las actividades de mantenimiento aplicadas a maquinas inyectoras son básicamente reactivas. Se lleva un control de horas de funcionamiento y, una vez alcanzadas, se realiza un reemplazo de aquellos componentes internos que presenten deterioro. El plan de mantenimiento del equipo en conjunto, considera la parte de control por separado. La información recabada por reparaciones realizadas es muy vaga y algunas averías ocurridas en varios equipos tienen diferencia de criterio, por lo tanto, no existe uniformidad de la información. La recopilación de la información obtenida no permite con claridad determinar cuál es el fallo más frecuente en los equipos."},{"p":"Identificación de oportunidades de Mejora."},{"p":"Con la información recabada y evaluada en relación con las actividades de mantenimiento que son ejecutadas, se observó que no existe una planificación de actividades proactivas específicas que permitan prevenir o predecir cualquier fallo funcional y garanticen la confiabilidad y disponibilidad requeridas para estos equipos. Además, la información sobre los fallos ocurridos no tiene un criterio unificado."},{"p":"Responsabilidades:"},{"p":"Los responsables de cumplir con todos los lineamientos de este Programa son:"},{"p":"Nombre Puesto"},{"p":"Wang Jie Técnico en Mantenimiento"},{"p":"Cen He Técnico en Mantenimiento"},{"p":"Huynh Le Phuoc Thien Técnico en Mantenimiento"},{"p":"Pham Khac Nhu Técnico en Mantenimiento"},{"p":"Dong Bin Bin Técnico en Mantenimiento"},{"li":"Operación de la maquinaria y equipo."},{"p":"A continuación, se describen los procedimientos a seguir de las actividades principales en la operación de maquinaria y equipo."},{"h":"1.1 Instalación de protectores y dispositivos de seguridad y su uso durante la operación."},{"p":"1.1.1 Cuando se integra una máquina y equipo nuevo al proceso, se sigue el siguiente procedimiento:"},{"li":"Se realiza un análisis de riesgos de la maquinaria a fin de detectar los protectores y dispositivos de seguridad necesarios."},{"li":"Se evalúan los posibles protectores y dispositivos aplicables."},{"li":"Se elige el indicado"},{"li":"En el caso de ser un sensor o dispositivo se cotiza y se hace la compra, si es un protector se construye en el área de mantenimiento de acuerdo a las dimensiones del equipo o maquinaria."},{"p":"1.1.2 Para el debido uso de los protectores y dispositivos de seguridad y su uso durante la operación se realiza el siguiente procedimiento:"},{"li":"Al iniciar actividades el líder de la operación revisa que los dispositivos o protectores estén en buenas condiciones y en su caso estén activados."},{"li":"En caso de que los dispositivos o protectores estén fuera de funcionamiento, no se inicia la operación, se llama al personal de mantenimiento paraqué evalué y en caso de ser necesario repare."},{"li":"En el caso de que no sea posible reparar, la operación queda suspendida, en el caso que, si se pueda, la maquinaria o equipo inicia funciones, en este caso, el operador deberá parao operaciones y avisar a su superior en caso de que detecte cualquier anomalía."},{"li":"Orden y limpieza en el área de trabajo."},{"p":"1.2.1 El área de trabajo debe estar en orden y con la debida limpieza para que permita el desarrollo de las actividades de trabajo de forma segura, por lo que debe seguir el siguiente procedimiento:"},{"li":"Al llegar al área de trabajo, el operador revisa que todos los implementos necesarios para que desarrolle sus actividades estén en su lugar."},{"li":"Retira cualquier objeto que no tenga utilidad en su área, y lo coloca en su sitio."},{"li":"Cuando así se requiera, se dispondrá cualquier desecho o residuo a su lugar correspondiente."},{"li":"Al finalizar su trabajo, el operador debe cerciorarse que el área de trabajo se encuentre ordenada para el operador del siguiente turno."},{"li":"El líder de la operación se cerciorará que las áreas de trabajo se encuentren ordenadas."},{"li":"Ajuste de la maquinaria y equipo para prevenir un riesgo."},{"p":"1.3.1 El ajuste de la maquinaria y equipo es necesario para lograr la calidad del producto que se maquila, por lo que se sigue el siguiente procedimiento:"},{"li":"Se coloca la etiqueta y candado (Lock out / Tag out) antes de iniciar cualquier actividad"},{"li":"Realizar el TPM de la maquina y/o equipo a operar, asegurando que cada una de las partes estén en perfectas condiciones."},{"li":"Se identifica el herramental y/o herramienta a utilizarse y se procede a realizar el montaje y/o ajuste de la maquina asegurándose que no exista riesgo alguno en ningún componente utilizado."},{"li":"Se retira etiqueta y candado (Lock out / Tag out) para posteriormente iniciar con la operación del equipo."},{"li":"Protección de las conexiones de la maquinaria y equipo y sus contactos eléctricos."},{"p":"1.4.1 Los conexiones de la maquinaria y equipo deben ser protegidos para evitar cualquier tipo de daño y posible corto eléctrico, por lo que se sigue el siguiente procedimiento para su protección:"},{"li":"Se coloca etiqueta y candado (Lock out / Tag out) antes de iniciar con la inspección de la maquinaria."},{"li":"De acuerdo a programa de mantenimiento se inspecciona detalladamente cada una de las conexiones y partes eléctricas del equipo para garantizar su correcto funcionamiento."},{"li":"Cualquier anomalía encontrada es reparada de inmediato y/o en su defecto reemplazada por una parte nueva."},{"p":"d) Retirar etiqueta y candado realizando pruebas para asegurar que equipo está en óptimas condiciones de operación."},{"li":"Cambio y uso de la herramienta y el herramental."},{"p":"1.5.1 El buen estado de las herramientas es muy importante para la seguridad del trabajador como de las maquinas. Para lograr este objetivo se deberá seguir el siguiente procedimiento:"},{"li":"Inspeccionar las herramientas cada inicio de turno, debiendo ser por los por los trabajadores, para observar en qué condiciones se encuentran y si requieren mantenimiento. Toda aquella herramienta que se encuentre en mal estado deberá ser sustituida o sacada de circulación hasta que sea reparada, para evitar que el trabajador se lastime o trabaje con equipo en mal estado, esto para evitar accidentes"},{"li":"Si se detecta alguna herramienta en mal estado, se deberá reportar al jefe directo para que verifique lo encontrado."},{"li":"Si se aprueba por el jefe inmediato se acudirá a almacén para el cambio de la herramienta por medio de un vale que deberá ser firmado por el jefe inmediato."},{"li":"Actividades de operación seguras."},{"p":"1.6.1 Para poder realizar las actividades de operación seguras, el personal deberá seguir el siguiente procedimiento general"},{"li":"Operador revisa continuamente que los dispositivos de seguridad estén funcionando en perfectas condiciones (cortinas de seguridad, sensores, switch, guardas etc..."},{"li":"En caso de realizar algún ajuste en el transcurso de la operación deberá seguir con el procedimiento 1.3"},{"li":"Es responsabilidad del operador reportar cualquier anomalía en la maquinaria y/o equipo al área de mantenimiento para su revisión."},{"li":"No podrá ser utilizado la maquinaria hasta que el personal de mantenimiento asegure que el equipo este en buenas condiciones de operar."},{"li":"Una vez finalizada la operación es responsabilidad del operador indicar al supervisor o líder de producción, para que le indique la siguiente operación."},{"li":"Sistema de alimentación y retiro de la materia prima, subproducto y producto terminado de manera segura."},{"p":"La alimentación de la materia prima y el retiro del producto terminado deberá de ser de acuerdo al siguiente procedimiento para asegurar estas actividades de forma segura."},{"li":"La materia prima o producto terminado siempre deberá ser desplazada por medio de un montacargas o patín."},{"li":"Los contenedores de la materia prima o producto terminado deberán ser colocados en el área de trabajo, evitando obstaculizar el tránsito del operador, en caso de emergencia p bien las áreas de tránsito."},{"li":"En caso de ser necesario, se deberá utilizar un polipasto para el movimiento de la materia prima o producto terminado en el área de trabajo."},{"li":"Terminado el lote de piezas, este debe ser retirado por medio de un montacargas o patín del área de trabajo."},{"li":"Mantenimiento de la maquinaria y equipo."},{"p":"La capacitación que se otorga a los trabajadores que realizan las actividades de mantenimiento está incluida en la siguiente calendarización:"},{"t":[["CURSO","2025"],["CURSO","ENE","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"],["Bloqueo y etiquetado","","","","","","X","","","","","",""],["Equipos sujetos a presión","","","","","","","","","X","","",""],["Operación segura de maquinaria","","","","","","","","","","","","X"]]},{"h":"2.1 Mantenimiento Preventivo."},{"p":"La periodicidad del mantenimiento preventivo es semanal, mensual y anual como se tiene contemplado en el programa anual de mantenimiento y el procedimiento general es el siguiente:"},{"p":"a) Colocar etiqueta y candado (Lock out / Tag out) antes de iniciar con el MP"},{"p":"b) Técnico de mantenimiento ejecuta rutinas de mantenimiento preventivo las cuales son programadas por semanas, mes y/o anual."},{"p":"c) Inspecciona cada una de los puntos a ejecutar indicados en la rutina de MP y se asegura que las condiciones de la maquina sean las óptimas."},{"p":"d) Repara cada uno de los hallazgos encontrados fuera de las condiciones óptimas de operación."},{"p":"f) Retira etiqueta y candado (Lock out / Tag out) y realiza pruebas en vacío del equipo para asegurar que este en buenas condiciones."},{"p":"g) Realiza llenado del formato de mantenimiento preventivo indicando en caso de ser necesario la compra de alguna refacción que no se tuviera en ese momento, así como las reparaciones realizadas dentro de la rutina."},{"h":"2.2 Mantenimiento Correctivo."},{"p":"El mantenimiento correctivo se efectúa al recibir el reporte del líder y/o supervisor de producción, atendiendo de inmediato la falla en el equipo siguiendo el procedimiento Lock out / Tag out."},{"h":"2.3 Condiciones seguras de mantenimiento."},{"p":"A fin de garantizar que todos los componentes de la maquinaria y equipo estén en condiciones seguras de operación se debe cumplir con las siguientes condiciones:"},{"li":"Al concluir el mantenimiento, los protectores y dispositivos deben estar en su lugar y en condiciones de funcionamiento;"},{"li":"Cuando se modifique o reconstruya una maquinaria o equipo, se deben preservar las condiciones de seguridad;"},{"li":"El bloqueo de energía se realizará antes y durante el mantenimiento de la maquinaria y equipo, cumpliendo además con lo siguiente:"},{"li":"Deberá realizarse por el encargado del mantenimiento;"},{"li":"Deberá avisarse previamente a los trabajadores involucrados, cuando se realice el bloqueo de energía;"},{"li":"Identificar los interruptores, válvulas y puntos que requieran inmovilización;"},{"li":"Bloquear la energía en tableros, controles o equipos, a fin de des energizar, desactivar o impedir la operación de la maquinaria y equipo;"},{"li":"Colocar tarjetas de aviso,"},{"li":"Colocar los candados de seguridad;"},{"li":"Asegurarse que se realizó el bloqueo;"},{"li":"Avisar a los trabajadores involucrados cuando haya sido retirado el bloqueo."},{"li":"El trabajador que colocó las tarjetas de aviso, debe ser el que las retire."},{"h":"2.4 Registro del mantenimiento preventivo y correctivo."},{"p":"Cuando se le aplique a la maquinaria y equipo algún mantenimiento ya sea preventivo y/o correctivo, se deberá hacer su registro correspondiente en la bitácora de mantenimiento que tiene a su cargo el Gerente de Mantenimiento."}]},{"c":"EHS-D-003","n":"Manual de primeros auxilios","nk":"NOM-030-STPS-2009","k":"Manual","p":"Guía de actuación inmediata ante lesiones y urgencias médicas en el centro de trabajo.","o":"F-SH-004-01","b":[{"h":"ÍNDICE"},{"t":[["TEMA","Página"],["Introducción a los primeros auxilios","4"],["Evaluación de la escena","4"],["Evaluación primaria de la víctima","6"],["• Técnica AVDI","6"],["• Técnica CAB","6"],["Evaluación secundaria de la víctima","7"],["• Soporte básico de vida","9"],["• Cadena de supervivencia","12"],["Reanimación cardiopulmonar (RCP)","12"],["• Técnica de compresión","14"],["• DEA (Desfibrilador Automático Externo)","15"],["Generalidades sobre las lesiones","17"],["Hemorragias","17"],["• Clasificación básica de los vasos sanguíneos","17"],["• Clasificación de las hemorragias","17"],["• Métodos de contención de hemorragias","17"],["Estado de shock","18"],["• Clasificación","19"],["• Signos y síntomas","19"],["• Tratamiento de urgencia","19"],["• Consecuencias","20"],["Heridas","20"],["• Clasificación de las heridas, según el agente causal","20"],["• Tratamiento de primeros auxilios","21"],["Quemaduras","22"],["• Clasificación de las quemaduras según su profundidad","23"],["• Primeros auxilios para quemaduras","23"],["Fracturas, esguinces y luxaciones","24"],["• Fractura","25"],["• Clasificación","25"],["• Signos y síntomas","25"],["• Tratamiento","25"],["• Complicaciones que pueden presentarse en casos de fracturas","26"],["• Fracturas especiales","27"],["• Luxación","28"],["• Tratamiento","29"],["• Esguince","29"],["• Tratamiento","29"],["• Traumatismos de tórax","29"],["• Neumotórax","29"],["Lesiones de abdomen","31"],["• Heridas penetrantes en abdomen","31"],["• Clasificación","31"],["• Objeto empalado","32"],["Amputaciones","33"],["• Clasificación","33"],["Traumatismo Cráneo Encefálico (TCE)","34"],["Traumatismos de columna vertebral","35"],["Emergencias ambientales","35"],["• Accidente eléctrico","35"],["• Lesiones por calor","37"],["• Golpe de calor","37"],["• Agotamiento por calor","37"],["• Lesiones por frío","38"],["Intoxicaciones por materiales peligrosos","39"],["• Generalidades","39"],["• Intoxicación por cianuro de sodio","41"],["• Intoxicación por monóxido de carbono","42"],["Vendajes","43"],["Levantamiento y movilización de lesionados","45"],["Sistema de transporte de lesionados","46"]]},{"h":"INTRODUCCIÓN A LOS PRIMEROS AUXILIOS"},{"p":"Los Primeros Auxilios son los procedimientos inmediatos y temporales que se aplican a una persona que ha sufrido un accidente o una enfermedad repentina, en tanto se le proporciona atención médica especializada."},{"p":"El conocimiento y aplicación de los Primeros Auxilios de manera adecuada trae como consecuencia:"},{"li":"Diferencia entre la vida y la muerte."},{"li":"Diferencia entre la invalidez temporal o permanente."},{"li":"Diferencia entre la recuperación rápida o una larga hospitalización."},{"p":"Reglas que se aplican en todas las urgencias:"},{"li":"Mantener la calma."},{"li":"Hacer una evaluación clara y precisa del accidente."},{"li":"Asumir el mando dando órdenes claras y precisas."},{"li":"Solicitar ayuda."},{"li":"Traslado adecuado."},{"li":"No aplicar medicamento."},{"h":"EVALUACIÓN DE LA ESCENA"},{"h":"Reconocimiento de la escena"},{"p":"Considerando que la seguridad del auxiliador es siempre prioritaria, en este tema se enmarcará la necesidad de destacar todo tipo de riesgos."},{"li":"Riesgos presentes: Son los que ya existen en el lugar de la urgencia, pueden afectar tanto al auxiliador como a la víctima."},{"li":"Riesgos potenciales: Son aquellos que pueden suceder durante la atención y salvamento de los lesionados y que generalmente son provocados por una falta de planeación de la atención."},{"p":"El brigadista debe tener la destreza para elaborar un plan de acción durante las situaciones de urgencia que se presenten teniendo en cuenta que cada una de ellas es diferente a todas las demás."},{"p":"1. Al acercarse al accidente no sólo se debe observar a las víctimas sino todo el entorno del lugar. El observar completamente el entorno del accidente se debe llevar sólo unos cuantos segundos. Y se debe preguntar ¿Es seguro acercarse al lugar de la escena? ¿Es suficientemente segura el área para acercarse al accidente? Una vez que se ha evaluado el lugar de la escena, determinar si el lugar es seguro para el auxiliador y las víctimas, sino es así se puede desencadenar un riesgo potencial por lo que de inmediato hay que mover a la víctima."},{"p":"2. Investigar ¿qué pasó? Buscar indicios del tipo del accidente y de las lesiones que las víctimas puedan tener, la escena a menudo ofrece las respuestas, por ejemplo: si una persona yace al lado de una escalera se puede sospechar posibles fracturas en los miembros o de lesión cervical, un alambre eléctrico tirado a un lado o por debajo de una víctima dará indicios de una probable descarga eléctrica."},{"p":"Toda esta información es importante y ayudará a elaborar un plan de acción especialmente cuando las víctimas están inconscientes o no se cuenta con personas que informen qué pasó."},{"p":"3. ¿Cuántas personas están lesionadas? Observar más allá de la víctima. Ya que puede haber otras personas accidentadas. Una persona puede estar gritando de dolor o de susto mientras que la otra puede tener lesiones más serias pasando desapercibidas porque está inconsciente."},{"p":"4. Identificarse como persona capacitada en Primeros Auxilios. Es necesario identificarse con la víctima y los espectadores."},{"p":"5. ¿Hay espectadores que puedan ayudar? Si hay espectadores se pueden utilizar como ayuda para averiguar qué pasó, tal vez alguien vio el momento del accidente o conoce a algunas de las víctimas y pueden proporcionar datos de suma importancia; ¿Cómo ocurrió el accidente? Si la víctima tiene problemas de salud, el espectador puede ir a pedir ayuda."},{"p":"La manera correcta para mandar a los curiosos a activar el sistema de emergencias es la siguiente:"},{"li":"Señalar a una persona llamándola por alguna característica particular. (color de playera)"},{"li":"Utilizar una voz de mando."},{"li":"Darle el número al que debe de llamar en caso que lo desconozca."},{"li":"Pedirle que regrese a confirmar que ha hecho la llamada. Debe de proporcionar:"},{"p":"1. Qué tipo de apoyo necesita."},{"p":"2. Qué fue lo que pasó."},{"p":"3. Que indique cuantos lesionados existen."},{"p":"4. Sitio exacto de la emergencia y algún punto de referencia."},{"p":"5. Hace cuánto tiempo sucedió."},{"p":"6. Nombre de la persona que habla."},{"p":"7. Teléfono dónde se pueda localizar. No colgar hasta que el que atienda la llamada lo indique."},{"p":"6. Antes de administrar los Primeros Auxilios a una persona que está consciente es importante pedir permiso para ayudarlo. En caso de que la víctima esté inconsciente, el consentimiento está implícito."},{"p":"7. Al iniciar los cuidados de Primeros Auxilios se aplica la atención por la palabra al lesionado, el platicar con él hará que éste sienta que se le está atendiendo en una forma profesional y humana. Para la víctima observar las siguientes recomendaciones:"},{"li":"Dar prioridad a problemas cardiorrespiratorios y fuertes hemorragias (CAB)."},{"li":"Revisar a la víctima cuidadosamente de cabeza a pies. EVALUACIÓN SECUNDARIA."},{"li":"Si no hay peligro en la escena, no mover al lesionado hasta conocer sus lesiones."},{"h":"EVALUACIÓN PRIMARIA DE LA VÍCTIMA"},{"p":"El reconocimiento primario es una exploración rápida donde se verifican las alteraciones que constituyen una amenaza inmediata a la vida de la víctima, esta exploración se centrará en los tres sistemas de sostén de la vida."},{"h":"PACIENTE CONSCIENTE O INCONSCIENTE, TECNICA AVDI"},{"p":"A (Alerta): La persona se encuentra Alerta, habla fluidamente, fija la mirada al explorador y está al pendiente de lo que sucede en torno suyo."},{"p":"V (Respuesta verbal): La persona presenta respuesta Verbal, aunque no está alerta puede responder a las preguntas que se le realicen y responde cuando se le llama."},{"p":"D (Respuesta al dolor): La persona presenta respuesta solamente a la aplicación de algún estímulo Doloroso, como presionar firmemente alguna saliente ósea como el esternón o las clavículas; pueden emplearse métodos de exploración menos lesivos como rozar levemente sus pestañas o dar golpecitos con el dedo en medio de las cejas, esto producirá un parpadeo involuntario, que se considera respuesta."},{"p":"I: La persona no presenta ninguna respuesta a estímulos externos, está Inconsciente."},{"h":"TÉCNICA CAB"},{"p":"Mediante este sistema se evalúa en el siguiente orden:"},{"li":"Sistema Circulatorio"},{"li":"Sistema Respiratorio"},{"h":"VERIFICACIÓN DEL CAB"},{"p":"C: “Circulation”. Circulación y control de hemorragias."},{"p":"A: “Airway”. Abrir vía aérea y control de cervicales."},{"p":"B: “Breath”. Respiración."},{"p":"C: Se determina la presencia de signos de circulación, como el pulso, coloración de la piel, si está pálido o azulado y la temperatura corporal. Revisión general y saber si presenta alguna hemorragia evidente."},{"p":"A: Que la vía aérea este abierta y sin riesgo de obstrucción. Se abre la boca mediante elevación del mentón y desplazamiento lento de la mandíbula, en busca de cualquier obstrucción de la vía aérea."},{"p":"En caso de encontrarse un cuerpo sólido a nuestro alcance lo retiramos haciendo un barrido de gancho con el dedo índice, si el hallazgo son secreciones o cualquier otro fluido se podrá utilizar cualquiera de los dispositivos de aspiración. Todo paciente traumatizado es sospechoso de lesión medular cervical hasta que se demuestre lo contrario, por lo tanto las maniobras anteriormente descritas deben realizarse con el cuello en posición neutra y con la menor movilización posible."},{"p":"B: Hay que determinar si respira por"},{"p":"sí solo, con qué frecuencia y qué tan"},{"p":"profundas son las respiraciones."},{"li":"Evaluación secundaria de la víctima"},{"p":"Este reconocimiento consiste en la medición de los signos vitales y de otras lesiones que no constituyen una amenaza inmediata a la vida de la víctima, pero que pueden desencadenar un problema mayor si no se corrigen de inmediato. Este reconocimiento se basa en tres pasos fundamentales."},{"li":"Medición de sus signos vitales."},{"li":"Revisión de la víctima de cabeza a pies."},{"li":"Interrogatorio (en caso de poder responder)."},{"p":"Signos vitales: Son mediciones de las funciones básicas del cuerpo, son cuatro los signos vitales que con mayor frecuencia se miden por los profesionales de la salud."},{"p":"Frecuencia cardíaca o pulso: Número de latidos del corazón por minuto, la frecuencia cardiaca se mide colocando un estetoscopio en la región precordial y escuchar cuantos latidos tiene el corazón en un minuto y el pulso se mide al colocar la yema del dedo medio y anular en un lugar donde se encuentre una arteria de manera superficial (cuello, pliegue del codo, muñeca, ingle, cara posterior de rodilla), se cuenta cuantos pulsos se sienten en un minuto. Rango normal (60-80 latidos por minuto)."},{"li":"Tensión arterial: La presión que ejerce la sangre sobre la pared de las arterias, se mide en milímetros de mercurio (mmHg). Se mide colocando el mango del esfigmomanómetro por arriba del pliegue del codo, se coloca un estetoscopio en el área del pulso del codo, se infla el manguito del esfigmomanómetro a 180 mm Hg aproximadamente, se desinfla el manguito despacio, es necesario observar la aguja del manómetro al igual que escuchar los ruidos de pulso. Rango normal 110/80 más menos 10 mm Hg."},{"li":"Temperatura: Es la temperatura en grados centígrados del centro del cuerpo. Se mide con un termómetro ya sea del tipo, oral, rectal o frontal. Rango normal 36.5 a 37 grados."},{"li":"Frecuencia respiratoria: Es el número de respiraciones que se miden en un minuto, se coloca un estetoscopio en el tórax, se escucha la entrada y salida de aire a la vez que se observa el movimiento del tórax, contar cuantas veces en un minuto realiza movimientos respiratorios. Rango normal de 12 a 16 respiraciones por minuto."},{"h":"SOPORTE BÁSICO DE VIDA"},{"h":"OBSTRUCCIÓN DE VÍA AÉREA (ATRAGANTAMIENTO)"},{"p":"Se le llama obstrucción de la vía área cuando existe dificultad para el paso del aire de la faringe a la tráquea debido a una obstrucción mecánica, si el paso del aire es obstruido por completo se la llama obstrucción total, si la obstrucción del aire no es completa se le llama obstrucción parcial."},{"h":"Paciente Consciente"},{"p":"Sólo la obstrucción de vía aérea superior (garganta o laringe, y tráquea) por objetos sólidos como los alimentos o cuerpos extraños, puede resolverse por la maniobra de desobstrucción de vía aérea que se describe."},{"p":"Si se observa a una persona que se lleva las manos al cuello (señal universal de atragantamiento) y al parecer estar atragantándose hay que hacer un reconocimiento del lugar mientras se acerca a la víctima. Comenzar el reconocimiento primario acercándose a la víctima."},{"p":"Si la persona tose débilmente o tiene un sonido agudo al respirar o si no puede hablar, respirar ni toser con fuerza, hay que decirle a la víctima que está adiestrado en Primeros Auxilios y ofrecerle ayuda. Si hay otra persona cerca, pedir que active el servicio médico de urgencia."},{"p":"Si el paciente puede hablar y toser, solo acompáñelo y pídale que siga tosiendo (obstrucción parcial). Si el paciente no tose ni emite sonido alguno, se trata de una obstrucción total y aplica el siguiente método."},{"h":"Maniobra de Heimlich."},{"p":"El abdomen de una víctima consciente se presiona mientras está parada o sentada."},{"li":"Pararse detrás de la víctima y si está de pie sepárele las piernas y coloque su pie en medio, coloque sus brazos alrededor de la cintura de la víctima. Hacer un puño con una mano. Colocar el lado del pulgar del puño en medio del abdomen de la víctima, dos dedos por arriba del ombligo."},{"li":"Agarrar el puño con la otra mano. Con los codos despegados de la víctima, presionar el abdomen con el puño, con movimientos rápidos compresivos. Al presionar, asegurarse que el puño esté directamente en medio del abdomen de la víctima."},{"li":"Realizar movimiento rápido y fuerte hacia atrás y hacia arriba. Hasta que se despeje la obstrucción o hasta que la persona quede inconsciente. Hay que pensar en cada presión como un intento separado y único por liberar la vía aérea."},{"li":"Quizás no se pueda poner los brazos alrededor de la cintura, de ciertas víctimas de atragantamiento para presionarles el abdomen de manera efectiva. Por ejemplo, la persona puede ser sumamente obesa, o estar en las últimas etapas del embarazo. En el caso de una mujer embarazada, presionarle el abdomen puede ser peligroso. En ambos casos, se les presiona él pecho."},{"li":"Colocación de los brazos."},{"p":"Mientras la persona esta parada o sentada, hay que pararse detrás de ella y poner los brazos por debajo de las axilas y alrededor del pecho. Colocar el lado del pulgar del puño en medio del esternón. Cerciorarse que el puño esté justo en medio del esternón, y sobre las costillas. Asegurarse también que el puño no está cerca del extremo inferior del esternón."},{"li":"Tomarse el puño con la otra mano y presionar."},{"li":"Presionar repetidas veces hasta que se despeje la obstrucción o hasta que la persona quede inconsciente. Hay que pensar en cada presión como un intento separado para liberar la vía aérea."},{"h":"CUÁNDO DEJAR DE PRESIONAR EL ABDOMEN O EL PECHO"},{"p":"Se debe dejar de presionar el abdomen o el pecho tan pronto como la víctima arroje el objeto o si la persona comienza a respirar o a toser."},{"p":"Hay que observarla y cerciorarse que el objeto haya salido de la vía respiratoria y que la persona respira libremente."},{"p":"Aun cuando haya arrojado el objeto, la persona puede seguir teniendo problemas al respirar y que no son aparentes. Hay que tener en cuenta también que al presionar el abdomen o el pecho se pueden causar lesiones internas. Por estas razones, se debe llevar a la persona a la sala de urgencias de un hospital aun cuando aparentemente esté respirando bien."},{"h":"PACIENTE INCONSCIENTE"},{"p":"Acostar a la víctima sobre su espalda volteándole el cuerpo entero como una unidad. Es importante colocar a la víctima en esta posición tan pronto como sea posible esto no debe tomar más de 10 segundos. Se inicia RCP de inmediato."},{"p":"Cada vez que abra la boca para administrar las respiraciones correspondientes al ciclo de RCP, busque el cuerpo extraño en la cavidad oral. Si lo observa retírelo, en caso contrario continúe con RCP."},{"h":"CADENA DE SUPERVIVENCIA"},{"p":"Los eslabones de la cadena de supervivencia son los siguientes:"},{"p":"1. Reconocimiento inmediato del paro cardíaco."},{"p":"2. Activación del sistema de respuesta de emergencias."},{"p":"3. RCP precoz con énfasis en las compresiones torácicas."},{"p":"4. Desfibrilación rápida."},{"p":"5. Soporte vital avanzado efectivo."},{"p":"6. Cuidados integrados pos-paro cardíaco (son cuidados que se le proporcionan al paciente después de administrar RCP, esto por personal médico)."},{"h":"REANIMACIÓN CARDIOPULMONAR (RCP)"},{"p":"El paro cardio-respiratorio es la interrupción repentina y simultánea de la respiración y el funcionamiento del corazón, debido a la relación que existe entre el sistema respiratorio y circulatorio. Puede producirse el paro respiratorio y el corazón seguir funcionando, pero en pocos minutos sobrevenir el paro cardíaco, cuando no se presta el primer auxilio inmediatamente."},{"p":"Cuando el corazón no funciona normalmente la sangre no circula, se disminuye el suministro de oxígeno a todas las células del cuerpo, provocando un daño en los demás tejidos conforme pasa el tiempo."},{"p":"La reanimación cardiopulmonar (RCP) es el conjunto de técnicas manuales y mecánicas que se aplican a una víctima que ha sufrido un paro cardio-respiratorio, con el objetivo de:"},{"p":"1. Mantener la sangre circulando y llevar oxígeno a todos los órganos del cuerpo."},{"p":"2. Mantener los pulmones oxigenados cuando la respiración se ha detenido."},{"p":"Es necesario iniciar la RCP tan pronto como sea posible, después de que el corazón deja de latir. Cualquier demora en iniciar la reanimación cardiopulmonar reduce la posibilidad de que el servicio médico de urgencia pueda reanimar el corazón."},{"p":"Además, las células del cerebro comienzan a morir después de cuatro a seis minutos sin oxígeno, provocando daño permanente."},{"p":"Al determinar que un paciente se encuentre inconsciente, se deberá aplicar el protocolo CVR."},{"p":"1. Determinar si la víctima tiene pulso carotideo de 8 a 10 segundos."},{"p":"En caso de no localizarse pulso carotideo durante la evaluación inicial se tendrá que iniciar con RCP de inmediato."},{"p":"Para que las compresiones en el pecho funcionen, verifique los siguientes puntos:"},{"li":"La víctima debe de estar acostada de espalda sobre una superficie firme y plana."},{"li":"La cabeza al mismo nivel que el corazón."},{"li":"Sitúese al lado de la víctima."},{"li":"Se localiza el reborde costal siguiéndolo hasta encontrar la punta inferior del esternón. Una vez localizado se colocan dos dedos hacia arriba y posteriormente se coloca el talón de su mano con los dedos levantados y la otra mano abrazándola."},{"li":"También se puede localizar el punto de compresión trazando una línea imaginaria entre las tetillas y colocándose en medio del esternón."},{"p":"Esta posición permite presionar directamente hacia abajo, sobre el esternón y mantener la presión de la mano fuera del alcance de las costillas y lejos del extremo del esternón. Así se disminuirá el riesgo de fracturar las costillas a ambos lados del esternón."},{"p":"También se evitará empujar el extremo inferior del esternón sobre los órganos delicados ubicados debajo del mismo."},{"h":"TÉCNICA DE COMPRESIÓN"},{"p":"1. Al comprimir, se empuja con el peso del cuerpo y no con los músculos de los brazos."},{"p":"Hay que empujar directamente hacia abajo, ya que si se balancea hacia adelante y hacia atrás y no se empuja directamente hacia abajo, las compresiones no serán efectivas."},{"p":"2. Una profundidad de las compresiones de al menos 5 cm (2 pulgadas) en adultos."},{"p":"3. Mantener un ritmo descendente y ascendente uniforme, sin hacer pausas entre las compresiones. La mitad de tiempo debe de ser para empujar hacia abajo y la mitad del tiempo para subir. Dejar de ejercer presión sobre el pecho completamente, pero no permitir que sus manos pierdan contacto con el pecho, ni perder la posición correcta sobre el esternón."},{"p":"4. Una frecuencia de compresión de al menos 100 compresiones por minuto."},{"p":"5. Si las manos pierden contacto con el pecho, se deberá volver a colocar en posición antes de comprimir nuevamente. Localizar el “punto de compresión” como se hizo antes, para colocar las manos correctamente."},{"p":"Se darán 30 compresiones contando siempre en voz alta, para posteriormente despejar la vía respiratoria y dar 2 respiraciones completas. Después de dar un periodo de 5 ciclos se evaluará pulso y respiración, si permanecen ausentes, se iniciará un nuevo ciclo de RCP."},{"p":"Se darán 30 compresiones contando siempre en voz alta, para posteriormente despejar la vía respiratoria y dar 2 respiraciones completas. Después de dar un periodo de 5 ciclos se evaluará pulso y respiración, si permanecen ausentes, se iniciará un nuevo ciclo de RCP."},{"p":"Una vez recuperado el pulso, la respiración, y liberada la vía aérea, la persona afectada debe ser colocada en posición de recuperación, la cual consiste en colocar a la persona de lado con una pierna flexionada para que no gire en ningún sentido."},{"h":"CUANDO DEJAR DE DAR RCP"},{"p":"1. Cuando la persona tenga pulso y respire."},{"p":"2. Cuando llegue el servicio médico de urgencias."},{"p":"3. Por cansancio."},{"p":"4. Cuando un médico lo indique."},{"h":"DEA (Desfibrilador Automático Externo)"},{"p":"Los Desfibriladores Automáticos Externos (DEA), permiten desfibrilación en una variedad de escenarios, aún por personas no entrenadas en reconocimiento del ritmo y desfibrilación manual. Los DEA están equipados con electrodos desechables autoadhesivos, los cuales no solamente graban la señal de ECG (Electrocardiograma) sino que también liberan la energía de desfibrilación."},{"p":"Los DEA incor
